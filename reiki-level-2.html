<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reiki Level 2</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2438; --muted:#6b6478; --line:#ebe5dc;
  --ok:#1d7a4c; --bad:#b0322e;
  --rainbow:linear-gradient(90deg,#d64541,#f08a24,#f4b400,#2fa36b,#2e86de,#3c4fc6,#9b3fb5);
  /* current lesson's chakra color, set by script */
  --c:#d64541; --c-deep:#a8322f; --c-soft:#fbe9e8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:relative}
header h1{font-size:19px;margin:0;font-weight:normal;letter-spacing:.4px}
header h1 small{font:12px system-ui,sans-serif;opacity:.7;margin-left:8px;letter-spacing:1px;text-transform:uppercase}
header .prog{margin-left:auto;font:13px/1 system-ui,sans-serif;opacity:.9}
.track{height:6px;background:#e9e3ef;position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--rainbow);background-size:100vw 100%;transition:width .4s}
#menuBtn{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer}
.wrap{flex:1;display:flex;min-height:0}
nav{width:290px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 0;font:15px/1.35 system-ui,sans-serif}
nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:10px 18px 10px 14px;color:var(--ink);cursor:pointer;font:inherit}
nav button:hover{background:var(--soft)}
nav button.active{background:var(--soft);font-weight:600;border-left-color:var(--col)}
nav button:disabled{color:#aaa;cursor:not-allowed}
nav .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--col);margin-top:1px;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff}
nav .done .dot{background:var(--col)}
main{flex:1;overflow-y:auto;padding:32px 20px 40px}
article{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:34px 40px}
article h2{color:var(--c-deep);margin:0 0 6px;font-size:30px;font-weight:normal}
article .kicker{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:var(--c-deep);margin-bottom:4px}
article h3{margin:28px 0 6px;font-size:19px}
article a{color:var(--c-deep)}
.callout{background:var(--c-soft);border-left:4px solid var(--c);padding:12px 16px;border-radius:6px;margin:18px 0}
.callout.warn{background:#fdf3dc;border-color:#f4b400}
.principles{list-style:none;padding:0;margin:16px 0}
.principles li{padding:10px 14px;border-bottom:1px solid var(--line);font-style:italic}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft)}
.fig{margin:22px 0;text-align:center}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font:14px system-ui,sans-serif;color:var(--muted);margin-top:8px}
.principles li:nth-child(1){border-left:4px solid #d64541}.principles li:nth-child(2){border-left:4px solid #f08a24}.principles li:nth-child(3){border-left:4px solid #f4b400}.principles li:nth-child(4){border-left:4px solid #2fa36b}.principles li:nth-child(5){border-left:4px solid #3c4fc6}
.chakra{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.footer-nav{max-width:760px;margin:20px auto 0;display:flex;justify-content:space-between;gap:12px}
.btn{display:inline-block;background:var(--c-deep);color:#fff!important;border:0;border-radius:8px;padding:11px 22px;font:15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.secondary{background:#fff;color:var(--c-deep)!important;border:1px solid var(--c-deep)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rainbow-rule{height:4px;border:0;border-radius:2px;background:var(--rainbow);margin:26px 0}
.teacher{display:flex;gap:16px;align-items:center;background:var(--c-soft);border-radius:10px;padding:16px 18px;margin:18px 0}
.teacher .badge{flex:0 0 54px;height:54px;border-radius:50%;background:var(--rainbow);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 14px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;color:#fff;font:600 15px/32px system-ui,sans-serif;text-align:center;background:var(--sc,#888)}
.steps li:nth-child(1){--sc:#d64541}.steps li:nth-child(2){--sc:#2fa36b}.steps li:nth-child(3){--sc:#3c4fc6}
.steps .btn{margin-top:8px;margin-right:8px}
.paybox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px}
.paybox img{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;background:#fff}
.paybox .addr{font:14px system-ui,sans-serif;color:var(--muted)}
.paybox .addr strong{color:var(--ink)}
.q{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
.q p{margin:0 0 10px;font-weight:600}
.q label{display:block;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:16px}
.q label:hover{background:var(--c-soft)}
.q.right{border-color:var(--ok)} .q.wrong{border-color:var(--bad)}
.q .fb{font:14px system-ui,sans-serif;margin-top:8px}
.q.right .fb{color:var(--ok)} .q.wrong .fb{color:var(--bad)}
.result{padding:20px;border-radius:10px;margin-top:20px}
.result.fail{background:#f9e6e5;color:var(--bad);text-align:center;font-size:19px}
.cert{text-align:center;border-radius:12px;padding:26px 20px;background:#fff;border:2px solid transparent;background-image:linear-gradient(#fff,#fff),var(--rainbow);background-origin:border-box;background-clip:padding-box,border-box}
.cert .big{font-size:26px;color:var(--ink);margin:4px 0}
.cert .meta{font:14px system-ui,sans-serif;color:var(--muted)}
@media (max-width:820px){
  #menuBtn{display:block}
  nav{position:fixed;top:58px;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  nav.open{transform:none}
  article{padding:24px 18px}
  main{padding:16px 12px 30px}
  header h1 small{display:none}
}
/* ===== Hand-position figures ===== */
.rkfig{display:block;width:100%;height:auto}
.rkfig .tbl{fill:#fbf8f3;stroke:#d9d1c4;stroke-width:1.5}
.rkfig .pillow{fill:#fff;stroke:#d9d1c4;stroke-width:1.2}
.rkfig .chair{fill:#ece5f2;stroke:#cfc5da;stroke-width:1.2}
.rkfig .chairl{stroke:#cfc5da;stroke-width:5;stroke-linecap:round;fill:none}
.rkfig .body path,.rkfig .body rect,.rkfig .body ellipse{fill:#efe6db;stroke:#8c8296;stroke-width:1.6;stroke-linejoin:round}
.rkfig .hair{fill:#7a675c;stroke:#5d4d44;stroke-width:1}
.rkfig .face{fill:none;stroke:#7d7288;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.rkfig .fold,.rkfig .spine{fill:none;stroke:#b3a9bb;stroke-width:1.2;stroke-linecap:round}
.rkfig .spine{stroke-dasharray:3 4}
.rkfig .limb-o{fill:none;stroke:#8c8296;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.rkfig .limb{fill:none;stroke:#efe6db;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.rkfig .parm{stroke:#c4572f;stroke-opacity:.28;stroke-width:15;stroke-linecap:round}
.rkfig .hand path,.rkfig .hand ellipse{fill:#d0683f;stroke:#7e2f13;stroke-width:1.3;stroke-linejoin:round}
.rkfig .hand .fl{fill:none;stroke:#7e2f13;stroke-opacity:.55;stroke-width:1}
.rkfig .hand.hover path,.rkfig .hand.hover ellipse{fill:#d0683f;fill-opacity:.16;stroke:#b0461f;stroke-dasharray:3.5 2.5;stroke-width:1.6}
.rkfig .hand.hover .fl{stroke-dasharray:none;stroke-opacity:.35}
.rkfig .hand.under path,.rkfig .hand.under ellipse{fill:#d0683f;fill-opacity:.38;stroke:#7e2f13;stroke-opacity:.75;stroke-dasharray:1.5 2.5}
.rkfig .badge circle{fill:#2b2438}
.rkfig .badge text{fill:#fff;font:700 12px system-ui,sans-serif}
.rkfig .sweep{fill:none;stroke:#2e86de;stroke-width:2.2;stroke-dasharray:6 5;stroke-linecap:round}
.rkfig .sweep-h{fill:none;stroke:#2e86de;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig-key{display:flex;flex-wrap:wrap;gap:6px 18px;font:13px system-ui,sans-serif;color:var(--muted);margin:8px 0 14px}
.fig-key span{display:inline-flex;align-items:center;gap:6px}
.fig-key i{display:inline-block;width:20px;height:12px;border-radius:6px;background:#d0683f;border:1.3px solid #7e2f13}
.fig-key i.hv{background:rgba(208,104,63,.16);border:1.6px dashed #b0461f}
.fig-key i.un{background:rgba(208,104,63,.5);border:1.3px dotted #7e2f13}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:16px 0}
.pos{margin:0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.pos .pfig{background:#fdfbf8;border-bottom:1px solid var(--line);padding:6px 10px 0;display:flex;justify-content:center}
.pos .pfig svg{max-width:220px;max-height:230px}
.pos figcaption{padding:10px 14px 14px;font:14.5px/1.5 system-ui,sans-serif}
.pos figcaption strong{display:block;font-size:16px;margin-bottom:2px}
.pos .where{display:inline-block;font-size:12px;letter-spacing:.3px;color:var(--c-deep);background:var(--c-soft);border-radius:999px;padding:1px 9px;margin:2px 0 6px}
.pos .hv-tag{display:inline-block;font-size:12px;color:#8a3a12;background:#fbe7dc;border-radius:999px;padding:1px 9px;margin:2px 0 6px 4px}
.pos p{margin:4px 0}
.pos .sym{color:var(--muted)}
.pos .sym b{color:var(--ink);font-weight:600}
.pos .trad{color:var(--muted);font-size:13px}
.pos .red{background:#fde8e6;color:#8e231d;border-radius:8px;padding:6px 8px;font-size:13px}
.pos .pg{font-size:12px;color:var(--muted)}
.part-h{font:600 13px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--c-deep);margin:22px 0 0}
.obj{background:var(--c-soft);border-radius:10px;padding:12px 18px;margin:18px 0}
.obj-h{font:600 12px system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--c-deep);margin:0 0 4px}
.obj ul{margin:4px 0;padding-left:20px}
.practice{border:2px dashed var(--c);border-radius:10px;padding:12px 18px;margin:24px 0}
.practice p{margin:6px 0}
.script{border-left:4px solid var(--c);background:#faf8f5;padding:12px 16px;border-radius:6px;font-style:italic;margin:12px 0}
.flow{counter-reset:f;list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.flow li{counter-increment:f;background:var(--c-soft);border-radius:999px;padding:6px 14px 6px 8px;font:14px system-ui,sans-serif}
.flow li::before{content:counter(f);display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--c-deep);color:#fff;text-align:center;font:600 12px/22px system-ui,sans-serif;margin-right:8px}
.ck{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 16px;margin:18px 0;font:15px system-ui,sans-serif}
.ck-h{font:600 12px system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--c-deep);margin:0}
.ck-q{font-weight:600;margin:4px 0 10px}
.ck-opts{display:flex;flex-direction:column;gap:6px}
.ck-opts button{text-align:left;background:#fff;border:1px solid #c9c1d3;border-radius:8px;padding:9px 12px;font:15px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.ck-opts button:hover:not(:disabled){background:var(--c-soft)}
.ck-opts button.pick-ok{border-color:var(--ok);background:#e6f4ec}
.ck-opts button.pick-bad{border-color:var(--bad);background:#fbeceb}
.ck-opts button:disabled{cursor:default;color:var(--ink)}
.ck-fb{margin:8px 0 0;min-height:1px}
.ck-fb.ok{color:var(--ok)} .ck-fb.bad{color:var(--bad)}
.lib-tools{background:var(--card);padding:10px 0 4px;border-bottom:1px solid var(--line)}
@media (min-width:821px){.lib-tools{position:sticky;top:-32px;z-index:2}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid #c9c1d3;background:#fff;border-radius:999px;padding:5px 12px;font:13.5px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--c-deep);border-color:var(--c-deep);color:#fff}
.lib-search input{width:100%;max-width:360px;padding:8px 12px;border:1px solid #b9b1c4;border-radius:8px;font:16px system-ui,sans-serif;margin-top:6px}
.lib-count{font:13px system-ui,sans-serif;margin:6px 0 0}
.lib-item[hidden]{display:none}
body.pl-open{overflow:hidden}
.player{position:fixed;inset:0;z-index:40;background:rgba(32,26,42,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.pl-box{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:100%;overflow:auto;padding:16px 20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.pl-top{display:flex;justify-content:space-between;align-items:center;font:600 13px system-ui,sans-serif;color:var(--c-deep);letter-spacing:.5px;text-transform:uppercase}
.pl-x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px}
.pl-body{display:flex;gap:20px;align-items:center;margin:8px 0 12px}
.pl-fig{flex:0 0 46%;background:#fdfbf8;border-radius:10px;display:flex;justify-content:center;min-height:120px}
.pl-fig svg{max-height:52vh}
.pl-text h3{margin:0 0 4px;font-size:24px;font-weight:normal;color:var(--c-deep)}
.pl-text p{margin:8px 0;font-size:17px}
.pl-text .sym{font:15px system-ui,sans-serif;color:var(--muted)}
.pl-ctrl{border-top:1px solid var(--line);padding-top:12px}
.pl-time{font:600 34px/1 ui-monospace,Menlo,Consolas,monospace;text-align:center}
.pl-bar{height:6px;background:#eee8f2;border-radius:3px;margin:10px 0;overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--rainbow);background-size:820px 100%;transition:width .25s linear}
.pl-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pl-opts{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font:14px system-ui,sans-serif;color:var(--muted);margin-top:10px}
.pl-opts select{font:14px system-ui,sans-serif;padding:3px 6px;margin-left:4px}
@media (max-width:640px){
  .pl-body{flex-direction:column;gap:8px}
  .pl-fig{flex:none;width:100%}
  .pl-fig svg{max-height:34vh}
  .pl-text h3{font-size:20px}
  .pl-text p{font-size:16px}
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
}
@media print{.player,.lib-tools,[data-follow]{display:none!important}.pos{break-inside:avoid}}
/* ===== Saved progress, practice log, accessibility ===== */
.skip{position:absolute;left:-9999px;top:8px;z-index:20;background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;font:15px system-ui,sans-serif}
.skip:focus{left:8px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hbtn{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtns{display:flex;gap:8px;margin-left:12px}
:focus-visible{outline:3px solid #2e86de;outline-offset:2px}
article h2:focus{outline:none}
.status{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font:15px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.status.show{opacity:1;transform:translate(-50%,0)}
.complete-box{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:34px;padding:16px 18px;border:2px dashed var(--c);border-radius:10px;font:15px system-ui,sans-serif}
.complete-box span{color:var(--muted)}
.complete-box.is-done{border-style:solid;background:var(--c-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--c-deep);text-decoration:underline;cursor:pointer;font:inherit}
.todo li{margin:6px 0}
.codebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.codebox code{font:600 20px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px;background:var(--c-soft);padding:10px 14px;border-radius:8px;word-break:break-all}
.codebox input,.logform input,.logform select,.logform textarea{padding:9px 12px;border:1px solid #b9b1c4;border-radius:8px;font:16px system-ui,sans-serif;background:#fff;color:var(--ink)}
.codebox input{width:16em;max-width:100%;text-transform:uppercase;letter-spacing:1px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid #2e86de;outline-offset:2px}
.btn.danger{color:var(--bad)!important;border-color:var(--bad)}
.form-msg{font:15px system-ui,sans-serif;min-height:1px;margin:6px 0}
.form-msg.ok{color:var(--ok)} .form-msg.bad{color:var(--bad)}
.muted{color:var(--muted)}
.log-summary{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.log-summary div{flex:1 1 110px;background:var(--c-soft);border-radius:10px;padding:10px 12px;text-align:center;font:13px system-ui,sans-serif;color:var(--muted)}
.log-summary strong{display:block;font-size:24px;color:var(--ink)}
.logform{border:1px solid var(--line);border-radius:10px;padding:4px 18px 16px;margin:18px 0}
.logform label{display:block;font:15px system-ui,sans-serif;margin:10px 0}
.logform label input,.logform label select,.logform label textarea{display:block;width:100%;margin-top:4px}
.logform .row{display:flex;gap:12px;flex-wrap:wrap}
.logform .row label{flex:1 1 140px}
.logform .hint{color:var(--muted);font-size:13px}
.log-actions{margin:12px 0 4px}
.log-list{padding-left:22px}
.log-list li{border-bottom:1px solid var(--line);padding:10px 0}
.log-list p{margin:4px 0;font-size:16px}
.log-head{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font:15px system-ui,sans-serif}
.log-head .del{margin-left:auto;color:var(--bad);font-size:14px}
fieldset.q{display:block;min-width:0;margin:16px 0}
fieldset.q legend{font-weight:600;padding:0 4px;margin-bottom:6px}
@media (max-width:820px){
  header{padding:12px 12px;gap:8px}
  header .prog{display:none}
  .hbtns{margin-left:auto;gap:6px}
  .hbtn,#menuBtn{padding:6px 8px;font-size:13px}
}
@media (max-width:420px){
  header h1{font-size:16px}
  .hbtn .lbl{display:none}
}
@media print{
  header,nav,.track,.footer-nav,.status,.skip,.no-print,.complete-box{display:none!important}
  html,body,.wrap,main{display:block;height:auto;overflow:visible;background:#fff}
  main{padding:0}
  article{border:0;padding:0;max-width:none}
  a{color:inherit}
}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to lesson</a>
<header>
  <button id="menuBtn" aria-controls="nav" aria-expanded="false">☰ Lessons</button>
  <h1>Reiki Level 2 <small>Okuden</small></h1>
  <span class="prog" id="prog"></span>
  <div class="hbtns"><button class="hbtn" id="logBtn" aria-label="Practice log"><span aria-hidden="true">📓</span><span class="lbl"> Practice log</span></button><button class="hbtn" id="progressBtn" aria-label="My progress"><span aria-hidden="true">💾</span><span class="lbl"> My progress</span></button></div>
</header>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="wrap">
  <nav id="nav" aria-label="Lessons"></nav>
  <main id="main">
    <article id="content" tabindex="-1"></article>
    <div class="footer-nav">
      <button class="btn secondary" id="prevBtn">← Back</button>
      <button class="btn" id="nextBtn">Next →</button>
    </div>
  </main>
</div>

var FIG=(function(){
  function f(n){return Math.round(n*10)/10;}
  function rot(x,y,a){var r=a*Math.PI/180;return [x*Math.cos(r)-y*Math.sin(r),x*Math.sin(r)+y*Math.cos(r)];}

  var FINGERS="M-4.1,-5.5 L-4.1,-19 M0,-5.5 L0,-20.6 M4.1,-5.5 L4.1,-19";
  var TWO="M-4,13 L-4,-11 Q-4,-15 0,-15 Q4,-15 4,-11 L4,13 Z";
  function hand(h,arms){
    var s=h.s||1,a=h.a||0,k=h.k||"touch",out="";
    var w=rot(0,19*s,a),wx=h.x+w[0],wy=h.y+w[1];
    if(arms==="prac"&&h.arm!==false){
      var ad=(h.arm!==undefined?h.arm:a+180)*Math.PI/180, L=h.al||90;
      out+='<line class="parm" x1="'+f(wx)+'" y1="'+f(wy)+'" x2="'+f(wx+Math.sin(ad)*L)+'" y2="'+f(wy-Math.cos(ad)*L)+'"/>';
    }
    out+='<g class="hand '+k+'" transform="translate('+f(h.x)+' '+f(h.y)+') rotate('+a+') scale('+s+')">';
    if(h.two)out+='<path d="'+TWO+'"/><path class="fl" d="M0,-12 L0,10"/>';
    else{
      var t=h.t||1;
      out+='<ellipse class="th" cx="'+(t*9.5)+'" cy="3" rx="3.4" ry="8.5" transform="rotate('+(t*-16)+' '+(t*9.5)+' 3)"/>';

/* ===== Hands-on lessons: helpers ===== */
function figKey(){return '<div class="fig-key" aria-hidden="true"><span><i></i>Hands resting lightly on the body</span><span><i class="hv"></i>Hovering just above the body</span><span><i class="un"></i>Hands slid underneath</span></div>';}
function figFor(p,who,n){return FIG.draw(Object.assign({},p.fig,{who:who,n:n,label:(n?"Position "+n+": ":"")+p.name+". "+p.how}));}
function posCard(p,who,opts){
  opts=opts||{};
  var hover=(p.fig.hands||[]).some(function(h){return h.k==="hover";});
  return '<figure class="pos"><div class="pfig">'+figFor(p,who,opts.num===false?null:p.n)+'</div><figcaption>'
    +'<strong>'+(opts.num===false?'':p.n+'. ')+p.name+'</strong>'
    +(p.where?'<span class="where">'+p.where+'</span>':'')+(hover?'<span class="hv-tag">Hover</span>':'')
    +'<p>'+p.how+'</p>'
    +(p.sym?'<p class="sym"><b>Symbols:</b> '+p.sym+'</p>':'')
    +(p.trad?'<p class="trad">'+p.trad+'</p>':'')
    +'</figcaption></figure>';
}
function posGrid(list,who,opts){return '<div class="pos-grid">'+list.map(function(p){return posCard(p,who,opts);}).join("")+'</div>';}
function followBtn(seq,label){return '<p><button class="btn" data-follow="'+seq+'">▶ '+(label||"Follow along")+'</button> <span class="muted" style="font:14px system-ui,sans-serif">One position at a time, with a timer and a soft chime.</span></p>';}
function check(q,opts,c,why){
  return '<div class="ck" data-c="'+c+'" data-why="'+why.replace(/"/g,"&quot;")+'"><p class="ck-h">Check yourself</p><p class="ck-q">'+q+'</p><div class="ck-opts">'
    +opts.map(function(o,i){return '<button type="button" data-i="'+i+'">'+o+'</button>';}).join("")+'</div><p class="ck-fb" aria-live="polite"></p></div>';
}
function objectives(items){return '<div class="obj"><p class="obj-h">In this lesson you will</p><ul>'+items.map(function(i){return '<li>'+i+'</li>';}).join("")+'</ul></div>';}
function practiceBox(t){return '<div class="practice"><p class="obj-h">Practice before the next lesson</p>'+t+'<p><button class="linkbtn" data-open-log="1">Open your practice log</button></p></div>';}

/* ===== Lesson: Self-Healing with the Symbols ===== */
function lessonSelf(k){return `
<div class="kicker">Lesson ${k}</div>
<h2>Self-Healing with the Symbols</h2>
<p>Hawayo Takata taught her students to treat themselves first, then their families and friends, and only then other people. Your daily self-treatment is still the heart of your Reiki, and at Level 2 the symbols make it deeper and more focused.</p>
${objectives(["follow the full 18-position self-treatment from the Level 1 manual, now with the symbols","choose a shorter routine for busy days","use the symbols in the way that suits each position"])}
<h3>Before you begin</h3>
<ol>
<li><strong>Find a quiet place</strong> where you won't be disturbed. Sit upright in a chair with your feet flat on the floor, or lie down if you prefer. Soft music is fine.</li>
<li><strong>Center yourself</strong> with gassho and a few rounds of Joshin Kokyu Ho breathing, then set your intention.</li>
<li><strong>Power up your hands.</strong> Draw Cho Ku Rei on each palm and say its name three times. For deeper work, draw the Reiki sandwich: Cho Ku Rei, Sei Heiki, Cho Ku Rei.</li>
</ol>
<h3>How to hold your hands</h3>
<ul>
<li>Keep your fingers together and your hands relaxed and slightly cupped.</li>
<li>Rest your hands lightly. There's no pressure and no massage.</li>
<li>Stay <strong>3 to 5 minutes</strong> in each position, or until the sensation in your hands changes. A little Reiki is better than none.</li>
<li>Move one hand at a time, so you stay in contact as you change positions.</li>
</ul>
<h3>The 18 self-treatment positions</h3>
<p>These follow the Level 1 manual's sequence (pp.40–48): head first, then down the front of the body, the knees, the back, and finally the feet. Treat any area that hurts first, then do the full sequence. The positions are a guide; as you gain confidence, let your intuition lead.</p>
${figKey()}
${followBtn("self","Follow along: self-treatment")}
${posGrid(SEQ.self,"self")}
<div class="callout"><strong>Shoulder or arm problems?</strong> If a position strains you, leave it out or lie down with a cushion under your arms. For the back of your body, you can also send Reiki with Hon Sha Ze Sho Nen instead of reaching.</div>
<h3>Bringing the symbols in at each position</h3>
<p>The Level 2 manual describes several ways to place a symbol at a hand position (pp.28–38). Pick whichever feels natural; they all work.</p>
<ul>
<li><strong>Visualize it on your palms</strong> before you place your hands.</li>
<li><strong>Project it from your third eye</strong> onto the backs of your hands as they rest on each position.</li>
<li><strong>Draw it on your palms</strong> with your index finger.</li>
<li><strong>Draw it on the roof of your mouth</strong> with your tongue, then picture it flowing into your hands.</li>
<li><strong>Draw it in the air</strong> over the position.</li>
</ul>
<p>However you place it, say the symbol's name silently three times. You don't need every symbol at every position; Cho Ku Rei at each one, with Sei Heiki at the head, heart and anywhere you hold emotion, is plenty.</p>
<h3>Short routines</h3>
<table>
<tr><th>Routine</th><th>What to do</th></tr>
<tr><td><strong>Quick daily</strong><br>about 15 min</td><td>Positions 1, 2, 4, 7, 9, 11, 17 and 18, two minutes each, with Cho Ku Rei on your palms first.</td></tr>
<tr><td><strong>Morning</strong><br>10 min</td><td>Cho Ku Rei on your palms, then crown (2), heart (7) and solar plexus (9). Send Reiki ahead to your day with Hon Sha Ze Sho Nen.</td></tr>
<tr><td><strong>Bedtime</strong><br>15 min</td><td>Sei Heiki at the back of your head (4), then heart (7) and lower abdomen (11) as you drift off. Lying down is fine.</td></tr>
<tr><td><strong>In the moment</strong><br>1–3 min</td><td>Visualize Sei Heiki and Cho Ku Rei, place one hand on your heart and one on your solar plexus, and breathe.</td></tr>
</table>
<h3>After a self-treatment</h3>
<p>Drink a large glass of water. Sit quietly for a moment and notice any thoughts or feelings that came up. If you feel light-headed, rest until it passes. Then note the session in your practice log.</p>
<h3>Using the symbols on yourself</h3>
<table>
<tr><th>Symbol</th><th>Self-healing use</th></tr>
<tr><td><strong>Cho Ku Rei</strong></td><td>Power up your hands; focus on an area that hurts or feels tight; seal your session; protect your energy for the day.</td></tr>
<tr><td><strong>Sei Heiki</strong></td><td>Ease anxiety, grief or overwhelm; support a habit you're changing; affirmations; better sleep.</td></tr>
<tr><td><strong>Hon Sha Ze Sho Nen</strong></td><td>Send Reiki to your inner child or a past moment; send it ahead to a stressful day; treat yourself at a distance when your hands can't reach, like the back of your body.</td></tr>
</table>
<h3>Healing your past self</h3>
<p>Many practitioners find this one of the most meaningful parts of Level 2. Choose a moment from your past when you needed support. Draw Hon Sha Ze Sho Nen, then Sei Heiki, then Cho Ku Rei. Picture your younger self and send them Reiki, along with whatever words you wish you'd heard then. Go gently, and stop if it feels like too much.</p>
${check("You're short on time but want to keep your daily practice. What's the best approach?",["Skip today; Reiki only works as a full session","Do a shorter routine, such as the quick daily positions","Do only the back positions"],1,"A little Reiki is better than none. A short routine keeps your practice going; do the full 17 positions when you have time.")}
${check("Which position finishes the full self-treatment sequence?",["Hands on the crown","Holding your feet","Hands over the eyes"],1,"The sequence ends by holding your feet, which grounds you. Then seal with Cho Ku Rei and return to gassho.")}
${practiceBox("<p>Give yourself the full 18-position self-treatment at least three times this week, and a short routine on the other days. Log each one: which positions felt warm, tingly or quiet, and which symbols you used.</p>")}
<div class="callout warn">Self-healing supports your wellbeing, but it doesn't replace medical or mental health care. Use Reiki alongside the care of qualified professionals.</div>
`;}

/* ===== Lesson: Preparing to Treat Others ===== */
function lessonPrep(k){return `
<div class="kicker">Lesson ${k}</div>
<h2>Preparing to Treat Others</h2>
<p>Level 2 is traditionally when practitioners begin treating other people more widely. Before you learn the positions, get the foundations right: your space, yourself, your client's consent and comfort, and where you will and won't touch.</p>
${objectives(["prepare a treatment space and yourself","have a clear consent conversation, including touch preferences","know which areas you always hover over","position a client comfortably and recognize when Reiki isn't the right first step"])}
<h3>Prepare the space</h3>
<ul>
<li><strong>A light, clean, safe room</strong> where you won't be interrupted. Silence your phone.</li>
<li><strong>A treatment table</strong> (a massage table is ideal) with two pillows and a light blanket. A sturdy bed or a mat on the floor works for friends and family; protect your back.</li>
<li><strong>A box of tissues</strong> within reach. Emotional release is common, especially around the head and heart.</li>
<li><strong>Optional:</strong> soft music, a plant or crystals. Ask before using incense or scents, since some people are sensitive to them.</li>
<li><strong>Clear the room with Cho Ku Rei</strong>: draw it on each wall, the ceiling, the floor and the table (manual p.63).</li>
</ul>
<h3>Prepare yourself</h3>
<ul>
<li>Remove rings, bracelets and watches, and keep your nails short.</li>
<li>Wash your hands before and after every session.</li>
<li>Avoid alcohol for 24 hours before you treat someone.</li>
<li>Ground and shield yourself, then draw the symbols on your hands.</li>
</ul>
<h3>Welcome your client</h3>
<p>Clients stay fully clothed. Invite them to take off their shoes, glasses and any bulky jewelry, and to loosen tight belts. For a first session, explain what will happen in simple terms:</p>
<div class="script">"You'll lie on the table, fully clothed, and I'll rest my hands lightly on or just above different parts of your body, starting at your head. There's no pressure or massage. Some people feel warmth, tingling or deep relaxation; some people fall asleep; some feel very little. All of that is fine. You can ask me to stop or change anything at any time. Are there any areas you'd prefer I don't touch, or anything about your health I should know?"</div>
<p>Use your intake form for health information and preferences (Lesson ${k+4} covers forms and records). Agree on a simple signal, such as raising a hand, that means "pause" or "stop."</p>
<h3>Touch, hover and the "always hover" areas</h3>
${figKey()}
<p>Reiki works just as well with your hands a few centimeters above the body as on it. Some manual photos show contact on sensitive areas; this course always uses hovering there, which is the safe and professional standard.</p>
<div class="callout warn"><strong>Always hover over:</strong> the throat, the chest and breasts, the groin and pelvic area, and the buttocks. <strong>Also hover over</strong> burns, wounds, recent surgery, fresh injuries, and anywhere the client asks you not to touch. If a client tenses or flinches, lift your hands into a hover and check in quietly.</div>
<h3>Your hands</h3>
<ul>
<li>Keep your fingers together and your hands slightly cupped, "as though holding water."</li>
<li>Rest the weight of your hands in your own arms, never on the client.</li>
<li>Move one hand at a time from position to position so you never fully break contact.</li>
<li>Hold each position for 3 to 5 minutes in a full session, or until the sensation in your hands changes.</li>
<li>Protect your back: sit for the head positions, and raise or lower the table if you can.</li>
</ul>
<h3>Helping your client get comfortable</h3>
<ul>
<li><strong>Face up:</strong> lying flat, arms resting at their sides, legs uncrossed. Put one pillow under the head and the other under the knees to ease the lower back. Offer the blanket; body temperature often drops during Reiki.</li>
<li><strong>Face down:</strong> move the second pillow under the ankles, and use a face cradle or let them turn their head to one side.</li>
<li><strong>Pregnancy, back problems or limited mobility:</strong> side-lying with pillows between the knees, or a chair session (Lesson ${k+2}).</li>
<li><strong>If lying down isn't comfortable at all,</strong> the chair session covers all the main energy centers.</li>
</ul>
<h3>When to pause and refer</h3>
<p>Reiki is gentle and has no known harmful effects, but it never replaces medical care. Never diagnose, never suggest anyone stop medication, and never promise results.</p>
<div class="callout warn"><strong>Get medical help first, and call emergency services in an emergency:</strong> chest pain or pressure, trouble breathing, signs of a stroke (face drooping, arm weakness, slurred speech), severe bleeding, a painful, swollen, warm leg (a possible blood clot), or thoughts of suicide or self-harm. You can give Reiki while you wait for help, but help comes first.</div>
<p><strong>Medical devices and conditions.</strong> Your Level 1 manual advises not treating people with a pacemaker, or people with insulin-dependent diabetes who aren't monitoring their levels. There is no research showing that Reiki affects medical devices or medication, but do follow your client's wishes and their doctor's advice. Note any devices or conditions on the intake form, keep sessions shorter for anyone who is very unwell, and suggest people with diabetes check their levels as usual.</p>
<h3>The shape of a session</h3>
<ol class="flow">
<li>Prepare the space and yourself</li>
<li>Welcome, consent and comfort</li>
<li>Open: Cho Ku Rei to their third eye, symbols on your hands, gassho and Reiji-ho</li>
<li>Scan and cleanse the aura</li>
<li>Hand positions, face up then face down</li>
<li>Close: balance, seal, smooth the aura, give thanks</li>
<li>Aftercare: water, rest, a few words, hand washing</li>
</ol>
${check("A client tenses up when your hands approach their chest. What do you do?",["Keep going; they'll relax","Lift your hands into a hover and quietly check in","Skip straight to the feet without saying anything"],1,"Lift into a hover and check in. Comfort and consent come before any position, and Reiki works just as well above the body.")}
${check("Which of these areas should you always hover over, never touch?",["The shoulders","The throat","The feet"],1,"Always hover over the throat, chest and breasts, groin and pelvic area, and buttocks.")}
${check("During a session your client says they suddenly have chest pain and feel short of breath. What's the right response?",["Place your hands on their heart and continue","Call emergency services right away; give Reiki only while waiting","Tell them it's an energy release and carry on"],1,"Chest pain and breathlessness can be a medical emergency. Get help first; Reiki can support them while they wait.")}
${practiceBox("<p>Set up your treatment space once, as if a client were coming. Then practice the welcome script out loud with a friend, and ask them about their touch preferences.</p>")}
`;}

/* ===== Lesson: The Table Session ===== */
function lessonTable(k){return `
<div class="kicker">Lesson ${k}</div>
<h2>Treating Others: The Table Session</h2>
<p>This is the full treatment for another person lying on a table: 12 positions face up, then 7 face down, followed by a closing. It follows the Level 1 manual's sequence (pp.55–64), with the Level 2 symbols added from the Level 2 manual.</p>
${objectives(["open a session with the symbols, gassho and Reiji-ho","give all 19 positions in order, helping your client turn over","close, seal and smooth the aura, and give aftercare","adapt the session to the time you have"])}
<h3>How long?</h3>
<table>
<tr><th>Session</th><th>Time</th><th>What you do</th></tr>
<tr><td><strong>Full treatment</strong></td><td>60–90 min</td><td>All 19 positions at 3–5 minutes each, plus opening and closing. Best for new clients and deep work.</td></tr>
<tr><td><strong>Standard</strong></td><td>about 45 min</td><td>All 19 positions at about 2 minutes each.</td></tr>
<tr><td><strong>Short Level 2 session</strong></td><td>15–20 min</td><td>Positions 1, 4, 7, 8, 10, 12 and 19, with the Reiki sandwich at each. The Level 2 manual says the symbols let you give a full treatment in about 15 minutes (p.22).</td></tr>
</table>
<h3>Opening the session</h3>
<ol>
<li><strong>Room and self ready</strong> (Lesson ${k-1}): Cho Ku Rei on the walls, ceiling, floor and table; hands washed; grounded and shielded.</li>
<li><strong>Welcome and consent.</strong> Check in, confirm touch preferences, and help your client lie face up with a pillow under the head and knees. Offer the blanket.</li>
<li><strong>Project Cho Ku Rei onto their third eye</strong> to help them relax (manual p.63).</li>
<li><strong>Draw the symbols on your hands:</strong> the Reiki sandwich (Cho Ku Rei, Sei Heiki, Cho Ku Rei), saying each name three times.</li>
<li><strong>Gassho and Reiji-ho at the head of the table.</strong> Ask Reiki to flow, ask for healing for their highest good, then raise your joined hands to your forehead and ask to be guided (Lesson ${k-3}).</li>
<li><strong>Scan and cleanse the aura.</strong> Pass your hands slowly from head to feet about 15 cm (6 in) above the body, noticing warmth, coolness or tingling. Then sweep through the aura three times, head to feet, to clear it. Start where you felt drawn, then begin the positions.</li>
</ol>
<h3>Positions 1–12: face up</h3>
${figKey()}
${followBtn("table","Follow along: table session")}
<p class="part-h">At the head (sit if you can)</p>
${posGrid(SEQ.table.slice(0,6),"prac")}
<p class="part-h">At the side, then the feet</p>
${posGrid(SEQ.table.slice(6,12),"prac")}
<h3>Helping your client turn over</h3>
<ol>
<li>Quietly let them know you've finished the front. If they've fallen asleep, wake them gently with a light touch on the shoulder and a soft word.</li>
<li>Hold the blanket up and step back while they turn. There's no rush.</li>
<li>Move the pillow from under their knees to under their ankles. Offer a face cradle, or let them rest their head turned to one side on a flat pillow.</li>
<li>Replace the blanket and check they're comfortable before you continue. If lying face down isn't comfortable, treat the back with your client lying on their side, or skip to the closing.</li>
</ol>
<h3>Positions 13–19: face down</h3>
${posGrid(SEQ.table.slice(12),"prac")}
<h3>Closing the session</h3>
${posGrid(SEQ.closing,"prac",{num:false})}
<ol>
<li><strong>Balance and seal:</strong> the balancing hold, then Cho Ku Rei over the whole body.</li>
<li><strong>Smooth the aura</strong> three times from head to feet.</li>
<li><strong>Give thanks</strong> to Reiki, silently.</li>
<li><strong>Let your client rest</strong> for a minute or two. Tell them quietly that the session is complete and to take their time.</li>
<li><strong>Help them up safely:</strong> roll onto one side, then push up to sitting. Let them sit for a moment before they stand; some people feel light-headed.</li>
<li><strong>Offer a glass of water.</strong></li>
<li><strong>Cleanse yourself:</strong> wash your hands in cold running water, drink a glass of cold water to ground yourself, do Kenyoku, and release the connection (manual p.41).</li>
</ol>
<h3>Aftercare: what to tell your client</h3>
<ul>
<li>Drink plenty of water today, and rest if you can.</li>
<li>You may feel relaxed, sleepy or more emotional than usual for a day or so. That's common.</li>
<li>Notice how you sleep and feel over the next few days.</li>
<li>Reiki works alongside medical care. If you have any health concerns, please see your doctor.</li>
</ul>
<p>Listen to how they felt without interpreting it or offering a diagnosis. If you're using the affirmation technique (manual p.63), give them their written affirmation to read each day.</p>
<h3>Using the symbols during the session</h3>
<table>
<tr><th>When</th><th>What to do</th></tr>
<tr><td>At every position</td><td>Visualize Cho Ku Rei on the backs of your hands (or picture it entering the body), saying its name silently three times.</td></tr>
<tr><td>Head and heart positions</td><td>Add Sei Heiki, or the full sandwich, for mental and emotional healing.</td></tr>
<tr><td>Where your hands are drawn</td><td>Stay longer and use the Reiki sandwich (Chiryo, Lesson ${k-3}).</td></tr>
<tr><td>Affirmations</td><td>Agree an affirmation with your client, then silently repeat it at each new position, paying special attention to the third eye (manual p.63).</td></tr>
<tr><td>Closing</td><td>Cho Ku Rei over the whole body to seal.</td></tr>
</table>
<h3>Protecting yourself as your practice grows</h3>
<ul>
<li>Add Cho Ku Rei to your shield of light: picture it in front of you, behind you, on each side, above and below.</li>
<li>Draw Cho Ku Rei over your hands after washing them between clients.</li>
<li>Use Sei Heiki at the end of a heavy day to release what you've carried.</li>
<li>Keep up your own daily self-healing. It's still your most important protection.</li>
</ul>
${check("You've finished position 12 at the feet. What comes next?",["The balancing hold","Quietly ask your client to turn over","Smooth the aura"],1,"After the front positions, help your client turn over for positions 13–19. The balancing hold and aura smoothing come at the very end.")}
${check("How do you move from one hand position to the next?",["Lift both hands away, then place them again","Move one hand at a time so you stay in contact","Slide both hands along the body with pressure"],1,"Moving one hand at a time keeps a continuous, reassuring connection.")}
${check("How does the manual's table session finish, before the aura smoothing?",["Left hand on the crown, right hand at the base of the spine","Both hands on the knees","Both hands over the eyes"],0,"The balancing hold, crown and base of the spine, evens out the energy in the body. Then seal with Cho Ku Rei and smooth the aura three times.")}
${practiceBox("<p>Give at least three full table sessions to friends or family who have said yes, using the follow-along player if it helps. Log each session, and ask your partner for one piece of feedback: what felt good, and what was uncomfortable.</p>")}
`;}

/* ===== Lesson: The Chair Session ===== */
function lessonChair(k){return `
<div class="kicker">Lesson ${k}</div>
<h2>Treating Others: The Chair Session</h2>
<p>A seated session (the Level 1 manual calls it Rapid Reiki, pp.65–72) covers the major energy centers in 15 to 30 minutes. It's ideal when there's no table, at events and workplaces, and for anyone who can't lie down comfortably, including many pregnant clients and people with back or mobility problems.</p>

</ul>
<h3>The nine seated positions</h3>
${figKey()}
${followBtn("chair","Follow along: chair session")}
${posGrid(SEQ.chair,"prac")}

<p>Smooth the aura three times from head to feet, seal with Cho Ku Rei and give thanks. Wash your hands in cold water, and offer your client a glass of water. Let them sit for a moment before they stand up.</p>
${check("Which client is the chair session especially suited to?",["Someone who can't lie down comfortably","Only people who are asleep","Only children"],0,"Seated sessions work well for anyone who can't lie down, in short sessions, and where there's no table.")}
${check("In position 4, how should you treat the throat?",["Rest your hand firmly on the throat","Hover in front of the throat, with your other hand at the back of the neck","Skip the throat entirely"],1,"Always hover over the throat. Your other hand can rest at the back of the neck.")}
${practiceBox("<p>Give two seated sessions this week: one of 15 minutes and one of 30. Notice how your hands feel holding front and back together.</p>")}
`;}

/* ===== Lesson: Targeted positions library ===== */
var LIB_AREAS=[["all","All areas"],["head","Head and face"],["throat","Throat and neck"],["chest","Chest and heart"],["abdomen","Abdomen"],["back","Back and spine"],["limbs","Arms, legs and feet"]];
var LIB_GROUPS=[["all","All"],["A","Parts of the body"],["B","Everyday complaints"],["C","Long-term conditions"]];
function libCard(p,i){
  var hover=p.hover||(p.fig.hands||[]).some(function(h){return h.k==="hover";});
  var grp={A:"Parts of the body",B:"Everyday complaints",C:"Long-term conditions"}[p.g];
  return '<figure class="pos lib-item" data-area="'+p.area+'" data-g="'+p.g+'" data-name="'+p.name.toLowerCase()+'"><div class="pfig">'+FIG.draw(Object.assign({},p.fig,{who:p.who==="self"?"self":"prac",label:p.name+". "+p.how}))+'</div><figcaption>'
   +'<strong>'+p.name+'</strong><span class="where">'+(p.who==="self"?"On yourself":"Treating another person")+'</span>'+(hover?'<span class="hv-tag">Hover</span>':'')
   +'<p>'+p.how+'</p>'+(p.red?'<p class="red"><strong>Seek help first:</strong> '+p.red+'</p>':'')
   +'<p class="pg">'+grp+' · manual p.'+p.p+'</p></figcaption></figure>';
}
function lessonLib(k){
  var chips=function(list,attr){return list.map(function(c,i){return '<button type="button" class="chip'+(i===0?' on':'')+'" data-'+attr+'="'+c[0]+'" aria-pressed="'+(i===0)+'">'+c[1]+'</button>';}).join("");};
  return `
<div class="kicker">Lesson ${k}</div>
<h2>Targeted Hand Positions</h2>
<p>The Level 2 manual's "Extra Reiki Hand Positions" (Lesson 16, pp.72–83) shows 78 photographed positions for specific parts of the body, everyday complaints and long-term conditions. This library redraws them so you can use them on yourself and with clients.</p>
${objectives(["find a targeted position by body area or complaint","add targeted positions to a full session or self-treatment","use them safely, as support alongside medical care"])}
<h3>How to use this library</h3>
<ul>
<li><strong>A full treatment comes first.</strong> As the manual puts it, full-body treatments are ideal; targeted positions add focus. Use them after a full or short session, or on their own when time is short.</li>
<li><strong>Hold each one for 3 to 5 minutes,</strong> or longer if your hands are drawn there, and add the Reiki sandwich.</li>
<li><strong>"Parts of the body" positions are for treating another person</strong> lying on a table; most "complaint" positions are shown on yourself, seated. You can adapt any of them either way.</li>
<li><strong>The manual gives photos and captions only.</strong> The descriptions here are careful readings of those photos. Where a photo shows touch on the throat, chest, pelvic area or buttocks, this course uses hovering instead.</li>
</ul>
<div class="callout warn"><strong>Support, not a cure.</strong> These positions offer comfort and relaxation alongside medical care, never instead of it. Never suggest anyone stop treatment or medication, and see a doctor about any symptom that is new, severe or getting worse. The manual's position for <strong>DVT (deep vein thrombosis)</strong> isn't included here: a painful, swollen, warm leg can be a blood clot and needs urgent medical care, and holding the leg is not appropriate until a doctor has treated it.</div>
${figKey()}
<div class="lib-tools">

      [528,792].forEach(function(fq,i){var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=fq;g.gain.setValueAtTime(0,t+i*.18);g.gain.linearRampToValueAtTime(.18,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.18+1.6);o.connect(g);g.connect(ac.destination);o.start(t+i*.18);o.stop(t+i*.18+1.7);});

    P={seq:seq,list:list,i:0,mins:seq==="chair"?2:3,left:0,run:false,sound:true,from:from,timer:null,wake:null};

      +'<div class="pl-opts"><label>Minutes per position <select id="plMins">'+[1,2,3,4,5].map(function(m){return '<option'+(m===P.mins?' selected':'')+'>'+m+'</option>';}).join("")+'</select></label>'

    ov.querySelector("#plPlay").onclick=toggle;
    ov.querySelector("#plMins").onchange=function(){P.mins=+this.value;P.left=P.mins*60;paint();};
    ov.querySelector("#plSound").onchange=function(){P.sound=this.checked;};
    ov.addEventListener("keydown",function(e){
      if(e.key==="Escape"){closePlayer();}
      else if(e.key==="Tab"){var f=[].slice.call(ov.querySelectorAll("button,select,input")).filter(function(x){return !x.disabled;});var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
    });
    go2(0);ov.querySelector("#plName").focus();
  }
  function go2(i){
    if(!P)return;if(i<0)i=0;
    if(i>=P.list.length){stop();P.el.querySelector("#plStep").textContent="Complete";P.el.querySelector("#plName").textContent="Session complete";P.el.querySelector("#plHow").textContent="Well done. Give thanks, drink a glass of water, and note this session in your practice log.";P.el.querySelector("#plSym").textContent="";P.el.querySelector("#plWhere").textContent="";P.el.querySelector("#plFig").innerHTML="";P.i=P.list.length;paint();return;}

    paint();
  }
  function paint(){
    if(!P)return;var tot=P.mins*60;
    P.el.querySelector("#plTime").textContent=P.i>=P.list.length?"✓":fmt(P.left);
    P.el.querySelector("#plBar").style.width=(P.i>=P.list.length?100:Math.round((1-P.left/tot)*100))+"%";
    P.el.querySelector("#plPlay").textContent=P.run?"❚❚ Pause":(P.i>=P.list.length?"↺ Start again":"▶ Start timer");
    P.el.querySelector("#plPrev").disabled=P.i===0;P.el.querySelector("#plNext").disabled=P.i>=P.list.length;
  }
  function toggle(){
    if(P.i>=P.list.length){go2(0);return;}
    if(P.run)stop();else{P.run=true;P.last=Date.now();P.timer=setInterval(tick,250);try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(function(l){P&&(P.wake=l);}).catch(function(){});}catch(e){}chime();}
    paint();
  }
  function stop(){if(!P)return;P.run=false;clearInterval(P.timer);try{P.wake&&P.wake.release();}catch(e){}P.wake=null;}
  function tick(){
    var now=Date.now();P.left-=(now-P.last)/1000;P.last=now;
    if(P.left<=0){chime();var r=P.run;go2(P.i+1);if(r&&P.i<P.list.length){P.run=true;}else stop();}
    paint();
  }
  function closePlayer(){if(!P)return;stop();var f=P.from;P.el.remove();document.body.classList.remove("pl-open");P=null;if(f)f.focus();}
})();

{title:"What Changes at Level 2", html:function(){return `
<div class="kicker">Lesson 1</div>
<h2>What Changes at Level 2</h2>
<p>At Level 1, Reiki flows through your hands wherever you place them. Level 2 gives you three <strong>symbols</strong>, each a focus for a different quality of Reiki. Practitioners often describe them as keys: they don't create the energy, but they open particular doors to it.</p>
<figure class="fig"><svg viewBox="0 0 720 230" role="img" aria-label="The three Level 2 symbols: power, harmony and connection" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="230" rx="14" fill="#faf7f2"/><rect x="30" y="24" width="200" height="182" rx="14" fill="#fbe9e8"/><path d="M108 60 L130 60 L130 120 M130 72 A22 22 0 0 0 130 116 A16 16 0 0 0 130 84 A12 12 0 0 0 130 108 A7 7 0 0 0 130 94" fill="none" stroke="#d64541" stroke-width="5" stroke-linecap="round"/><text x="130" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#d64541">Power</text><text x="130" y="184" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">Cho Ku Rei</text><rect x="260" y="24" width="200" height="182" rx="14" fill="#e5f4ec"/><circle cx="346" cy="90" r="24" fill="#2fa36b" opacity=".5"/><circle cx="374" cy="90" r="24" fill="#2e86de" opacity=".5"/><text x="360" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2fa36b">Harmony</text><text x="360" y="184" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">Sei Heiki</text><rect x="490" y="24" width="200" height="182" rx="14" fill="#ede6f8"/><circle cx="556" cy="96" r="10" fill="#6a3fc1"/><circle cx="624" cy="96" r="10" fill="#6a3fc1"/><path d="M566 92 Q590 50 614 92" fill="none" stroke="#6a3fc1" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/><text x="590" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#6a3fc1">Connection</text><text x="590" y="184" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">Hon Sha Ze Sho Nen</text></svg></figure>
<h3>What you may notice</h3>
<ul>
<li><strong>Stronger flow.</strong> Many people feel more heat or tingling in their hands after the Level 2 attunement.</li>
<li><strong>Deeper emotional work.</strong> Sei Heiki lets you work directly with the mind and emotions.</li>
<li><strong>No limits of distance or time.</strong> Hon Sha Ze Sho Nen lets you send Reiki to someone in another city, or to a past or future moment.</li>
<li><strong>A more intentional practice.</strong> The symbols give your sessions structure and focus.</li>
</ul>
<h3>How symbols are used</h3>
<p>Your manual describes six ways to transfer a symbol to yourself or a client (pp.28, 31, 38). All of them work; use whichever feels natural.</p>
<ol>
<li><strong>Project it from your third eye</strong>, as brilliant white light, onto the backs of your hands as they rest on each hand position.</li>
<li><strong>Visualize it on your palms</strong> before you place your hands.</li>
<li><strong>Draw it on the roof of your mouth</strong> with your tongue, then project it onto the backs of your hands as they rest on the client.</li>
<li><strong>Draw it on the roof of your mouth</strong>, then project it onto your palms before you place them.</li>
<li><strong>Draw it on your palms</strong> with your index finger, then place your hands.</li>
<li><strong>Draw it in the air</strong> with your index finger, in the direction you want Reiki to go.</li>
</ol>
<p>Then <strong>silently intone its name three times</strong>. The manual is clear that this completes the activation. Hold a clear, positive intention as you draw; many people see the symbol as white light.</p>
<p><strong>Cho Ku Rei always comes first.</strong> It is the "light switch" that activates the other symbols, so Sei Heiki and Hon Sha Ze Sho Nen are always used within a Reiki sandwich (Lessons 3 and 4).</p>
<p>Many practitioners also add a short "rider" to their intention: <em>"if it be for the highest good."</em> It's a reminder that you aren't directing the outcome; Reiki goes where it's needed.</p>
<h3>Honoring the symbols</h3>
<p>Traditionally, Reiki symbols were kept private and shared only with students at their attunement. Many are now published, but the spirit of respect remains. In this course:</p>
<ul>
<li>Treat the symbols as sacred tools, not decorations. Never let anyone watch you draw them unless they are a Level 2 practitioner or a Reiki Master.</li>
<li>Practice drawing them privately until they flow naturally. Draw each one many times on paper, then burn or tear up the practice sheets with gratitude, as many teachers suggest.</li>
<li>Learn them exactly as drawn in this course, which follows the traditional Usui forms in your manual. Other lineages draw some details differently; if you meet another version later, keep to the one you were attuned with.</li>
</ul>
<h3>Other symbols you may come across</h3>
<p>Usui Reiki uses three symbols at Level 2 and one at Master level. As Reiki spread, some teachers added symbols from other traditions or from their own practice, such as the <strong>reversed Cho Ku Rei</strong> (drawn clockwise), <strong>Zonar</strong>, <strong>Harth</strong>, <strong>Johre</strong>, <strong>Raku</strong> and <strong>Motor Zanon</strong>. They aren't part of traditional Usui Reiki, and you don't need them. The three symbols in this course cover everything. If you're drawn to explore them later, learn them from a teacher who works with them.</p>
`;}},

{title:"Cho Ku Rei: Power", html:function(){return `
<div class="kicker">Lesson 2 · Symbol 1</div>
<h2>Cho Ku Rei: The Power Symbol</h2>
<p><strong>Cho Ku Rei</strong> (pronounced "cho-koo-ray") is the first Level 2 symbol: the power symbol and the activator. It's often called "the light switch," because it turns on the second-degree energy and activates all the other symbols. Without it, you are still channelling Level 1 energy.</p>
<table>
<tr><th>Syllable</th><th>Meaning</th></tr>
<tr><td><strong>Cho</strong></td><td>To cut; removing illusions in order to see the whole.</td></tr>
<tr><td><strong>Ku</strong></td><td>Penetrating, like a sword slicing through.</td></tr>
<tr><td><strong>Rei</strong></td><td>Universal; present everywhere.</td></tr>
</table>
<p>Cho Ku Rei cuts through and removes resistance. In Japanese, <em>choku</em> suggests an imperial command, something immediate.</p>
<h3>Drawing Cho Ku Rei</h3>

<div class="kicker">Lesson 3 · Symbol 2</div>
<h2>Sei Heiki: The Mental and Emotional Symbol</h2>
<p><strong>Sei Heiki</strong> (pronounced "say-high-key") is the mental and emotional symbol, used mainly for emotional and mental healing. It balances the right and left sides of the brain. Where Cho Ku Rei works on power, Sei Heiki works on the mind and heart: emotions, thoughts, habits and memories.</p>
<table>
<tr><th>Syllable</th><th>Meaning</th></tr>
<tr><td><strong>Sei</strong></td><td>Birth; coming into being.</td></tr>
<tr><td><strong>Heiki</strong></td><td>Balance; equilibrium.</td></tr>
</table>
<figure class="fig"><svg viewBox="0 0 560 200" role="img" aria-label="Two overlapping circles representing harmony" xmlns="http://www.w3.org/2000/svg"><rect width="560" height="200" rx="14" fill="#e9f5ee"/><circle cx="245" cy="100" r="62" fill="#2fa36b" opacity=".55"/><circle cx="315" cy="100" r="62" fill="#2e86de" opacity=".55"/><text x="205" y="105" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#fff">Earth</text><text x="355" y="105" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#fff">Sky</text><text x="280" y="186" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#2b2438">Harmony: mind and heart, body and spirit, brought into balance</text></svg></figure>
<h3>The symbol</h3>
<p>Reiki historians trace Sei Heiki to <em>kiriku</em>, the Japanese form of the Sanskrit seed syllable <em>Hrih</em>. In Buddhism, Hrih is the seed syllable of Amida Buddha, and in Japanese practice it is also linked with Kannon, the bodhisattva of compassion. Follow the six numbered strokes below, exactly as drawn in your manual (p.30).</p>
<figure class="fig"><svg viewBox="0 0 600 380" role="img" aria-label="Sei Heiki with numbered strokes. Left side first: 1, a three-part zigzag; 2, a short line straight down; 3, a curve out to the right and down. Then the right side: 4, a long curve from the top to the bottom; 5 and 6, two small curves on the outside of it near the top. All strokes are drawn top to bottom." xmlns="http://www.w3.org/2000/svg"><rect width="600" height="380" rx="14" fill="#eaf6ef"/><path d="M152 40 L100 96 L154 80 L104 132" fill="none" stroke="#2fa36b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 132 L102 176" fill="none" stroke="#2fa36b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 176 C182 196 196 280 118 340" fill="none" stroke="#2fa36b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M188 36 C262 96 268 230 206 350" fill="none" stroke="#2fa36b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M216 54 C246 52 252 86 233 96" fill="none" stroke="#2fa36b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M238 108 C266 108 270 146 248 158" fill="none" stroke="#2fa36b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="22" r="12" fill="#2b2438"/><text x="152" y="26.3" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff">1</text><circle cx="80" cy="156" r="12" fill="#2b2438"/><text x="80" y="160.3" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff">2</text><circle cx="80" cy="206" r="12" fill="#2b2438"/><text x="80" y="210.3" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff">3</text><circle cx="196" cy="18" r="12" fill="#2b2438"/><text x="196" y="22.3" text-anchor="middle" font-family="system-ui,-app  x="352" y="195" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b6478">out to the right and down</text><text x="330" y="226" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#1d6e47">THEN THE RIGHT SIDE</text><circle cx="330" cy="254" r="12" fill="#2b2438"/><text x="330" y="258.3" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff">4</text><text x="352" y="259" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#2b2438">A long curve,</text><text x="352" y="277" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b6478">from the top all the way down</text><circle cx="330" cy="306" r="12" fill="#2b2438"/><text x="330" y="310.3" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff">5</text><circle cx="358" cy="306" r="12" fill="#2b2438"/><text x="358" y="310.3" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff">6</text><text x="380" y="311" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#2b2438">Two small curves</text><text x="380" y="329" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b6478">on the outside, near the top</text><text x="330" y="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">Top to bottom; intone it three times.</text></svg></figure>
<h3>How to draw Sei Heiki</h3>
<ul>
<li><strong>Six strokes, left side first.</strong> Stroke 1 is a three-part zigzag; stroke 2 a short line straight down; stroke 3 a curve out to the right and down. Then the right side: stroke 4 is one long curve from the top to the bottom, and strokes 5 and 6 are two small curves on its outside, near the top.</li>
<li><strong>Every stroke top to bottom.</strong> Keep this order whether you draw it in the air, on your palm or on paper. Some practitioners see the two hemispheres of the brain in its two sides, a fitting image for a symbol that balances them.</li>
<li><strong>Activate it within the Reiki sandwich.</strong> Draw Cho Ku Rei and intone it three times; draw Sei Heiki on top and intone it three times; then draw Cho Ku Rei on top again and intone it three more times (manual p.31).</li>
</ul>
<h3>Learning it</h3>
<ol>
<li>Trace the drawing above with your finger, following the numbers, until you can see it with your eyes closed.</li>
<li>Copy it onto paper 20–30 times, large and slow at first.</li>
<li>Draw it in the air with your palm, then visualize it without moving your hand.</li>
<li>Draw it on your palm before each self-healing session for a week.</li>
</ol>
<h3>When to use it</h3>
<ul>
<li><strong>Emotional healing:</strong> grief from bereavement, nervousness, fear and phobias, anger and sadness.</li>
<li><strong>Blockages and long-standing problems:</strong> resistance in the body that hasn't shifted.</li>
<li><strong>Addictions:</strong> drink, drugs and smoking, alongside professional support.</li>
<li><strong>Mental clarity:</strong> calming a busy mind, focus before study or a difficult conversation.</li>
<li><strong>Changing habits:</strong> supporting the wish to let go of an unhelpful pattern.</li>
<li><strong>Memories:</strong> bringing gentleness to painful memories (combined with Hon Sha Ze Sho Nen, Lesson 4).</li>
<li><strong>Relationships:</strong> calming arguments, improving poor communication, calming a tense atmosphere.</li>
<li><strong>Mind:</strong> memory, intuition, inspiration and creativity; finding lost things.</li>
<li><strong>Protection:</strong> on every level, including while traveling.</li>
<li><strong>Questions:</strong> write a question on paper, draw the Reiki sandwich over it, and let the answer come intuitively (manual p.33).</li>
</ul>
<div class="callout warn">Never use Reiki to manipulate anyone. Sei Heiki supports a person's own wishes for themselves, with their consent.</div>
<h3>The affirmation technique</h3>
<p>This is one of the most popular ways to use Sei Heiki, for yourself or (with consent) for a client.</p>
<ol>
<li>Write a short, positive affirmation in the present tense, for example: "I am calm and safe in my body."</li>
<li>Draw Cho Ku Rei, then Sei Heiki, then Cho Ku Rei again over your head, or visualize them. Say each name three times.</li>
<li>Place one hand on your forehead and one on the back of your head.</li>
<li>Silently repeat your affirmation for 5–10 minutes as Reiki flows.</li>
<li>Close with gassho and gratitude.</li>
</ol>
<h3>The Reiki sandwich</h3>
<p>Sei Heiki is usually used together with Cho Ku Rei: Cho Ku Rei adds power, and Sei Heiki directs it toward harmony. The combination <strong>Cho Ku Rei, Sei Heiki, Cho Ku Rei</strong> is often called the <strong>Reiki sandwich</strong>, with Sei Heiki held between two layers of power.</p>
<ul>
<li>Visualize the sandwich flowing from your third eye into your client's third eye, adding the rider "if it be for the highest good," or draw it on your hands and place them over the third eye. Use it for emotional or mental blocks, addictions and unwanted habits.</li>
<li>Hold this position with the utmost care. You're working deep in the client's mind, so guard your own thoughts, and ask the client's higher self for consent before you begin (manual p.32).</li>
<li>You can also draw the sandwich on your palms, then rest them on any hand position.</li>
<li>Keep tissues nearby. Emotions often rise when Sei Heiki is used.</li>
</ul>

<div class="kicker">Lesson 4 · Symbol 3</div>
<h2>Hon Sha Ze Sho Nen: The Distance Symbol</h2>
<p><strong>Hon Sha Ze Sho Nen</strong> (pronounced "hon-shah-zay-show-nen") is the distant or absent healing symbol. It transcends time and space: past, present and future. With it you can send Reiki across a room or across the world, back to heal a childhood hurt, or ahead to an operation, interview or exam. Like every symbol, it is activated by Cho Ku Rei first.</p>

<h3>How to draw Hon Sha Ze Sho Nen</h3>
<ul>
<li><strong>Five kanji, 21 strokes.</strong> HON is strokes 1–5, SHA 6–10, SHO 11–14, ZE 15–16 and NEN 17–21.</li>
<li><strong>Every stroke left to right and top to bottom.</strong> Finish each kanji before moving down to the next.</li>
<li><strong>ZE is drawn after SHO, but spoken before it.</strong> On the page the order is HON, SHA, SHO, ZE, NEN, but the name is still said "Hon Sha Ze Sho Nen."</li>
<li><strong>Activate it within a sandwich:</strong> draw Cho Ku Rei (intone it three times), Hon Sha Ze Sho Nen on top (three times), then Cho Ku Rei again (three times).</li>
</ul>
<h3>Learning it</h3>
<ol>
<li>Learn one kanji a day for five days. Each day, review the ones you already know, then add the next.</li>
<li>Once you know all five, draw the whole symbol on paper 20–30 times.</li>
<li>Practice drawing it in the air, then visualizing it.</li>
<li>Don't worry if it takes a few weeks. It's the hardest symbol to learn, and your intention matters more than perfect strokes.</li>
</ol>
<h3>When to use it</h3>
<ul>
<li><strong>Distance healing:</strong> sending Reiki to someone who isn't in the room (Lesson 5).</li>
<li><strong>Across time:</strong> sending Reiki to a past event to soften its effect, or ahead to a future one, like an exam, surgery or a hard conversation.</li>
<li><strong>Your inner child:</strong> sending Reiki to a younger version of yourself.</li>
<li><strong>Situations and places:</strong> groups and organizations, towns, cities and countries, disaster and crisis situations, world peace.</li>
<li><strong>When touch isn't possible:</strong> someone in hospital, a person with burns, or a sleeping child.</li>

<h3>A distance session, step by step</h3>
<ol>
<li><strong>Agree on a time</strong> so the recipient can rest quietly and receive, though Reiki also works if they're busy or asleep.</li>
<li><strong>Prepare</strong> as for any session: ground, shield and set your intention.</li>
<li><strong>Choose your method</strong> (proxy, photo, your own body or visualization) and say the person's full name and location.</li>
<li><strong>Draw the Full Reiki Sandwich:</strong> Cho Ku Rei, Sei Heiki, Cho Ku Rei, Hon Sha Ze Sho Nen, Cho Ku Rei, silently intoning each name three times. Cho Ku Rei always comes first, because it activates the other symbols.</li>
<li><strong>Give Reiki</strong> through your proxy for 15–30 minutes, moving through positions as you would in person.</li>
<li><strong>Close</strong> with Cho Ku Rei to seal it, thank Reiki, and gently release the connection with love.</li>
<li><strong>Cleanse</strong> with Kenyoku and wash your hands.</li>
</ol>
<h3>Usui's own method</h3>
<p>Usui's preferred distance technique was called <em>Enkaku Chiryo Ho</em>, which means "remote treatment method." It used a photograph to connect with the person, even if they were only in the next room. If you have a photo, it's a lovely way to begin.</p>
<h3>Your mental Reiki room</h3>
<p>Many practitioners create a healing room in their imagination to use for every distance session. Close your eyes and build it in detail: the light, the colors, a comfortable table or chair, perhaps a window onto nature. When you send Reiki, invite the person into this room and treat them there, just as you would in person. The more you use it, the more vivid and familiar it becomes.</p>
<h3>Beaming</h3>
<p>You can also send Reiki across a room by "beaming" it: draw the symbols, then hold your palms toward the person or situation and imagine Reiki streaming from your hands like light. It's useful when touch isn't possible, such as with someone who has burns, an anxious animal, or a person who prefers no contact.</p>
<h3>Sending to many</h3>
<ul>
<li><strong>Groups and places:</strong> send Reiki to a family, a community, a city, or a place affected by a disaster.</li>
<li><strong>A list:</strong> write several names on a page, hold it between your hands, and send Reiki to everyone on it at once.</li>
<li><strong>The world:</strong> picture the earth small enough to hold between your palms and let Reiki flow.</li>
</ul>
<h3>Reiki for your goals</h3>
<p>Write a goal on paper, clearly and positively, as if it has already happened, with names and dates. Draw the full Reiki sandwich over it, add "if it be for the highest good," and hold it between your hands for a few minutes. Keep it with you and give it Reiki each day. Then take the practical steps toward it too; Reiki supports your effort rather than replacing it.</p>
<h3>Sending Reiki across time</h3>
<ul>
<li><strong>To the future:</strong> write the event and date on paper, hold it between your hands, and send Reiki so it is there when the moment arrives.</li>
<li><strong>To the past:</strong> hold a memory gently in mind and send Reiki to it with Sei Heiki. Go slowly with painful memories, and stop if it feels like too much.</li>
<li><strong>A Reiki box:</strong> keep a small box of names and intentions written on paper, and send Reiki to the whole box during your daily practice.</li>
</ul>
<div class="callout">If you're working with trauma, Reiki can be a gentle companion, but it isn't a replacement for a therapist. Encourage clients (and yourself) to get professional support.</div>
`;}},

{title:"The Three Pillars", html:function(){return `
<div class="kicker">Lesson 6</div>
<h2>The Three Pillars of Usui Reiki</h2>
<p>In Japanese Reiki, three simple practices are often called the pillars of Usui's method: <strong>Gassho</strong>, <strong>Reiji-ho</strong> and <strong>Chiryo</strong>. Together they move from centering yourself, to tuning in, to giving treatment.</p>
<h3>1. Gassho: centering</h3>
<p><em>Gassho</em> means "two hands coming together." It's the prayer position you've used since Level 1, but it's also a meditation Usui taught his students.</p>
<ol>
<li>Sit comfortably, spine straight, eyes closed.</li>
<li>Bring your palms together in front of your chest.</li>
<li>Rest your attention on the point where your two middle fingers meet.</li>
<li>When thoughts come, notice them without following them, and return your attention to your fingertips.</li>
<li>Practice for 5–20 minutes a day. If your arms tire, lower your hands a little while keeping your palms together.</li>
</ol>
<p>Over time, this practice moves you toward <em>mushin</em>, or "no-mind": a quiet, open awareness that makes you a clearer channel.</p>
<h3>2. Reiji-ho: tuning in</h3>
<p><em>Reiji-ho</em> means "indication of the spirit." It's how you ask Reiki to guide your hands.</p>
<ol>
<li>Hands in gassho, ask Reiki to flow through you.</li>
<li>Ask that the person receiving be healed, for their highest good.</li>
<li>Raise your joined hands to your forehead and ask to be guided to where Reiki is needed.</li>
</ol>
<h3>3. Chiryo: treatment</h3>
<p><em>Chiryo</em> simply means "treatment." Hold your dominant hand above the person's crown and wait until you feel an impulse or pull. Then follow it, letting your hands move wherever they're drawn. Stay in each place until the sensation eases, or until your hands feel ready to lift and move on.</p>
<div class="callout">At first, you may want to combine Chiryo with the standard hand positions you'll learn in Lessons 7 to 10. As your sensitivity grows, you can let intuition lead more and more of the session.</div>
<h3>A note on namaste</h3>
<p>The prayer-hands gesture is also known from India as <em>namaste</em>, often understood as "the light in me honors the light in you." It's a beautiful reminder of what Reiki is: a meeting of the same life force in two people.</p>
`;}},
