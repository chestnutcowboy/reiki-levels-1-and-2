<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reiki Level 2</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2438; --muted:#6b6478; --line:#ebe5dc;
  --ok:#1d7a4c; --bad:#b0322e;
  --rainbow:linear-gradient(90deg,#d64541,#f08a24,#f4b400,#2fa36b,#2e86de,#3c4fc6,#9b3fb5);
  /* current lesson's chakra color, set by script */
  --c:#d64541; --c-deep:#a8322f; --c-soft:#fbe9e8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:relative}
header h1{font-size:19px;margin:0;font-weight:normal;letter-spacing:.4px}
header h1 small{font:12px system-ui,sans-serif;opacity:.7;margin-left:8px;letter-spacing:1px;text-transform:uppercase}
header .prog{margin-left:auto;font:13px/1 system-ui,sans-serif;opacity:.9}
.track{height:6px;background:#e9e3ef;position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--rainbow);background-size:100vw 100%;transition:width .4s}
#menuBtn{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer}
.wrap{flex:1;display:flex;min-height:0}
nav{width:290px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 0;font:15px/1.35 system-ui,sans-serif}
nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:10px 18px 10px 14px;color:var(--ink);cursor:pointer;font:inherit}
nav button:hover{background:var(--soft)}
nav button.active{background:var(--soft);font-weight:600;border-left-color:var(--col)}
nav button:disabled{color:#aaa;cursor:not-allowed}
nav .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--col);margin-top:1px;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff}
nav .done .dot{background:var(--col)}
main{flex:1;overflow-y:auto;padding:32px 20px 40px}
article{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:34px 40px}
article h2{color:var(--c-deep);margin:0 0 6px;font-size:30px;font-weight:normal}
article .kicker{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:var(--c-deep);margin-bottom:4px}
article h3{margin:28px 0 6px;font-size:19px}
article a{color:var(--c-deep)}
.callout{background:var(--c-soft);border-left:4px solid var(--c);padding:12px 16px;border-radius:6px;margin:18px 0}
.callout.warn{background:#fdf3dc;border-color:#f4b400}
.principles{list-style:none;padding:0;margin:16px 0}
.principles li{padding:10px 14px;border-bottom:1px solid var(--line);font-style:italic}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft)}
.fig{margin:22px 0;text-align:center}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font:14px system-ui,sans-serif;color:var(--muted);margin-top:8px}
.principles li:nth-child(1){border-left:4px solid #d64541}.principles li:nth-child(2){border-left:4px solid #f08a24}.principles li:nth-child(3){border-left:4px solid #f4b400}.principles li:nth-child(4){border-left:4px solid #2fa36b}.principles li:nth-child(5){border-left:4px solid #3c4fc6}
.chakra{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.footer-nav{max-width:760px;margin:20px auto 0;display:flex;justify-content:space-between;gap:12px}
.btn{display:inline-block;background:var(--c-deep);color:#fff!important;border:0;border-radius:8px;padding:11px 22px;font:15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.secondary{background:#fff;color:var(--c-deep)!important;border:1px solid var(--c-deep)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rainbow-rule{height:4px;border:0;border-radius:2px;background:var(--rainbow);margin:26px 0}
.teacher{display:flex;gap:16px;align-items:center;background:var(--c-soft);border-radius:10px;padding:16px 18px;margin:18px 0}
.teacher .badge{flex:0 0 54px;height:54px;border-radius:50%;background:var(--rainbow);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 14px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;color:#fff;font:600 15px/32px system-ui,sans-serif;text-align:center;background:var(--sc,#888)}
.steps li:nth-child(1){--sc:#d64541}.steps li:nth-child(2){--sc:#2fa36b}.steps li:nth-child(3){--sc:#3c4fc6}
.steps .btn{margin-top:8px;margin-right:8px}
.paybox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px}
.paybox img{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;background:#fff}
.paybox .addr{font:14px system-ui,sans-serif;color:var(--muted)}
.paybox .addr strong{color:var(--ink)}
.q{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
.q p{margin:0 0 10px;font-weight:600}
.q label{display:block;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:16px}
.q label:hover{background:var(--c-soft)}
.q.right{border-color:var(--ok)} .q.wrong{border-color:var(--bad)}
.q .fb{font:14px system-ui,sans-serif;margin-top:8px}
.q.right .fb{color:var(--ok)} .q.wrong .fb{color:var(--bad)}
.result{padding:20px;border-radius:10px;margin-top:20px}
.result.fail{background:#f9e6e5;color:var(--bad);text-align:center;font-size:19px}
.cert{text-align:center;border-radius:12px;padding:26px 20px;background:#fff;border:2px solid transparent;background-image:linear-gradient(#fff,#fff),var(--rainbow);background-origin:border-box;background-clip:padding-box,border-box}
.cert .big{font-size:26px;color:var(--ink);margin:4px 0}
.cert .meta{font:14px system-ui,sans-serif;color:var(--muted)}
@media (max-width:820px){
  #menuBtn{display:block}
  nav{position:fixed;top:58px;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  nav.open{transform:none}
  article{padding:24px 18px}
  main{padding:16px 12px 30px}
  header h1 small{display:none}
}
/* ===== Saved progress, practice log, accessibility ===== */
.skip{position:absolute;left:-9999px;top:8px;z-index:20;background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;font:15px system-ui,sans-serif}
.skip:focus{left:8px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hbtn{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtns{display:flex;gap:8px;margin-left:12px}
:focus-visible{outline:3px solid #2e86de;outline-offset:2px}
article h2:focus{outline:none}
.status{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font:15px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.status.show{opacity:1;transform:translate(-50%,0)}
.complete-box{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:34px;padding:16px 18px;border:2px dashed var(--c);border-radius:10px;font:15px system-ui,sans-serif}
.complete-box span{color:var(--muted)}
.complete-box.is-done{border-style:solid;background:var(--c-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--c-deep);text-decoration:underline;cursor:pointer;font:inherit}
.todo li{margin:6px 0}
.codebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.codebox code{font:600 20px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px;background:var(--c-soft);padding:10px 14px;border-radius:8px;word-break:break-all}
.codebox input,.logform input,.logform select,.logform textarea{padding:9px 12px;border:1px solid #b9b1c4;border-radius:8px;font:16px system-ui,sans-serif;background:#fff;color:var(--ink)}
.codebox input{width:16em;max-width:100%;text-transform:uppercase;letter-spacing:1px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid #2e86de;outline-offset:2px}
.btn.danger{color:var(--bad)!important;border-color:var(--bad)}
.form-msg{font:15px system-ui,sans-serif;min-height:1px;margin:6px 0}
.form-msg.ok{color:var(--ok)} .form-msg.bad{color:var(--bad)}
.muted{color:var(--muted)}
.log-summary{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.log-summary div{flex:1 1 110px;background:var(--c-soft);border-radius:10px;padding:10px 12px;text-align:center;font:13px system-ui,sans-serif;color:var(--muted)}
.log-summary strong{display:block;font-size:24px;color:var(--ink)}
.logform{border:1px solid var(--line);border-radius:10px;padding:4px 18px 16px;margin:18px 0}
.logform label{display:block;font:15px system-ui,sans-serif;margin:10px 0}
.logform label input,.logform label select,.logform label textarea{display:block;width:100%;margin-top:4px}
.logform .row{display:flex;gap:12px;flex-wrap:wrap}
.logform .row label{flex:1 1 140px}
.logform .hint{color:var(--muted);font-size:13px}
.log-actions{margin:12px 0 4px}
.log-list{padding-left:22px}
.log-list li{border-bottom:1px solid var(--line);padding:10px 0}
.log-list p{margin:4px 0;font-size:16px}
.log-head{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font:15px system-ui,sans-serif}
.log-head .del{margin-left:auto;color:var(--bad);font-size:14px}
fieldset.q{display:block;min-width:0;margin:16px 0}
fieldset.q legend{font-weight:600;padding:0 4px;margin-bottom:6px}
@media (max-width:820px){
  header{padding:12px 12px;gap:8px}
  header .prog{display:none}
  .hbtns{margin-left:auto;gap:6px}
  .hbtn,#menuBtn{padding:6px 8px;font-size:13px}
}
@media (max-width:420px){
  header h1{font-size:16px}
  .hbtn .lbl{display:none}
}
@media print{
  header,nav,.track,.footer-nav,.status,.skip,.no-print,.complete-box{display:none!important}
  html,body,.wrap,main{display:block;height:auto;overflow:visible;background:#fff}
  main{padding:0}
  article{border:0;padding:0;max-width:none}
  a{color:inherit}
}
</style>
</head>

</div>

<div class="kicker">Okuden · Second Degree</div>
<h2>Reiki Level 2</h2>
<p>Okuden means "inner teachings." Level 1 opened the door; Level 2 takes you deeper. In this level you'll learn the three sacred Reiki symbols, how to send Reiki across distance and time, how to bring the symbols into your self-healing practice, and how to begin sharing Reiki with clients.</p>
<div class="teacher"><div class="badge">✦</div><div><strong>Your teacher: ${TEACHER.name}</strong><br>Reiki Master and founder of <a href="${TEACHER.website}" target="_blank" rel="noopener">${TEACHER.business}</a></div></div>
<h3>Why this course is free</h3>
<p>Reiki is meant for everyone. Too often it's put behind high prices that keep it out of reach for the people who could benefit from it most. This course is my way of opening the door: Reiki Levels 1 and 2 are completely free for anyone who wants to take them.</p>
<h3>Your path through Reiki</h3>
<table>
<tr><th>Level</th><th>What it covers</th><th>Cost</th></tr>
<tr><td><strong>Level 1 · Shoden</strong></td><td>Foundations, self-healing and treating others</td><td>Free</td></tr>
<tr><td><strong>Level 2 · Okuden</strong><br>(this course)</td><td>The three Reiki symbols, distance healing and working with clients</td><td>Free</td></tr>
<tr><td><strong>Level 3 · Shinpiden</strong><br>Master/Teacher</td><td>The Master symbol, advanced practice, passing attunements and teaching. Includes your Reiki Master certificate, which certifies you to practice and teach as a Reiki Master.</td><td>Sliding scale from $11.11</td></tr>
</table>
<h3>Before you begin</h3>
<p>This course builds on Reiki Level 1. If you haven't taken it yet, start there; it's free too. You'll use the hand positions, the Five Principles and the protection practices from Level 1 throughout this course.</p>
<h3>What you'll learn</h3>
<ul>
<li>What changes at Level 2, and how to honor the symbols</li>
<li>Cho Ku Rei, the power symbol</li>
<li>Sei He Ki, the mental and emotional symbol</li>
<li>Hon Sha Ze Sho Nen, the distance symbol</li>
<li>How to send Reiki across distance and time</li>
<li>Self-healing with the symbols</li>
<li>The Three Pillars: Gassho, Reiji-ho and Chiryo</li>
<li>Giving a full session with the symbols</li>
<li>Working with clients professionally and ethically</li>
<li>Reiki for animals</li>
<li>How your Level 2 attunement works</li>
</ul>
<h3>How this course works</h3>
<p>Work through the lessons in order. Progress isn't saved between visits, so set aside some time, or note which lesson you reached so you can jump back to it from the lesson list. The final quiz unlocks once you've opened every lesson; you'll need ${PASS_MARK}% to pass, and you can retake it as often as you like.</p>
<p>You're welcome to take this course without receiving an attunement; the knowledge here is yours either way. But the Level 2 attunement is what activates the symbols for you, and it is <strong>vital if you want to become a Reiki Master</strong>: your Level 1 and Level 2 attunements are both required before you can take Level 3.</p>
<hr class="rainbow-rule">
<h3>When you finish: your attunement</h3>
<p>This course teaches you the Level 2 practice. The attunement is what empowers the symbols for you, and I offer it by distance.</p>
${attunementSteps()}

<h3>Where your exchange goes</h3>
<p>Every dollar from attunements goes directly back into <strong>${TEACHER.business}</strong>, an independent press publishing trans and nonbinary writers and artists. Your support helps fund its arts magazine, which pays contributors and gives away free handmade copies in the Portland community, and <em>Queer Civic Notes</em>, which helps keep the community informed and engaged.</p>

<div class="kicker">Lesson 1</div>
<h2>What Changes at Level 2</h2>
<p>At Level 1, Reiki flows through your hands wherever you place them. Level 2 gives you three <strong>symbols</strong>, each a focus for a different quality of Reiki. Practitioners often describe them as keys: they don't create the energy, but they open particular doors to it.</p>
<figure class="fig"><svg viewBox="0 0 720 230" role="img" aria-label="The three Level 2 symbols: power, harmony and connection" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="230" rx="14" fill="#faf7f2"/><rect x="30" y="24" width="200" height="182" rx="14" fill="#fbe9e8"/><path d="M108 60 L130 60 L130 120 M130 72 A22 22 0 0 0 130 116 A16 16 0 0 0 130 84 A12 12 0 0 0 130 108 A7 7 0 0 0 130 94" fill="none" stroke="#d64541" stroke-width="5" stroke-linecap="round"/><text x="130" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#d64541">Power</text><text x="130" y="184" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">Cho Ku Rei</text><rect x="260" y="24" width="200" height="182" rx="14" fill="#e5f4ec"/><circle cx="346" cy="90" r="24" fill="#2fa36b" opacity=".5"/><circle cx="374" cy="90" r="24" fill="#2e86de" opacity=".5"/><text x="360" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2fa36b">Harmony</text><text x="360" y="184" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">Sei He Ki</text><rect x="490" y="24" width="200" height="182" rx="14" fill="#ede6f8"/><circle cx="556" cy="96" r="10" fill="#6a3fc1"/><circle cx="624" cy="96" r="10" fill="#6a3fc1"/><path d="M566 92 Q590 50 614 92" fill="none" stroke="#6a3fc1" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/><text x="590" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#6a3fc1">Connection</text><text x="590" y="184" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">Hon Sha Ze Sho Nen</text></svg></figure>
<h3>What you may notice</h3>
<ul>
<li><strong>Stronger flow.</strong> Many people feel more heat or tingling in their hands after the Level 2 attunement.</li>
<li><strong>Deeper emotional work.</strong> Sei He Ki lets you work directly with the mind and emotions.</li>
<li><strong>No limits of distance or time.</strong> Hon Sha Ze Sho Nen lets you send Reiki to someone in another city, or to a past or future moment.</li>
<li><strong>A more intentional practice.</strong> The symbols give your sessions structure and focus.</li>
</ul>
<h3>How symbols are used</h3>
<p>You can activate a symbol in any of these ways. All of them work; use whichever feels natural.</p>
<ul>
<li><strong>Draw it in the air</strong> with your palm or fingers, over a person, an area, or your own hands.</li>
<li><strong>Visualize it</strong> clearly in your mind, glowing over the area.</li>
<li><strong>Draw it on your palm</strong> with a fingertip, or trace it with your tongue on the roof of your mouth, a traditional discreet method.</li>
</ul>
<p>Then say its name three times, silently or aloud. The name acts as a <em>mantra</em> that completes the activation.</p>
<p>Many practitioners also add a short "rider" to their intention: <em>"if it be for the highest good."</em> It's a reminder that you aren't directing the outcome; Reiki goes where it's needed.</p>
<h3>Honoring the symbols</h3>
<p>Traditionally, Reiki symbols were kept private and shared only with students at their attunement. Many are now published, but the spirit of respect remains. In this course:</p>
<ul>
<li>Treat the symbols as sacred tools, not decorations.</li>
<li>Practice drawing them privately until they flow naturally. Draw each one many times on paper, then burn or tear up the practice sheets with gratitude, as many teachers suggest.</li>
<li>Learn them from your teacher's drawings. Small details vary between lineages, and that's okay: your intention is what matters most.</li>
</ul>
<h3>Other symbols you may come across</h3>
<p>Usui Reiki uses three symbols at Level 2 and one at Master level. As Reiki spread, some teachers added symbols from other traditions or from their own practice, such as the <strong>reversed Cho Ku Rei</strong> (drawn clockwise), <strong>Zonar</strong>, <strong>Harth</strong>, <strong>Johre</strong>, <strong>Raku</strong> and <strong>Motor Zanon</strong>. They aren't part of traditional Usui Reiki, and you don't need them. The three symbols in this course cover everything. If you're drawn to explore them later, learn them from a teacher who works with them.</p>
`;}},

<li><strong>Top to bottom, left to right.</strong> Always draw the left side first, working down from the top, then the right side, also from the top. Keep this order whether you draw it in the air, on your palm or on paper.</li>

<li><strong>Mental clarity:</strong> calming a busy mind, focus before study or a difficult conversation.</li>
<li><strong>Changing habits:</strong> supporting the wish to let go of an unhelpful pattern.</li>
<li><strong>Memories:</strong> bringing gentleness to painful memories (combined with Hon Sha Ze Sho Nen, Lesson 4).</li>
<li><strong>Relationships:</strong> sending harmony into a situation.</li>
</ul>
<h3>The affirmation technique</h3>
<p>This is one of the most popular ways to use Sei He Ki, for yourself or (with consent) for a client.</p>
<ol>
<li>Write a short, positive affirmation in the present tense, for example: "I am calm and safe in my body."</li>
<li>Draw Cho Ku Rei, then Sei He Ki, then Cho Ku Rei again over your head, or visualize them. Say each name three times.</li>
<li>Place one hand on your forehead and one on the back of your head.</li>
<li>Silently repeat your affirmation for 5–10 minutes as Reiki flows.</li>
<li>Close with gassho and gratitude.</li>
</ol>

<p>Sei He Ki is usually used together with Cho Ku Rei: Cho Ku Rei adds power, and Sei He Ki directs it toward harmony. The combination <strong>Cho Ku Rei, Sei He Ki, Cho Ku Rei</strong> is often called the <strong>Reiki sandwich</strong>, with Sei He Ki held between two layers of power.</p>
<ul>
<li>Draw it over the forehead (third eye) for emotional or mental blocks, unwanted habits or stress. Hold this position with great care and respect; you're working deep in the mind.</li>
<li>You can also draw the sandwich on your palms, then rest them on any hand position.</li>
<li>Keep tissues nearby. Emotions often rise when Sei He Ki is used.</li>
</ul>

<p><strong>Hon Sha Ze Sho Nen</strong> (pronounced "hon-shah-zay-show-nen") is the distance symbol. It's often translated as "no past, no present, no future," pointing to the idea that Reiki isn't limited by space or time. It's the bridge that connects you with the person or moment you're sending Reiki to.</p>

t x="179" y="328" text-anchor="middle" font-size="36" fill="#fff" font-family="serif">念</text><text x="226" y="312" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#2b2438">nen</text><text x="226" y="332" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#6b6478">thought, mindfulness</text></svg></figure>

e-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">then a short crossbar</text><text x="250" y="122" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#6a3fc1">SHA</text><text x="340" y="122" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">Strokes 6–11</text><text x="250" y="143" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">A long line across, a long sweep down-left,</text><text x="250" y="161" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">then a small box with two lines inside</text><text x="250" y="204" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#6a3fc1">ZE · SHO</text><text x="340" y="204" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">Strokes 12–15</text><text x="250" y="225" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">Across, a long line down, a short line</text><text x="250" y="243" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">down on the left, a short line to the right</text><text x="250" y="286" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#6a3fc1">NEN</text><text x="340" y="286" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">Strokes 16–22</text><text x="250" y="307" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">A roof of two sweeps, a short bent stroke,</text><text x="250" y="325" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#2b2438">then the heart: dot, hook, dot, dot</text></svg></figure>
<h3>How to draw Hon Sha Ze Sho Nen</h3>
<ul>
<li><strong>Built from five kanji, drawn in four sections.</strong> The symbol is based on the five kanji shown above. In the Reiki form they're condensed into one tall, connected figure of 22 strokes, with <em>ze</em> and <em>sho</em> sharing the third section.</li>
<li><strong>Top to bottom, section by section.</strong> Finish each section before moving down to the next. Within a section, strokes generally go top to bottom and left to right, as in Japanese writing.</li>
<li><strong>Say it as you draw.</strong> Many teachers suggest saying each syllable as you draw: "Hon… Sha… Ze… Sho… Nen." Then say the full name three times when you finish.</li>
</ul>
<h3>Learning it</h3>
<ol>
<li>Learn one section a day for four days. Each day, review the sections you already know, then add the next.</li>
<li>Once you know all five, draw the whole symbol on paper 20–30 times.</li>
<li>Practice drawing it in the air, then visualizing it.</li>
<li>Don't worry if it takes a few weeks. It's the hardest symbol to learn, and your intention matters more than perfect strokes.</li>
</ol>
<h3>When to use it</h3>
<ul>
<li><strong>Distance healing:</strong> sending Reiki to someone who isn't in the room (Lesson 5).</li>
<li><strong>Across time:</strong> sending Reiki to a past event to soften its effect, or ahead to a future one, like an exam, surgery or a hard conversation.</li>
<li><strong>Your inner child:</strong> sending Reiki to a younger version of yourself.</li>
<li><strong>Situations and places:</strong> sending Reiki to a community, a place or the world.</li>
</ul>
<div class="callout"><strong>The full Reiki sandwich:</strong> Hon Sha Ze Sho Nen opens the connection; Cho Ku Rei and Sei He Ki carry the healing through it. A distance session usually uses all of them together: <strong>Cho Ku Rei, Sei He Ki, Hon Sha Ze Sho Nen, Cho Ku Rei</strong>.</div>
`;}},

<div class="kicker">Lesson 5</div>
<h2>Distance Healing</h2>
<p>With Hon Sha Ze Sho Nen, you can share Reiki with someone in another room, another city or another country, and even send it across time.</p>

Segoe UI,sans-serif" font-size="13" fill="#2b2438">Hon Sha Ze Sho Nen connects you · Cho Ku Rei and Sei He Ki carry the healing</text></svg></figure>
<h3>Consent comes first</h3>
<div class="callout warn">Always ask permission before sending Reiki to another person. If you can't ask (for example, someone is unconscious), send it with the intention that they may accept or decline it for their highest good, and never to someone who has said no.</div>
<h3>Four ways to make the connection</h3>
<figure class="fig"><svg viewBox="0 0 720 210" role="img" aria-label="Four ways to send distance Reiki" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="210" rx="14" fill="#faf7f2"/><rect x="18" y="18" width="160" height="174" rx="12" fill="#fff" stroke="#d64541" stroke-width="2"/><rect x="68" y="44" width="60" height="40" rx="16" fill="#d64541" opacity=".7"/><text x="98" y="122" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#d64541">Proxy</text><text x="98" y="146" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">A pillow or soft toy</text><text x="98" y="163" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">stands in for them</text><rect x="194" y="18" width="160" height="174" rx="12" fill="#fff" stroke="#f08a24" stroke-width="2"/><rect x="248" y="38" width="52" height="52" rx="4" fill="none" stroke="#f08a24" stroke-width="4"/><circle cx="274" cy="58" r="9" fill="#f08a24"/><path d="M258 86 Q274 66 290 86Z" fill="#f08a24"/><text x="274" y="122" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f08a24">Photo</text><text x="274" y="146" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">Hold or place your</text><text x="274" y="163" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">hands over their</text><text x="274" y="180" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">picture</text><rect x="370" y="18" width="160" height="174" rx="12" fill="#fff" stroke="#2fa36b" stroke-width="2"/><path d="M414 70 L480 70" stroke="#2fa36b" stroke-width="18" stroke-linecap="round"/><circle cx="480" cy="70" r="11" fill="#fff" stroke="#2fa36b" stroke-width="3"/><text x="450" y="122" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#2fa36b">Your own body</text><text x="450" y="146" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">Your thigh represents</text><text x="450" y="163" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">their front, your knee</text><text x="450" y="180" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">their head</text><rect x="546" y="18" width="160" height="174" rx="12" fill="#fff" stroke="#2e86de" stroke-width="2"/><path d="M592 82 Q596 50 614 46 M660 82 Q656 50 638 46" fill="none" stroke="#2e86de" stroke-width="5" stroke-linecap="round"/><circle cx="626" cy="66" r="9" fill="#2e86de"/><text x="626" y="122" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#2e86de">Visualize</text><text x="626" y="146" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">Picture them small,</text><text x="626" y="163" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">held between your</text><text x="626" y="180" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6b6478">palms</text></svg></figure>
<h3>A distance session, step by step</h3>
<ol>
<li><strong>Agree on a time</strong> so the recipient can rest quietly and receive, though Reiki also works if they're busy or asleep.</li>
<li><strong>Prepare</strong> as for any session: ground, shield and set your intention.</li>
<li><strong>Choose your method</strong> (proxy, photo, your own body or visualization) and say the person's full name and location.</li>
<li><strong>Draw Hon Sha Ze Sho Nen</strong> and say its name three times to open the connection.</li>
<li><strong>Draw Sei He Ki</strong> if the session is for emotional or mental healing, then <strong>Cho Ku Rei</strong> to power it up.</li>
<li><strong>Give Reiki</strong> through your proxy for 15–30 minutes, moving through positions as you would in person.</li>
<li><strong>Close</strong> with Cho Ku Rei to seal it, thank Reiki, and gently release the connection with love.</li>
<li><strong>Cleanse</strong> with Kenyoku and wash your hands.</li>
</ol>
<h3>Usui's own method</h3>
<p>Usui's preferred distance technique was called <em>Enkaku Chiryo Ho</em>, which means "remote treatment method." It used a photograph to connect with the person, even if they were only in the next room. If you have a photo, it's a lovely way to begin.</p>
<h3>Your mental Reiki room</h3>
<p>Many practitioners create a healing room in their imagination to use for every distance session. Close your eyes and build it in detail: the light, the colors, a comfortable table or chair, perhaps a window onto nature. When you send Reiki, invite the person into this room and treat them there, just as you would in person. The more you use it, the more vivid and familiar it becomes.</p>
<h3>Beaming</h3>
<p>You can also send Reiki across a room by "beaming" it: draw the symbols, then hold your palms toward the person or situation and imagine Reiki streaming from your hands like light. It's useful when touch isn't possible, such as with someone who has burns, an anxious animal, or a person who prefers no contact.</p>
<h3>Sending to many</h3>
<ul>
<li><strong>Groups and places:</strong> send Reiki to a family, a community, a city, or a place affected by a disaster.</li>
<li><strong>A list:</strong> write several names on a page, hold it between your hands, and send Reiki to everyone on it at once.</li>
<li><strong>The world:</strong> picture the earth small enough to hold between your palms and let Reiki flow.</li>
</ul>
<h3>Reiki for your goals</h3>
<p>Write a goal on paper, clearly and positively, as if it has already happened, with names and dates. Draw the full Reiki sandwich over it, add "if it be for the highest good," and hold it between your hands for a few minutes. Keep it with you and give it Reiki each day. Then take the practical steps toward it too; Reiki supports your effort rather than replacing it.</p>
<h3>Sending Reiki across time</h3>
<ul>
<li><strong>To the future:</strong> write the event and date on paper, hold it between your hands, and send Reiki so it is there when the moment arrives.</li>
<li><strong>To the past:</strong> hold a memory gently in mind and send Reiki to it with Sei He Ki. Go slowly with painful memories, and stop if it feels like too much.</li>
<li><strong>A Reiki box:</strong> keep a small box of names and intentions written on paper, and send Reiki to the whole box during your daily practice.</li>
</ul>
<div class="callout">If you're working with trauma, Reiki can be a gentle companion, but it isn't a replacement for a therapist. Encourage clients (and yourself) to get professional support.</div>

<div class="kicker">Lesson 6</div>
<h2>Self-Healing with the Symbols</h2>
<p>Your self-healing practice is still the heart of your Reiki, and at Level 2 the symbols make it deeper and more focused. Keep your daily self-treatment going; it's your foundation and your protection.</p>
<h3>A Level 2 self-healing session</h3>
<ol>
<li><strong>Prepare:</strong> settle in, gassho, Joshin Kokyu Ho breathing and your intention, just as in Level 1.</li>

<h3>Using the symbols on yourself</h3>
<table>
<tr><th>Symbol</th><th>Self-healing use</th></tr>

{title:"The Three Pillars", html:function(){return `
<div class="kicker">Lesson 7</div>
<h2>The Three Pillars of Usui Reiki</h2>
<p>In Japanese Reiki, three simple practices are often called the pillars of Usui's method: <strong>Gassho</strong>, <strong>Reiji-ho</strong> and <strong>Chiryo</strong>. Together they move from centering yourself, to tuning in, to giving treatment.</p>
<h3>1. Gassho: centering</h3>
<p><em>Gassho</em> means "two hands coming together." It's the prayer position you've used since Level 1, but it's also a meditation Usui taught his students.</p>
<ol>
<li>Sit comfortably, spine straight, eyes closed.</li>
<li>Bring your palms together in front of your chest.</li>
<li>Rest your attention on the point where your two middle fingers meet.</li>
<li>When thoughts come, notice them without following them, and return your attention to your fingertips.</li>
<li>Practice for 5–20 minutes a day. If your arms tire, lower your hands a little while keeping your palms together.</li>
</ol>
<p>Over time, this practice moves you toward <em>mushin</em>, or "no-mind": a quiet, open awareness that makes you a clearer channel.</p>
<h3>2. Reiji-ho: tuning in</h3>
<p><em>Reiji-ho</em> means "indication of the spirit." It's how you ask Reiki to guide your hands.</p>
<ol>
<li>Hands in gassho, ask Reiki to flow through you.</li>
<li>Ask that the person receiving be healed, for their highest good.</li>
<li>Raise your joined hands to your forehead and ask to be guided to where Reiki is needed.</li>
</ol>
<h3>3. Chiryo: treatment</h3>
<p><em>Chiryo</em> simply means "treatment." Hold your dominant hand above the person's crown and wait until you feel an impulse or pull. Then follow it, letting your hands move wherever they're drawn. Stay in each place until the sensation eases, or until your hands feel ready to lift and move on.</p>
<div class="callout">At first, you may want to combine Chiryo with the standard hand positions. As your sensitivity grows, you can let intuition lead more and more of the session.</div>
<h3>A note on namaste</h3>
<p>The prayer-hands gesture is also known from India as <em>namaste</em>, often understood as "the light in me honors the light in you." It's a beautiful reminder of what Reiki is: a meeting of the same life force in two people.</p>
`;}},

{title:"Working with Clients", html:function(){return `
<div class="kicker">Lesson 9</div>
<h2>Working with Clients</h2>
<p>Level 2 is traditionally where practitioners begin offering Reiki to the public. Whether you plan a full practice or occasional sessions for your community, these foundations will help you work safely and ethically.</p>
<h3>Before the first session</h3>
<ul>
<li><strong>Intake form:</strong> contact details, what brings them to Reiki, any health conditions or sensitivities you should know about, and touch preferences.</li>
<li><strong>Consent form:</strong> explains what Reiki is and isn't, states that it complements but doesn't replace medical care, and confirms they can stop at any time.</li>
<li><strong>Distance sessions:</strong> confirm the time, how they'll receive, and how you'll follow up.</li>
</ul>
<h3>Records and confidentiality</h3>
<ul>
<li>Keep brief session notes: date, type of session, and anything the client wants you to remember.</li>
<li>Store records securely, and never share them without permission.</li>
<li>Note what you did, not what you "found." Avoid writing anything that sounds like a diagnosis.</li>
</ul>
<h3>Setting your exchange</h3>
<p>You decide what to ask for your sessions. Many practitioners offer a sliding scale, community sessions, or trades to keep Reiki within reach, in the spirit that <strong>Reiki is for everyone</strong>. Whatever you choose, be clear about it up front.</p>
<h3>Scope of practice</h3>
<ul>
<li><strong>Never diagnose, prescribe, or promise results.</strong></li>
<li>Refer clients to medical or mental health professionals whenever you have concerns, and encourage them to keep up any treatment they're receiving.</li>
<li>Know your limits. It's okay to say that something is beyond what you can offer.</li>
</ul>
<h3>When a client doesn't feel anything</h3>
<p>Some people feel strong sensations during Reiki; others feel very little, especially at first. Reassure them that this is common and doesn't mean Reiki isn't working. Invite them to notice subtler changes afterward, like how they sleep, their mood, or a sense of calm. Some people become more sensitive over several sessions; others simply never feel much, and still find it helpful.</p>
<h3>Combining Reiki with other practices</h3>
<p>Reiki works well alongside many other practices, such as massage, meditation, sound healing, aromatherapy, crystals, coaching or counseling. If you're trained in another practice:</p>
<ul>
<li>Explain what you plan to do, and get the client's consent before adding anything beyond Reiki.</li>
<li>Only offer practices you're properly trained and, where required, licensed in.</li>
<li>Remember that Reiki on its own is always enough.</li>
</ul>
<h3>Legal and practical basics</h3>
<p>Rules for hands-on practice vary between states and countries, and some places require a license for touch-based work. Before taking paying clients:</p>
<ul>
<li>Check your local regulations.</li>
<li>Consider professional liability insurance.</li>
<li>Keep your space clean, accessible and comfortable.</li>
</ul>
<h3>Boundaries</h3>
<ul>
<li>Keep the relationship professional, with clear session times and communication channels.</li>
<li>Make your space welcoming to everyone, including trans, nonbinary and queer clients. Ask for names and pronouns on your intake form.</li>
<li>Look after yourself: schedule breaks, and don't book more sessions than you can give fully.</li>
</ul>
`;}},

{title:"Reiki for Animals", html:function(){return `
<div class="kicker">Lesson 10</div>
<h2>Reiki for Animals</h2>
<p>At Level 1 you learned to share Reiki with animals hands-on. Level 2 adds distance and beaming, so you can help animals that can't or won't be touched. Animal Reiki is a rewarding practice, whether for your own pets or as part of your work.</p>
<h3>When animals benefit</h3>
<ul>
<li><strong>Illness and recovery:</strong> alongside veterinary care, never instead of it.</li>
<li><strong>Young and old:</strong> any animal, at any age.</li>
<li><strong>Trauma and change:</strong> after rescue, neglect, loss or a move, or when an animal seems withdrawn or anxious.</li>
<li><strong>The end of life:</strong> comfort and calm as an animal nears death.</li>
</ul>
<h3>Reading the animal</h3>
<p>Animals can't give verbal consent, so watch their signals and let them choose.</p>
<ul>
<li><strong>"Not now":</strong> growling, hissing, pinned ears, moving away or trying to escape. Respect it, and send Reiki from a distance instead.</li>
<li><strong>"Not there":</strong> shifting or looking back at you. Lift your hands a few inches and hover, or move to another spot.</li>
<li><strong>"Yes, please":</strong> leaning in, relaxing, sighing, or moving so your hand rests on a particular spot. Hold your hands where they are while the animal settles.</li>
<li><strong>Invitations:</strong> animals often come close when you're giving Reiki to yourself or someone else.</li>
</ul>
<h3>Four ways to give animal Reiki</h3>
<table>
<tr><th>Method</th><th>When to use it</th></tr>
<tr><td><strong>Distance</strong></td><td>From anywhere, including for past trauma or an upcoming vet visit.</td></tr>
<tr><td><strong>Beaming</strong></td><td>Across the room, to connect with an animal you don't know before moving closer, or for animals in shelters, zoos or the wild.</td></tr>
<tr><td><strong>Hovering</strong></td><td>Hands just above the body, for small or very sick animals who find the weight of a hand uncomfortable.</td></tr>
<tr><td><strong>Hands-on</strong></td><td>Adapt the Level 1 positions to the animal's body, starting at the shoulders or behind the ears.</td></tr>
</table>
<p>For large animals like horses, several practitioners can give Reiki together.</p>
<h3>Safety first</h3>
<div class="callout warn">If an animal's mood changes or you feel unsafe at any point, stop, step back calmly, and continue from a distance. With unfamiliar or large animals, always start from a distance.</div>
<p>Remember that you're often helping the animal's people too. Owners and caregivers are frequently worried or grieving, and they may welcome Reiki themselves.</p>
`;}},

/* ===== Saved progress =====
   Progress is kept in this browser (localStorage). Learners can also copy a
   short resume code, or download a progress file, to continue on another
   device. Nothing is sent to any server. */
var STORE_KEY="reiki-course-"+COURSE.id+"-v1";
var state={v:[],cur:0,best:null,name:"",log:[]};
var storageOK=(function(){try{var k="__reiki_test__";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
var hadSaved=false;
function cleanState(s){
  var out={v:[],cur:0,best:null,name:"",log:[]};
  if(!s||typeof s!=="object")return out;
  if(Array.isArray(s.v))s.v.forEach(function(i){i=parseInt(i,10);if(i>=0&&i<lessonCount()&&out.v.indexOf(i)<0)out.v.push(i);});
  var c=parseInt(s.cur,10);if(c>=0&&c<LESSONS.length)out.cur=c;
  var b=parseInt(s.best,10);if(b>=0&&b<=100)out.best=b;
  if(typeof s.name==="string")out.name=s.name.slice(0,80);
  if(Array.isArray(s.log))s.log.forEach(function(e){
    if(!e||typeof e!=="object")return;
    out.log.push({id:String(e.id||Date.now()+Math.random()),date:String(e.date||"").slice(0,10),type:String(e.type||"").slice(0,60),mins:Math.max(0,Math.min(600,parseInt(e.mins,10)||0)),did:String(e.did||"").slice(0,2000),noticed:String(e.noticed||"").slice(0,2000),ask:String(e.ask||"").slice(0,2000)});
  });
  return out;
}
function load(){
  if(!storageOK)return;
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){state=cleanState(JSON.parse(raw));hadSaved=true;}}catch(e){}
}
function save(){
  if(!storageOK)return;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}
}

/* ----- Resume codes: lessons done, current page and best score, with a checksum ----- */
var B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function makeCode(){
  var n=lessonCount(),bytes=[COURSE.level,n,state.cur,state.best===null?255:state.best];
  for(var i=0;i<Math.ceil(n/8);i++){var m=0;for(var j=0;j<8;j++){if(state.v.indexOf(i*8+j)>=0)m|=1<<j;}bytes.push(m);}
  var sum=0;bytes.forEach(function(b){sum=(sum*31+b)%251;});bytes.push(sum);
  var bits="";bytes.forEach(function(b){bits+=("00000000"+b.toString(2)).slice(-8);});
  while(bits.length%5)bits+="0";
  var s="";for(var k=0;k<bits.length;k+=5)s+=B32[parseInt(bits.substr(k,5),2)];
  return "L"+COURSE.level+"-"+s.match(/.{1,4}/g).join("-");
}
function readCode(code){
  code=String(code||"").toUpperCase().replace(/\s+/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  var m=code.match(/^1(\d)-?([0-9A-Z-]+)$/);
  if(!m)return {err:"That doesn't look like a resume code. It should start with L"+COURSE.level+"-."};
  if(parseInt(m[1],10)!==COURSE.level)return {err:"That code is for Reiki Level "+m[1]+". Please enter it in the Level "+m[1]+" course."};
  var body=m[2].replace(/-/g,""),bits="";
  for(var i=0;i<body.length;i++){var x=B32.indexOf(body[i]);if(x<0)return {err:"That code has a character that isn't used in resume codes. Please check it and try again."};bits+=("00000"+x.toString(2)).slice(-5);}
  var bytes=[];for(var k=0;k+8<=bits.length;k+=8)bytes.push(parseInt(bits.substr(k,8),2));
  if(bytes.length<5)return {err:"That code is too short. Please check it and try again."};
  var n=bytes[1],need=4+Math.ceil(n/8)+1;
  if(bytes.length<need)return {err:"That code is too short. Please check it and try again."};
  if(body.length!==Math.ceil(need*8/5)||/1/.test(bits.slice(need*8)))return {err:"That code didn't check out. Please check for typos and try again."};
  bytes=bytes.slice(0,need);
  var sum=0;for(var q=0;q<need-1;q++)sum=(sum*31+bytes[q])%251;
  if(sum!==bytes[need-1]||bytes[0]!==COURSE.level)return {err:"That code didn't check out. Please check for typos and try again."};
  var v=[];for(var i2=0;i2<n;i2++){if(bytes[4+Math.floor(i2/8)]&(1<<(i2%8)))v.push(i2);}
  return {v:v,cur:bytes[2],best:bytes[3]===255?null:bytes[3]};
}

    h+='<fieldset class="q" id="q'+qi+'"><legend>'+(qi+1)+'. '+q.q+'</legend>';
    q.a.forEach(function(a,ai){h+='<label><input type="radio" name="q'+qi+'" value="'+ai+'"> '+a+'</label>';});
    h+='<div class="fb" aria-live="polite"></div></fieldset>';
  });
  h+='<p class="form-msg" id="quizMsg" role="alert"></p><button class="btn" id="submitQuiz">Submit answers</button><div id="result"></div>';
  content.innerHTML=h;
  document.getElementById("learnerName").onchange=function(){state.name=this.value.trim().slice(0,80);save();};
  document.getElementById("submitQuiz").onclick=gradeQuiz;
}
function gradeQuiz(){
  var correct=0,missing=[];
  QUIZ.forEach(function(q,qi){if(!document.querySelector('input[name="q'+qi+'"]:checked'))missing.push(qi+1);});
  var msg=document.getElementById("quizMsg");
  if(missing.length){msg.textContent="Please answer every question before submitting. Still unanswered: "+missing.join(", ")+".";document.getElementById("q"+(missing[0]-1)).scrollIntoView({behavior:"smooth",block:"center"});return;}
  msg.textContent="";
  QUIZ.forEach(function(q,qi){
    var sel=parseInt(document.querySelector('input[name="q'+qi+'"]:checked').value,10);
    var box=document.getElementById("q"+qi),ok=sel===q.c;
    if(ok)correct++;
    box.className="q "+(ok?"right":"wrong");
    box.querySelector(".fb").textContent=(ok?"Correct. ":"Not quite. The answer is: "+q.a[q.c]+". ")+q.why;
  });
  var score=Math.round(correct/QUIZ.length*100),pass=score>=PASS_MARK;
  if(state.best===null||score>state.best)state.best=score;
  state.name=(document.getElementById("learnerName").value||"").trim().slice(0,80);
  save(); renderNav();
  var r=document.getElementById("result");
  r.className="result "+(pass?"pass":"fail");
  if(pass){
    var who=esc(state.name);
    var d=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
    var sessions=state.log.length;
    r.innerHTML='<div class="cert"><div class="meta">'+COURSE.certLine+'</div><div class="big">✦ Passed with '+score+'% ✦</div>'
      +(who?'<div style="font-size:19px">'+who+'</div>':'')
      +'<div class="meta">Completed '+d+' · Taught by '+TEACHER.name+', Reiki Master</div>'
      +(sessions?'<div class="meta">Practice sessions logged: '+sessions+'</div>':'')+'</div>'
      +'<h3>Congratulations! Here\'s your next step</h3><p>Take a screenshot of the box above, then follow these steps to arrange your attunement:</p>'
      +attunementSteps()
      +'<div class="callout"><strong>What\'s next:</strong> '+COURSE.nextStep.replace("{teacher}",esc(TEACHER.name))+'</div>'
      +masterEnrollmentSection();
  } else {
    r.innerHTML="You scored "+score+"%. You need "+PASS_MARK+"% to pass. Review the feedback above and try again.<br><button class='btn' style='margin-top:12px' id='retakeBtn'>Retake quiz</button>";
    document.getElementById("retakeBtn").onclick=function(){renderQuiz();focusTop();};
  }
  document.getElementById("submitQuiz").disabled=true;
  r.scrollIntoView({behavior:"smooth"});
}

/* ===== My progress page ===== */
function showProgress(){
  view="progress";renderNav();updateFooter();closeMenu();
  document.title="My progress · "+COURSE.label;
  var code=makeCode();
  var h='<div class="kicker">Your course</div><h2>My progress</h2>'
   +(storageOK?'<p>Your progress saves automatically in this browser on this device. You don\'t need an account.</p>'
              :'<div class="callout warn"><strong>This browser isn\'t saving your progress</strong> (private browsing or blocked site storage can do this). Copy your resume code below before you close the page.</div>')
   +'<p><strong>'+state.v.length+' of '+lessonCount()+'</strong> lessons complete'+(state.best!==null?' · best quiz score <strong>'+state.best+'%</strong>':'')+' · <strong>'+state.log.length+'</strong> practice session'+(state.log.length===1?'':'s')+' logged.</p>'
   +'<h3>Your resume code</h3><p>To continue on another device or browser, copy this code and enter it there. It saves which lessons you\'ve completed, where you are, and your best quiz score.</p>'
   +'<div class="codebox"><code id="resumeCode">'+code+'</code><button class="btn" id="copyCode">Copy code</button></div>'
   +'<h3>Enter a resume code</h3><p>Got a code from another device? Enter it here. It replaces your lesson progress in this browser (your practice log stays as it is).</p>'
   +'<div class="codebox"><label class="sr" for="codeIn">Resume code</label><input id="codeIn" type="text" placeholder="L'+COURSE.level+'-XXXX-XXXX" autocomplete="off" spellcheck="false"><button class="btn" id="useCode">Restore</button></div><p class="form-msg" id="codeMsg" role="alert"></p>'
   +'<h3>Back up everything, including your practice log</h3><p>Your practice log notes are too long to fit in a code. Download a progress file to keep a copy or move everything to another device.</p>'
   +'<p><button class="btn secondary" id="dlBtn">Download progress file</button> <label class="btn secondary filebtn">Restore from file<input type="file" id="fileIn" accept=".json,application/json"></label></p><p class="form-msg" id="fileMsg" role="alert"></p>'
   +'<h3>Start over</h3><p>Clear all progress and your practice log from this browser.</p><p><button class="btn secondary danger" id="resetBtn">Reset everything</button></p><p class="form-msg" id="resetMsg" role="alert"></p>'
   +'<p><button class="btn" id="backBtn">← Back to the lessons</button></p>';
  content.innerHTML=h;focusTop();
  document.getElementById("copyCode").onclick=function(){copyText(code,"Resume code copied.");};
  document.getElementById("useCode").onclick=function(){
    var r=readCode(document.getElementById("codeIn").value),m=document.getElementById("codeMsg");
    if(r.err){m.className="form-msg bad";m.textContent=r.err;return;}
    state.v=r.v.filter(function(i){return i<lessonCount();});state.cur=Math.min(r.cur,LESSONS.length-1);state.best=r.best;
    save();m.className="form-msg ok";m.textContent="Progress restored: "+state.v.length+" of "+lessonCount()+" lessons complete.";renderNav();
    document.getElementById("resumeCode").textContent=makeCode();
  };
  document.getElementById("dlBtn").onclick=function(){
    var data=JSON.stringify({course:"reiki-"+COURSE.id,saved:new Date().toISOString(),progress:state},null,2);
    downloadFile("reiki-level-"+COURSE.level+"-progress-"+today()+".json",data,"application/json");
  };
  document.getElementById("fileIn").onchange=function(){
    var f=this.files&&this.files[0],m=document.getElementById("fileMsg");if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{var d=JSON.parse(rd.result);
        if(!d||d.course!=="reiki-"+COURSE.id){m.className="form-msg bad";m.textContent="That file isn't a progress file for "+COURSE.label+".";return;}
        state=cleanState(d.progress);save();renderNav();showProgress();toast("Progress restored from file.");
      }catch(e){m.className="form-msg bad";m.textContent="That file couldn't be read. Please choose the .json file you downloaded from this course.";}
    };
    rd.readAsText(f);
  };
  var armed=false;
  document.getElementById("resetBtn").onclick=function(){
    var m=document.getElementById("resetMsg");
    if(!armed){armed=true;this.textContent="Yes, erase everything";m.className="form-msg bad";m.textContent="This can't be undone. Download a progress file first if you might want it back. Press the button again to confirm.";return;}
    state=cleanState(null);save();renderNav();showProgress();toast("Progress cleared.");
  };
  document.getElementById("backBtn").onclick=function(){go(state.cur,true);};
}
function copyText(t,msg){
  function fallback(){var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg);}catch(e){toast("Couldn't copy automatically. Please select the text and copy it.");}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(msg);},fallback);}else fallback();
}
function downloadFile(name,text,type){
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast("Downloaded "+name+".");}
  catch(e){toast("Download isn't available here. Use the resume code instead.");}
}

/* ===== Practice log ===== */
function showLog(){
  view="log";renderNav();updateFooter();closeMenu();
  document.title="Practice log · "+COURSE.label;
  var counts={};state.log.forEach(function(e){counts[e.type]=(counts[e.type]||0)+1;});
  var mins=state.log.reduce(function(a,e){return a+(e.mins||0);},0);
  var h='<div class="kicker">Your practice</div><h2>Practice log</h2>'
   +'<p>Reiki is learned by doing. After each practice, take a minute to note what you did and what you noticed. Your log stays in this browser (back it up from <button class="linkbtn" id="toProgress">My progress</button>), and you can print it or email it to your teacher.</p>'
   +'<div class="callout">'+COURSE.logGoal+'</div>'
   +'<div class="log-summary"><div><strong>'+state.log.length+'</strong><span>sessions</span></div><div><strong>'+mins+'</strong><span>minutes</span></div>';
  COURSE.logTypes.forEach(function(t){h+='<div><strong>'+(counts[t]||0)+'</strong><span>'+esc(t.toLowerCase())+'</span></div>';});
  h+='</div><form id="logForm" class="logform no-print" novalidate><h3>Add a session</h3>'
   +'<div class="row"><label>Date<input type="date" id="lDate" value="'+today()+'" required></label>'
   +'<label>Type<select id="lType">'+COURSE.logTypes.map(function(t){return '<option>'+esc(t)+'</option>';}).join("")+'</select></label>'
   +'<label>Minutes<input type="number" id="lMins" min="0" max="600" inputmode="numeric" placeholder="e.g. 30"></label></div>'
   +'<label>What did you do? <span class="hint">'+COURSE.logHint+'</span><textarea id="lDid" rows="2"></textarea></label>'
   +'<label>What did you notice? <span class="hint">Sensations in your hands, feelings, what the recipient said</span><textarea id="lNoticed" rows="2"></textarea></label>'
   +'<label>Questions for your teacher <span class="hint">Optional</span><textarea id="lAsk" rows="2"></textarea></label>'
   +'<p class="form-msg" id="logMsg" role="alert"></p><button class="btn" type="submit">Save session</button></form>';
  h+='<div class="log-actions no-print"><button class="btn secondary" id="printLog">Print log</button> <button class="btn secondary" id="mailLog">Email log to '+esc(TEACHER.name.split(" ")[0])+'</button></div>';
  h+='<h3>Your sessions</h3>';
  if(!state.log.length)h+='<p class="muted">No sessions yet. Your first one will appear here.</p>';
  else{
    h+='<ol class="log-list" reversed>';
    state.log.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;}).forEach(function(e){
      h+='<li><div class="log-head"><strong>'+prettyDate(e.date)+'</strong> · '+esc(e.type)+(e.mins?' · '+e.mins+' min':'')+'<button class="linkbtn no-print del" data-id="'+esc(e.id)+'">Delete</button></div>'
        +(e.did?'<p><em>Did:</em> '+esc(e.did)+'</p>':'')+(e.noticed?'<p><em>Noticed:</em> '+esc(e.noticed)+'</p>':'')+(e.ask?'<p><em>Question:</em> '+esc(e.ask)+'</p>':'')+'</li>';
    });
    h+='</ol>';
  }
  h+='<p class="no-print"><button class="btn" id="backBtn2">← Back to the lessons</button></p>';
  content.innerHTML=h;focusTop();
  document.getElementById("toProgress").onclick=showProgress;
  document.getElementById("logForm").onsubmit=function(ev){
    ev.preventDefault();
    var g=function(id){return document.getElementById(id).value.trim();},m=document.getElementById("logMsg");
    if(!g("lDate")){m.className="form-msg bad";m.textContent="Please choose a date.";return;}
    if(!g("lDid")&&!g("lNoticed")){m.className="form-msg bad";m.textContent="Add a few words about what you did or noticed.";return;}
    state.log.push(cleanState({log:[{id:Date.now()+"-"+Math.floor(Math.random()*1e6),date:g("lDate"),type:g("lType"),mins:g("lMins"),did:g("lDid"),noticed:g("lNoticed"),ask:g("lAsk")}]}).log[0]);
    save();showLog();toast("Session saved to your practice log.");
  };
  content.querySelectorAll(".del").forEach(function(b){b.onclick=function(){
    if(b.getAttribute("data-armed")){var id=b.getAttribute("data-id");state.log=state.log.filter(function(e){return e.id!==id;});save();showLog();toast("Session deleted.");}
    else{b.setAttribute("data-armed","1");b.textContent="Confirm delete";}
  };});
  document.getElementById("printLog").onclick=function(){document.body.classList.add("print-log");window.print();setTimeout(function(){document.body.classList.remove("print-log");},500);};
  document.getElementById("mailLog").onclick=function(){
    var lines=["Hi "+TEACHER.name.split(" ")[0]+",","","Here is my "+COURSE.label+" practice log ("+state.log.length+" sessions, "+mins+" minutes).",""];
    var list=state.log.slice().sort(function(a,b){return a.date<b.date?1:-1;}),body,shown=0;
    for(var i=0;i<list.length;i++){
      var e=list[i],t=["• "+e.date+" · "+e.type+(e.mins?" · "+e.mins+" min":"")];
      if(e.did)t.push("  Did: "+e.did);if(e.noticed)t.push("  Noticed: "+e.noticed);if(e.ask)t.push("  Question: "+e.ask);
      var next=lines.concat(t);if(encodeURIComponent(next.join("\n")).length>1600&&shown)break;
      lines=next;shown++;
    }
    if(shown<list.length)lines.push("","(Showing my "+shown+" most recent sessions. I can send the full log as a file.)");
    lines.push("","Thank you!",state.name||"");
    body=lines.join("\n");
    location.href="mailto:"+TEACHER.email+"?subject="+encodeURIComponent(COURSE.label+" practice log")+"&body="+encodeURIComponent(body);
  };
  document.getElementById("backBtn2").onclick=function(){go(state.cur,true);};
}

/* ===== Wiring ===== */
var menuBtn=document.getElementById("menuBtn");
function closeMenu(){nav.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");}
document.getElementById("prevBtn").onclick=function(){if(state.cur>0)go(state.cur-1,true);};
document.getElementById("nextBtn").onclick=function(){if(state.cur<LESSONS.length-1)go(state.cur+1,true);};
menuBtn.onclick=function(){var o=nav.classList.toggle("open");menuBtn.setAttribute("aria-expanded",o?"true":"false");};
document.getElementById("logBtn").onclick=showLog;
document.getElementById("progressBtn").onclick=showProgress;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&nav.classList.contains("open")){closeMenu();menuBtn.focus();}});
load();
go(Math.min(state.cur,LESSONS.length-1),false);
if(hadSaved&&(state.v.length||state.log.length))toast("Welcome back. You're on: "+LESSONS[state.cur].title+".");
</script>
