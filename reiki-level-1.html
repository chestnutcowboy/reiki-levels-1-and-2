<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reiki Level 1</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2438; --muted:#6b6478; --line:#ebe5dc;
  --ok:#1d7a4c; --bad:#b0322e;
  --rainbow:linear-gradient(90deg,#d64541,#f08a24,#f4b400,#2fa36b,#2e86de,#3c4fc6,#9b3fb5);
  /* current lesson's chakra color, set by script */
  --c:#d64541; --c-deep:#a8322f; --c-soft:#fbe9e8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:relative}
header h1{font-size:19px;margin:0;font-weight:normal;letter-spacing:.4px}
header h1 small{font:12px system-ui,sans-serif;opacity:.7;margin-left:8px;letter-spacing:1px;text-transform:uppercase}
header .prog{margin-left:auto;font:13px/1 system-ui,sans-serif;opacity:.9}
.track{height:6px;background:#e9e3ef;position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--rainbow);background-size:100vw 100%;transition:width .4s}
#menuBtn{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer}
.wrap{flex:1;display:flex;min-height:0}
nav{width:290px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 0;font:15px/1.35 system-ui,sans-serif}
nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:10px 18px 10px 14px;color:var(--ink);cursor:pointer;font:inherit}
nav button:hover{background:var(--soft)}
nav button.active{background:var(--soft);font-weight:600;border-left-color:var(--col)}
nav button:disabled{color:#aaa;cursor:not-allowed}
nav .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--col);margin-top:1px;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff}
nav .done .dot{background:var(--col)}
main{flex:1;overflow-y:auto;padding:32px 20px 40px}
article{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:34px 40px}
article h2{color:var(--c-deep);margin:0 0 6px;font-size:30px;font-weight:normal}
article .kicker{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:var(--c-deep);margin-bottom:4px}
article h3{margin:28px 0 6px;font-size:19px}
article a{color:var(--c-deep)}
.callout{background:var(--c-soft);border-left:4px solid var(--c);padding:12px 16px;border-radius:6px;margin:18px 0}
.callout.warn{background:#fdf3dc;border-color:#f4b400}
.principles{list-style:none;padding:0;margin:16px 0}
.principles li{padding:10px 14px;border-bottom:1px solid var(--line);font-style:italic}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft)}
.fig{margin:22px 0;text-align:center}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font:14px system-ui,sans-serif;color:var(--muted);margin-top:8px}
.principles li:nth-child(1){border-left:4px solid #d64541}.principles li:nth-child(2){border-left:4px solid #f08a24}.principles li:nth-child(3){border-left:4px solid #f4b400}.principles li:nth-child(4){border-left:4px solid #2fa36b}.principles li:nth-child(5){border-left:4px solid #3c4fc6}
.chakra{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.footer-nav{max-width:760px;margin:20px auto 0;display:flex;justify-content:space-between;gap:12px}
.btn{display:inline-block;background:var(--c-deep);color:#fff!important;border:0;border-radius:8px;padding:11px 22px;font:15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.secondary{background:#fff;color:var(--c-deep)!important;border:1px solid var(--c-deep)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rainbow-rule{height:4px;border:0;border-radius:2px;background:var(--rainbow);margin:26px 0}
.teacher{display:flex;gap:16px;align-items:center;background:var(--c-soft);border-radius:10px;padding:16px 18px;margin:18px 0}
.teacher .badge{flex:0 0 54px;height:54px;border-radius:50%;background:var(--rainbow);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 14px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;color:#fff;font:600 15px/32px system-ui,sans-serif;text-align:center;background:var(--sc,#888)}
.steps li:nth-child(1){--sc:#d64541}.steps li:nth-child(2){--sc:#2fa36b}.steps li:nth-child(3){--sc:#3c4fc6}
.steps .btn{margin-top:8px;margin-right:8px}
.paybox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px}
.paybox img{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;background:#fff}
.paybox .addr{font:14px system-ui,sans-serif;color:var(--muted)}
.paybox .addr strong{color:var(--ink)}
.q{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
.q p{margin:0 0 10px;font-weight:600}
.q label{display:block;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:16px}
.q label:hover{background:var(--c-soft)}
.q.right{border-color:var(--ok)} .q.wrong{border-color:var(--bad)}
.q .fb{font:14px system-ui,sans-serif;margin-top:8px}
.q.right .fb{color:var(--ok)} .q.wrong .fb{color:var(--bad)}
.result{padding:20px;border-radius:10px;margin-top:20px}
.result.fail{background:#f9e6e5;color:var(--bad);text-align:center;font-size:19px}
.cert{text-align:center;border-radius:12px;padding:26px 20px;background:#fff;border:2px solid transparent;background-image:linear-gradient(#fff,#fff),var(--rainbow);background-origin:border-box;background-clip:padding-box,border-box}
.cert .big{font-size:26px;color:var(--ink);margin:4px 0}
.cert .meta{font:14px system-ui,sans-serif;color:var(--muted)}
@media (max-width:820px){
  #menuBtn{display:block}
  nav{position:fixed;top:58px;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  nav.open{transform:none}
  article{padding:24px 18px}
  main{padding:16px 12px 30px}
  header h1 small{display:none}
}
/* ===== Hand-position figures ===== */
.rkfig{display:block;width:100%;height:auto}
.rkfig .tbl{fill:#fbf8f3;stroke:#d9d1c4;stroke-width:1.5}
.rkfig .pillow{fill:#fff;stroke:#d9d1c4;stroke-width:1.2}
.rkfig .chair{fill:#ece5f2;stroke:#cfc5da;stroke-width:1.2}
.rkfig .chairl{stroke:#cfc5da;stroke-width:5;stroke-linecap:round;fill:none}
.rkfig .body path,.rkfig .body rect,.rkfig .body ellipse{fill:#efe6db;stroke:#8c8296;stroke-width:1.6;stroke-linejoin:round}
.rkfig .hair{fill:#7a675c;stroke:#5d4d44;stroke-width:1}
.rkfig .face{fill:none;stroke:#7d7288;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.rkfig .fold,.rkfig .spine{fill:none;stroke:#b3a9bb;stroke-width:1.2;stroke-linecap:round}
.rkfig .spine{stroke-dasharray:3 4}
.rkfig .limb-o{fill:none;stroke:#8c8296;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.rkfig .limb{fill:none;stroke:#efe6db;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.rkfig .parm{stroke:#c4572f;stroke-opacity:.28;stroke-width:15;stroke-linecap:round}
.rkfig .hand path,.rkfig .hand ellipse{fill:#d0683f;stroke:#7e2f13;stroke-width:1.3;stroke-linejoin:round}
.rkfig .hand .fl{fill:none;stroke:#7e2f13;stroke-opacity:.55;stroke-width:1}
.rkfig .hand.hover path,.rkfig .hand.hover ellipse{fill:#d0683f;fill-opacity:.16;stroke:#b0461f;stroke-dasharray:3.5 2.5;stroke-width:1.6}
.rkfig .hand.hover .fl{stroke-dasharray:none;stroke-opacity:.35}
.rkfig .hand.under path,.rkfig .hand.under ellipse{fill:#d0683f;fill-opacity:.38;stroke:#7e2f13;stroke-opacity:.75;stroke-dasharray:1.5 2.5}
.rkfig .badge circle{fill:#2b2438}
.rkfig .badge text{fill:#fff;font:700 12px system-ui,sans-serif}
.rkfig .sweep{fill:none;stroke:#2e86de;stroke-width:2.2;stroke-dasharray:6 5;stroke-linecap:round}
.rkfig .sweep-h{fill:none;stroke:#2e86de;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig-key{display:flex;flex-wrap:wrap;gap:6px 18px;font:13px system-ui,sans-serif;color:var(--muted);margin:8px 0 14px}
.fig-key span{display:inline-flex;align-items:center;gap:6px}
.fig-key i{display:inline-block;width:20px;height:12px;border-radius:6px;background:#d0683f;border:1.3px solid #7e2f13}
.fig-key i.hv{background:rgba(208,104,63,.16);border:1.6px dashed #b0461f}
.fig-key i.un{background:rgba(208,104,63,.5);border:1.3px dotted #7e2f13}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:16px 0}
.pos{margin:0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.pos .pfig{background:#fdfbf8;border-bottom:1px solid var(--line);padding:6px 10px 0;display:flex;justify-content:center}
.pos .pfig svg{max-width:220px;max-height:230px}
.pos figcaption{padding:10px 14px 14px;font:14.5px/1.5 system-ui,sans-serif}
.pos figcaption strong{display:block;font-size:16px;margin-bottom:2px}
.pos .where{display:inline-block;font-size:12px;letter-spacing:.3px;color:var(--c-deep);background:var(--c-soft);border-radius:999px;padding:1px 9px;margin:2px 0 6px}
.pos .hv-tag{display:inline-block;font-size:12px;color:#8a3a12;background:#fbe7dc;border-radius:999px;padding:1px 9px;margin:2px 0 6px 4px}
.pos p{margin:4px 0}
.pos .sym{color:var(--muted)}
.pos .sym b{color:var(--ink);font-weight:600}
.pos .trad{color:var(--muted);font-size:13px}
.pos .red{background:#fde8e6;color:#8e231d;border-radius:8px;padding:6px 8px;font-size:13px}
.pos .pg{font-size:12px;color:var(--muted)}
.part-h{font:600 13px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--c-deep);margin:22px 0 0}
.obj{background:var(--c-soft);border-radius:10px;padding:12px 18px;margin:18px 0}
.obj-h{font:600 12px system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--c-deep);margin:0 0 4px}
.obj ul{margin:4px 0;padding-left:20px}
.practice{border:2px dashed var(--c);border-radius:10px;padding:12px 18px;margin:24px 0}
.practice p{margin:6px 0}
.script{border-left:4px solid var(--c);background:#faf8f5;padding:12px 16px;border-radius:6px;font-style:italic;margin:12px 0}
.flow{counter-reset:f;list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.flow li{counter-increment:f;background:var(--c-soft);border-radius:999px;padding:6px 14px 6px 8px;font:14px system-ui,sans-serif}
.flow li::before{content:counter(f);display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--c-deep);color:#fff;text-align:center;font:600 12px/22px system-ui,sans-serif;margin-right:8px}
.ck{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 16px;margin:18px 0;font:15px system-ui,sans-serif}
.ck-h{font:600 12px system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--c-deep);margin:0}
.ck-q{font-weight:600;margin:4px 0 10px}
.ck-opts{display:flex;flex-direction:column;gap:6px}
.ck-opts button{text-align:left;background:#fff;border:1px solid #c9c1d3;border-radius:8px;padding:9px 12px;font:15px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.ck-opts button:hover:not(:disabled){background:var(--c-soft)}
.ck-opts button.pick-ok{border-color:var(--ok);background:#e6f4ec}
.ck-opts button.pick-bad{border-color:var(--bad);background:#fbeceb}
.ck-opts button:disabled{cursor:default;color:var(--ink)}
.ck-fb{margin:8px 0 0;min-height:1px}
.ck-fb.ok{color:var(--ok)} .ck-fb.bad{color:var(--bad)}
.lib-tools{background:var(--card);padding:10px 0 4px;border-bottom:1px solid var(--line)}
@media (min-width:821px){.lib-tools{position:sticky;top:-32px;z-index:2}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid #c9c1d3;background:#fff;border-radius:999px;padding:5px 12px;font:13.5px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--c-deep);border-color:var(--c-deep);color:#fff}
.lib-search input{width:100%;max-width:360px;padding:8px 12px;border:1px solid #b9b1c4;border-radius:8px;font:16px system-ui,sans-serif;margin-top:6px}
.lib-count{font:13px system-ui,sans-serif;margin:6px 0 0}
.lib-item[hidden]{display:none}
body.pl-open{overflow:hidden}
.player{position:fixed;inset:0;z-index:40;background:rgba(32,26,42,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.pl-box{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:100%;overflow:auto;padding:16px 20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.pl-top{display:flex;justify-content:space-between;align-items:center;font:600 13px system-ui,sans-serif;color:var(--c-deep);letter-spacing:.5px;text-transform:uppercase}
.pl-x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px}
.pl-body{display:flex;gap:20px;align-items:center;margin:8px 0 12px}
.pl-fig{flex:0 0 46%;background:#fdfbf8;border-radius:10px;display:flex;justify-content:center;min-height:120px}
.pl-fig svg{max-height:52vh}
.pl-text h3{margin:0 0 4px;font-size:24px;font-weight:normal;color:var(--c-deep)}
.pl-text p{margin:8px 0;font-size:17px}
.pl-text .sym{font:15px system-ui,sans-serif;color:var(--muted)}
.pl-ctrl{border-top:1px solid var(--line);padding-top:12px}
.pl-time{font:600 34px/1 ui-monospace,Menlo,Consolas,monospace;text-align:center}
.pl-bar{height:6px;background:#eee8f2;border-radius:3px;margin:10px 0;overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--rainbow);background-size:820px 100%;transition:width .25s linear}
.pl-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pl-opts{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font:14px system-ui,sans-serif;color:var(--muted);margin-top:10px}
.pl-opts select{font:14px system-ui,sans-serif;padding:3px 6px;margin-left:4px}
@media (max-width:640px){
  .pl-body{flex-direction:column;gap:8px}
  .pl-fig{flex:none;width:100%}
  .pl-fig svg{max-height:34vh}
  .pl-text h3{font-size:20px}
  .pl-text p{font-size:16px}
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
}
@media print{.player,.lib-tools,[data-follow]{display:none!important}.pos{break-inside:avoid}}
/* ===== Saved progress, practice log, accessibility ===== */
.skip{position:absolute;left:-9999px;top:8px;z-index:20;background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;font:15px system-ui,sans-serif}
.skip:focus{left:8px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hbtn{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtns{display:flex;gap:8px;margin-left:12px}
:focus-visible{outline:3px solid #2e86de;outline-offset:2px}
article h2:focus{outline:none}
.status{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font:15px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.status.show{opacity:1;transform:translate(-50%,0)}
.complete-box{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:34px;padding:16px 18px;border:2px dashed var(--c);border-radius:10px;font:15px system-ui,sans-serif}
.complete-box span{color:var(--muted)}
.complete-box.is-done{border-style:solid;background:var(--c-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--c-deep);text-decoration:underline;cursor:pointer;font:inherit}
.todo li{margin:6px 0}
.codebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.codebox code{font:600 20px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px;background:var(--c-soft);padding:10px 14px;border-radius:8px;word-break:break-all}
.codebox input,.logform input,.logform select,.logform textarea{padding:9px 12px;border:1px solid #b9b1c4;border-radius:8px;font:16px system-ui,sans-serif;background:#fff;color:var(--ink)}
.codebox input{width:16em;max-width:100%;text-transform:uppercase;letter-spacing:1px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid #2e86de;outline-offset:2px}
.btn.danger{color:var(--bad)!important;border-color:var(--bad)}
.form-msg{font:15px system-ui,sans-serif;min-height:1px;margin:6px 0}
.form-msg.ok{color:var(--ok)} .form-msg.bad{color:var(--bad)}
.muted{color:var(--muted)}
.log-summary{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.log-summary div{flex:1 1 110px;background:var(--c-soft);border-radius:10px;padding:10px 12px;text-align:center;font:13px system-ui,sans-serif;color:var(--muted)}
.log-summary strong{display:block;font-size:24px;color:var(--ink)}
.logform{border:1px solid var(--line);border-radius:10px;padding:4px 18px 16px;margin:18px 0}
.logform label{display:block;font:15px system-ui,sans-serif;margin:10px 0}
.logform label input,.logform label select,.logform label textarea{display:block;width:100%;margin-top:4px}
.logform .row{display:flex;gap:12px;flex-wrap:wrap}
.logform .row label{flex:1 1 140px}
.logform .hint{color:var(--muted);font-size:13px}
.log-actions{margin:12px 0 4px}
.log-list{padding-left:22px}
.log-list li{border-bottom:1px solid var(--line);padding:10px 0}
.log-list p{margin:4px 0;font-size:16px}
.log-head{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font:15px system-ui,sans-serif}
.log-head .del{margin-left:auto;color:var(--bad);font-size:14px}
fieldset.q{display:block;min-width:0;margin:16px 0}
fieldset.q legend{font-weight:600;padding:0 4px;margin-bottom:6px}
@media (max-width:820px){
  header{padding:12px 12px;gap:8px}
  header .prog{display:none}
  .hbtns{margin-left:auto;gap:6px}
  .hbtn,#menuBtn{padding:6px 8px;font-size:13px}
}
@media (max-width:420px){
  header h1{font-size:16px}
  .hbtn .lbl{display:none}
}
@media print{
  header,nav,.track,.footer-nav,.status,.skip,.no-print,.complete-box{display:none!important}
  html,body,.wrap,main{display:block;height:auto;overflow:visible;background:#fff}
  main{padding:0}
  article{border:0;padding:0;max-width:none}
  a{color:inherit}
}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to lesson</a>
<header>
  <button id="menuBtn" aria-controls="nav" aria-expanded="false">☰ Lessons</button>
  <h1>Reiki Level 1 <small>Shoden</small></h1>
  <span class="prog" id="prog"></span>
  <div class="hbtns"><button class="hbtn" id="logBtn" aria-label="Practice log"><span aria-hidden="true">📓</span><span class="lbl"> Practice log</span></button><button class="hbtn" id="progressBtn" aria-label="My progress"><span aria-hidden="true">💾</span><span class="lbl"> My progress</span></button></div>
</header>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="wrap">
  <nav id="nav" aria-label="Lessons"></nav>
  <main id="main">
    <article id="content" tabindex="-1"></article>
    <div class="footer-nav">
      <button class="btn secondary" id="prevBtn">← Back</button>
      <button class="btn" id="nextBtn">Next →</button>
    </div>
  </main>
</div>

var FIG=(function(){
  function f(n){return Math.round(n*10)/10;}
  function rot(x,y,a){var r=a*Math.PI/180;return [x*Math.cos(r)-y*Math.sin(r),x*Math.sin(r)+y*Math.cos(r)];}
  /* hand pointing "up" (fingers toward -y), wrist at +y, centred on 0,0 */

  var FINGERS="M-4.1,-5.5 L-4.1,-19 M0,-5.5 L0,-20.6 M4.1,-5.5 L4.1,-19";
  var TWO="M-4,13 L-4,-11 Q-4,-15 0,-15 Q4,-15 4,-11 L4,13 Z";
  function hand(h,arms){
    var s=h.s||1,a=h.a||0,k=h.k||"touch",out="";
    var w=rot(0,19*s,a),wx=h.x+w[0],wy=h.y+w[1];
    if(arms==="prac"&&h.arm!==false){
      var ad=(h.arm!==undefined?h.arm:a+180)*Math.PI/180, L=h.al||90;
      out+='<line class="parm" x1="'+f(wx)+'" y1="'+f(wy)+'" x2="'+f(wx+Math.sin(ad)*L)+'" y2="'+f(wy-Math.cos(ad)*L)+'"/>';
    }
    out+='<g class="hand '+k+'" transform="translate('+f(h.x)+' '+f(h.y)+') rotate('+a+') scale('+s+')">';
    if(h.two)out+='<path d="'+TWO+'"/><path class="fl" d="M0,-12 L0,10"/>';
    else{
      var t=h.t||1;
      out+='<ellipse class="th" cx="'+(t*9.5)+'" cy="3" rx="3.4" ry="8.5" transform="rotate('+(t*-16)+' '+(t*9.5)+' 3)"/>';

/* ===== Hands-on lessons: helpers ===== */
function figKey(){return '<div class="fig-key" aria-hidden="true"><span><i></i>Hands resting lightly on the body</span><span><i class="hv"></i>Hovering just above the body</span><span><i class="un"></i>Hands slid underneath</span></div>';}
function figFor(p,who,n){return FIG.draw(Object.assign({},p.fig,{who:who,n:n,label:(n?"Position "+n+": ":"")+p.name+". "+p.how}));}
function posCard(p,who,opts){
  opts=opts||{};
  var hover=(p.fig.hands||[]).some(function(h){return h.k==="hover";});
  return '<figure class="pos"><div class="pfig">'+figFor(p,who,opts.num===false?null:p.n)+'</div><figcaption>'
    +'<strong>'+(opts.num===false?'':p.n+'. ')+p.name+'</strong>'
    +(p.where?'<span class="where">'+p.where+'</span>':'')+(hover?'<span class="hv-tag">Hover</span>':'')
    +'<p>'+p.how+'</p>'
    +(p.sym?'<p class="sym"><b>Symbols:</b> '+p.sym+'</p>':'')
    +(p.trad?'<p class="trad">'+p.trad+'</p>':'')
    +'</figcaption></figure>';
}

/* ===== Lesson: Self-Healing with Reiki (Level 1) ===== */
function lesson1Self(k){return `
<div class="kicker">Lesson ${k}</div>
<h2>Self-Healing with Reiki</h2>
<p>Self-healing is the heart of Level 1. Hawayo Takata taught her students to heal themselves first, then their families, then their friends, and only then other people. A daily self-treatment deepens your connection to Reiki, keeps your own energy balanced, builds sensitivity in your hands, and is your strongest foundation as a practitioner.</p>
${objectives(["give yourself the full 18-position self-treatment from your manual","hold your hands correctly and know how long to stay","fit Reiki into your day with shorter routines and Reiki breaks"])}
<div class="callout">You can't pour from an empty cup. The more consistently you treat yourself, the clearer a channel you become for others.</div>
<h3>Preparing for self-healing</h3>
<ol>
<li><strong>Find your space.</strong> Somewhere quiet where you won't be disturbed; soft music is fine. Sit upright with your feet flat on the floor, or lie on your back. Use pillows under your elbows so your arms can rest without strain.</li>
<li><strong>Gassho.</strong> Bring your palms together at your heart. Take a few slow breaths and let the day settle.</li>
<li><strong>Breathe in Reiki (Joshin Kokyu Ho).</strong> As you breathe in through your nose, imagine light flowing in through the crown of your head and down to your lower belly, just below the navel (the hara). As you breathe out, imagine it spreading through your whole body and out through your hands.</li>
<li><strong>Set your intention,</strong> for example: "I am open to receiving Reiki for my highest good."</li>
<li><strong>If something hurts,</strong> place your hands there first, then go on to the full self-treatment.</li>
</ol>
<h3>How to hold your hands</h3>
<ul>
<li>Keep your fingers together and your hands relaxed and gently cupped, "as though holding water."</li>
<li>Rest your hands lightly, with no pressure and no massage.</li>
<li>Stay <strong>3 to 5 minutes</strong> in each position, or until the sensation in your hands changes.</li>
<li>Move one hand at a time so you always keep contact.</li>
</ul>
<h3>The 18 self-treatment positions</h3>
<p>These follow your manual's sequence (pp.40–48): the head, down the front of the body, the knees, the back, and finally the feet. The positions are a guide. Once you know them, let your intuition lead.</p>
${figKey()}
${followBtn("self","Follow along: self-treatment")}
${posGrid(SEQ.self,"self")}
<div class="callout"><strong>Can't reach a position?</strong> If a position strains your shoulders or back, leave it out, lie down with a cushion under your arms, or cross your arms and hold the opposite shoulders instead. A little Reiki is better than none.</div>
<h3>Closing your session</h3>
<p>Return to gassho and thank Reiki and yourself. Sweep your aura by passing your hands a few inches above your body from head to toe, or use Kenyoku (Lesson 8). Then drink a large glass of water, close your eyes for a moment, and notice any thoughts or feelings that came up. If you feel light-headed, rest until it passes.</p>
<h3>Making it a daily practice</h3>
<p>A morning self-treatment gives you a positive start to the day; one at night helps you relax and sleep. Good places include your bed, a comfortable chair, or even the bath.</p>
<table>
<tr><th>Routine</th><th>When</th><th>What to do</th></tr>
<tr><td><strong>Full session</strong><br>60–90 min</td><td>A few times a week, and daily during the 21 days after your attunement</td><td>All 18 positions, 3–5 minutes each</td></tr>
<tr><td><strong>Short session</strong><br>about 20 min</td><td>On busy days</td><td>Positions 1, 2, 4, 7, 9, 11, 17 and 18, two or three minutes each</td></tr>
<tr><td><strong>Morning reset</strong><br>10 min</td><td>Before you get out of bed</td><td>Read the Five Principles, then crown (2), heart (7) and solar plexus (9)</td></tr>
<tr><td><strong>Bedtime</strong><br>15 min</td><td>Lying in bed</td><td>Back of head (4), heart (7), solar plexus (9), lower abdomen (11). It's fine to fall asleep; Reiki keeps flowing.</td></tr>
<tr><td><strong>In the moment</strong><br>1–3 min</td><td>Whenever you feel stressed</td><td>One hand on your heart, one on your solar plexus. Breathe.</td></tr>
</table>
<h3>Reiki breaks through the day (the ultradian rhythm)</h3>
<p>Your body runs in natural cycles of roughly 90 to 120 minutes, called <strong>ultradian rhythms</strong>. At the low point of each cycle you may notice yawning, wandering focus, a daydreamy feeling, or a craving for coffee or a snack. Instead of pushing through, take a short Reiki break:</p>
<ol>
<li>Cup your hands over your eyes (self position 1), close your eyes and go inside.</li>
<li>Notice any part of your body that feels tight, sore or tired, and move your hands there for as long as you need.</li>
<li>Imagine that area filling with healing light. Let the light grow brighter and larger until it surrounds your whole body.</li>
<li>When you feel refreshed, gently open your eyes and carry on with your day.</li>
</ol>
<p><strong>No time for a break?</strong> Your manual suggests tapping gently 20 to 30 times on your upper chest over the thymus (between the throat and the heart), or resting a hand there for a few minutes, to boost your vitality.</p>
<h3>Listening to your body</h3>
<ul>
<li><strong>Follow your hands.</strong> If a position feels warm, tingly or "busy," stay longer. If it feels complete, move on.</li>
<li><strong>Let emotions move.</strong> Tears, sighs, laughter or memories can surface. Let them come and go without judging them.</li>
<li><strong>Feeling nothing is okay.</strong> Some days are quiet. Reiki is still flowing; your sensitivity will grow with practice.</li>
<li><strong>Journal.</strong> A few notes after each session (sensations, feelings, how you slept) help you notice changes over weeks. Your practice log is a good place for them.</li>
</ul>
${check("How long does your manual suggest staying in each self-treatment position?",["About 30 seconds","3 to 5 minutes","20 minutes"],1,"Three to five minutes per position, or until the sensation in your hands changes.")}
${check("Which position finishes the full self-treatment?",["Hands over the eyes","Holding your feet","Hands on the crown"],1,"After the V at the base of the spine (17), you finish by holding your feet (18), which grounds you.")}
${check("You feel a mid-afternoon slump. What does the ultradian rhythm technique suggest?",["Have a coffee and push on","Cup your hands over your eyes and take a short Reiki break","Skip Reiki until the evening"],1,"Treat the dip as a cue to rest: hands over the eyes, find what needs Reiki, and fill yourself with light.")}
${practiceBox("<p>Give yourself the full 18-position self-treatment at least three times this week, using the follow-along player if it helps, and a short routine on the other days. Log each session: which positions felt warm, tingly or quiet.</p>")}
<div class="callout warn">Self-healing supports your wellbeing, but it doesn't replace medical or mental health care. If you're dealing with a health condition, use Reiki alongside the care of a qualified professional.</div>
`;}

/* ===== Lesson: Treating Others, the table session (Level 1) ===== */
function lesson1Table(k){return `
<div class="kicker">Lesson ${k}</div>
<h2>Treating Others: The Table Session</h2>
<p>At Level 1 you can share Reiki with friends, family and pets. (Working with paying clients is covered at Level 2.) This lesson follows your manual's full-body treatment (pp.49–64): preparing, opening, 19 hand positions, and closing.</p>
${objectives(["prepare the room, yourself and the person you're treating","open a session with an invocation and an aura cleanse","give all 19 positions, face up then face down","close the session and look after both of you afterward"])}
<h3>Before the session</h3>
<ul>
<li><strong>Ask permission.</strong> Never give Reiki without consent.</li>
<li><strong>Explain what will happen,</strong> especially for someone new to Reiki, and ask whether they prefer light touch or hands just above the body.</li>
<li>They stay <strong>fully clothed</strong>. Ask them to remove shoes, glasses, belts and anything tight.</li>
</ul>
<h3>Prepare the room</h3>
<ul>
<li>A light, clean room that feels safe, where you won't be interrupted. Unplug the phone and let others know not to disturb you.</li>
<li>A therapy table if possible, or a sturdy table or bed with thick blankets. You'll need two pillows and a warm blanket; people often get cold lying still.</li>
<li>A plant, and crystals if you use them. Soft music helps both of you relax. Some Reiki music has a chime every 3–5 minutes to tell you when to move; the follow-along player in this lesson does the same.</li>
<li>Ask before burning incense or oils; some people are sensitive to scents.</li>
<li>Keep a box of tissues handy. Emotional release is common.</li>
</ul>
<h3>Prepare yourself</h3>
<ul>
<li>Remove rings, watches, bracelets and other jewelry, and loosen tight clothing.</li>
<li>Avoid alcohol for 24 hours before giving Reiki.</li>
<li>Be clean and fresh: no strong perfume, and avoid garlic or smoking beforehand. Wash your hands with a mild soap and keep your nails short.</li>
</ul>
<h3>Opening the session</h3>
<p>Remember that you aren't the healer: the person receiving draws Reiki through you to wherever it's needed. Help them lie flat on their back with their arms resting at their sides and their legs uncrossed, with a pillow under the head and one under the knees or feet, and offer the blanket.</p>
<ol>
<li><strong>The invocation.</strong> Stand at their head, close your eyes, and bring your hands together in prayer position in front of your heart. (If they're seated, rest your hands on their shoulders.) Ask to be a channel for Reiki, in words that fit your own beliefs, for example:
<div class="script">"I ask that Reiki flow through me for [name]'s highest good. May I be a clear and loving channel, and may this healing go wherever it is most needed."</div></li>
<li><strong>Cleanse and harmonize the aura.</strong> Hold your hands about 15 cm (six inches) above their body and move slowly from head to feet at least three times. This clears superficial energy, builds rapport, and lets you notice any areas that feel hot, cool or "busy."</li>
</ol>
<h3>How to place your hands</h3>
<ul>
<li>Cup your hands with your fingers firmly closed, "as though you were trying to hold water."</li>
<li>Lay them gently on the body, keeping their weight in your own arms. Stay <strong>3 to 5 minutes</strong> in each position.</li>
<li>Move one hand at a time, so you never fully break contact.</li>
<li>Listen through your hands. If the energy feels strong, stay until you feel it shift.</li>
</ul>
<div class="callout warn"><strong>Always hover over:</strong> the throat, the chest (especially with women), the groin and the buttocks, and over burns, wounds or injuries. Keep touch light everywhere else, and stop or adjust right away if the person feels uncomfortable.</div>
<h3>Positions 1–12: face up</h3>
${figKey()}
${followBtn("table","Follow along: table session")}
<p class="part-h">At the head (sit if you can)</p>
${posGrid(SEQ.table.slice(0,6),"prac")}
<p class="part-h">At the side, then the feet</p>
${posGrid(SEQ.table.slice(6,12),"prac")}
<h3>Turning over</h3>
<p>When you've finished the front, quietly ask the person to turn over. They may have fallen asleep, so wake them gently with a light touch on the shoulder. Hold the blanket while they turn, move the pillow under their ankles, and let them rest their head turned to one side.</p>
<h3>Positions 13–19: face down</h3>
${posGrid(SEQ.table.slice(12),"prac")}
<h3>Finishing the treatment</h3>
${posGrid(SEQ.closing,"prac",{num:false})}
<ol>
<li><strong>Balance:</strong> left hand on the crown, right hand at the base of the spine, until the energy feels even.</li>
<li><strong>Comb the aura</strong> three times: first stroke firmly from the crown down past the feet until you touch the floor, for grounding; then a second time lightly touching the body; then a few inches above the body.</li>
<li><strong>Let them rest,</strong> then help them sit up slowly. Offer a glass of cold water to help them ground.</li>
<li><strong>Wash your hands</strong> under cold running water.</li>
</ol>
<h3>What they might feel</h3>
<p>Tell first-timers that any of these is normal, and so is feeling none of them: heat or cold (they may feel cold where you feel heat), seeing colors, memory flashes, involuntary twitches, itchiness, a rumbling stomach, pins and needles, emotional release, a sense of your hands moving when they're still, or falling asleep. Deep sighs and small movements are good signs that they're relaxing. If they feel nothing, explain that Reiki often works subtly and changes may show over the following days.</p>
<h3>How long, and how often?</h3>
<p>A full treatment takes <strong>60 to 90 minutes</strong>. Traditionally, someone new to Reiki was offered <strong>four full treatments on four consecutive days</strong> to get the flow going (manual p.11). When time is short, use the chair session in the next lesson.</p>
<h3>After the session</h3>
<p>Gently tell them the session is complete, give them time, and ask how they feel. Listen rather than interpret, and never tell anyone what you think is "wrong" with them. Suggest they drink water and take it easy for the rest of the day.</p>

${practiceBox("<p>Give at least two full table treatments this week to friends or family who have said yes. Use the follow-along player to keep time, and ask them afterward what they noticed. Log each one.</p>")}

{title:"What Is Reiki?", html:function(){return `
<div class="kicker">Lesson 1</div>
<h2>What Is Reiki?</h2>
${objectives(["explain what the word Reiki means","describe your role as a channel","tell someone what to expect in a session"])}
<p><strong>Reiki</strong> (霊気, pronounced "ray-key") is a Japanese practice in which the practitioner places their hands lightly on or just above the body to channel life-force energy. The word combines two parts:</p>
<figure class="fig"><svg viewBox="0 0 640 210" role="img" aria-label="The Japanese characters Rei and Ki" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="210" rx="14" fill="#fdf5f1"/>
<text x="185" y="128" text-anchor="middle" font-size="104" fill="#d64541" font-family="serif">霊</text>
<text x="455" y="128" text-anchor="middle" font-size="104" fill="#f08a24" font-family="serif">気</text>
<text x="320" y="110" text-anchor="middle" font-size="34" fill="#6b6478" font-family="system-ui,-apple-system,Segoe UI,sans-serif">+</text>
<text x="185" y="166" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#2b2438">Rei</text>
<text x="185" y="189" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#6b6478">universal · spiritual · sacred</text>
<text x="455" y="166" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#2b2438">Ki</text>
<text x="455" y="189" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#6b6478">life-force energy</text></svg></figure>
<p>Together, Reiki is commonly understood as "spiritually guided life-force energy."</p>
<h3>The practitioner as a channel</h3>
<p>A central idea in Reiki is that the practitioner doesn't use their <em>own</em> energy. You act as a channel: Reiki flows through you to the recipient. This is why giving Reiki should leave you feeling balanced rather than drained. If you feel depleted after a session, that's a sign to revisit grounding and protection (Lesson 8).</p>
<p>Your manual puts it this way: Reiki is never <em>sent</em>; it is <em>drawn</em> through the channel by the person receiving it, to wherever it's needed. The practitioner receives a little Reiki too as it flows through them.</p>
<h3>Tuning in: the radio</h3>
<p>Dr. Hayashi described Reiki to Hawayo Takata like radio waves. We can't see them, but they're all around us; when you switch on a radio and tune it, you hear the programme. Reiki is everywhere in the same way, and your attunement tunes you in. Once you've been attuned, the connection stays with you for life.</p>
<h3>What happens in a session</h3>
<ul>
<li>The recipient stays fully clothed, sitting in a chair or lying on a treatment table.</li>
<li>The practitioner places their hands lightly on, or a few inches above, a series of positions on the body.</li>
<li>Sessions usually last 45–90 minutes; self-treatment can be 20–60 minutes.</li>
<li>People commonly report warmth, tingling, deep relaxation, emotional release or simply calm. Some feel very little, and that's fine too.</li>
</ul>
<h3>Supporting your energy</h3>
<p>Everyone has life-force energy, and everyday habits affect how freely it flows. This isn't about being perfect; Reiki is for everyone, whatever their habits. But knowing what nourishes you and what drains you helps you notice the difference.</p>
<table>
<tr><th>Tends to nourish your energy</th><th>Tends to drain it</th></tr>
<tr><td>Restful sleep<br>Water and fresh, whole foods<br>Time outdoors and in sunlight<br>Gentle movement and stretching<br>Slow, deep breathing<br>Laughter, connection and creativity<br>Gratitude and quiet time</td><td>Ongoing stress and rushing<br>Too little sleep<br>Heavy alcohol or drug use<br>Lots of highly processed food<br>Endless screens and news<br>Harsh self-talk<br>Conflict left unresolved</td></tr>
</table>
<h3>Reiki is not a religion</h3>
<p>Reiki has spiritual roots but needs no particular belief system. People of every faith, and of none, practice it.</p>
<div class="callout">Reiki is a complementary practice. It supports relaxation and wellbeing alongside medical care and is never a replacement for it. We'll cover this fully in Lesson 9.</div>
${check("Where does the energy in a Reiki treatment come from?",["Your own personal energy","Universal life force, drawn through you by the person receiving it","The table"],1,"You're the channel, not the source, which is why giving Reiki shouldn't drain you.")}
`;}},

<text x="95" y="183" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b6478">Mount Kurama · Tokyo</text><circle cx="285" cy="92" r="34" fill="#f08a24"/><path d="M269 104 V88 L285 76 L301 88 V104Z" fill="#fff"/><rect x="280" y="93" width="10" height="11" fill="#f08a24"/>

<text x="285" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#2b2438">Chujiro Hayashi</text>
<text x="285" y="183" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b6478">Clinic &amp; hand positions</text><circle cx="475" cy="92" r="34" fill="#2fa36b"/><path d="M455 96 q6 -10 12 0 t12 0 t12 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M455 84 q6 -10 12 0 t12 0 t12 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
<text x="475" y="40" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#2fa36b">1935</text>
<text x="475" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#2b2438">Hawayo Takata</text>
<text x="475" y="183" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b6478">Brings Reiki to Hawaii</text><circle cx="665" cy="92" r="34" fill="#3c4fc6"/><circle cx="665" cy="92" r="16" fill="none" stroke="#fff" stroke-width="3"/><ellipse cx="665" cy="92" rx="7" ry="16" fill="none" stroke="#fff" stroke-width="2.5"/><line x1="649" y1="92" x2="681" y2="92" stroke="#fff" stroke-width="2.5"/>
<text x="665" y="40" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#3c4fc6">1980</text>
<text x="665" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#2b2438">22 Masters</text>
<text x="665" y="183" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b6478">Reiki spreads worldwide</text></svg></figure>
<h3>Mikao Usui (1865–1926)</h3>
<p>Reiki as we know it began with Mikao Usui, a Japanese man with wide interests in Buddhism, medicine and spiritual study. According to the traditional account, in 1922 Usui undertook a 21-day fasting meditation on Mount Kurama, near Kyoto. At the end of it he experienced a powerful awakening and an understanding of how to channel healing energy.</p>
<p>That same year he founded the <strong>Usui Reiki Ryoho Gakkai</strong> (Usui Reiki Healing Method Society) in Tokyo, where he taught and treated many people, including survivors of the 1923 Great Kanto earthquake. He trained around twenty teachers before his death in 1926.</p>
<h3>The traditional story: four miracles</h3>
<p>Reiki teachers have passed down a story about the end of Usui's 21 days on Mount Kurama. On the last morning, a light came toward him and struck him on the forehead, and he saw the symbols he had been studying. On his way down the mountain, four things happened that are often called the <strong>four miracles</strong>:</p>
<ol>
<li>He stubbed his toe, put his hand on it, and the bleeding and pain stopped.</li>
<li>After 21 days of fasting, he ate a full meal at an inn without any stomach pain.</li>
<li>He eased the toothache and swollen face of the young woman who served him.</li>
<li>Back at the monastery, he relieved his friend the abbot's arthritis pain.</li>
</ol>
<p>Treat this as the traditional teaching story rather than documented history; it is told to show the gift Usui received and how simply Reiki works through the hands.</p>
<div class="callout warn">You may come across a story that Usui was a Christian minister or university president searching for how Jesus healed. Researchers have found no evidence for this; it is generally seen as a later Western embellishment.</div>
<h3>Chujiro Hayashi (1880–1940)</h3>
<p>Hayashi, a retired naval officer and physician, was one of Usui's master students. He opened a Reiki clinic in Tokyo and developed a more structured system, including standard hand positions and treatments with the recipient lying on a table, with several practitioners working at once.</p>
<h3>Hawayo Takata (1900–1980)</h3>
<p>Takata was a Japanese-American woman from Hawaii. In 1935, while seriously ill, she received treatment at Hayashi's clinic, recovered, and went on to train with him. As the story goes, she was about to have surgery when she heard an inner voice say the operation wasn't necessary, and asked her surgeon about other options; he sent her to Hayashi's clinic. After months of treatment she recovered, then trained and worked at the clinic. She brought Reiki to Hawaii in 1937, and Hayashi made her a Reiki Master in 1938, the first woman and the first person outside Japan to receive it. Before her death in 1980 she trained 22 Reiki Masters, through whom Reiki spread around the world.</p>
<h3>Reiki today</h3>
<p>Many branches now exist, including Usui Shiki Ryoho, Jikiden Reiki and Holy Fire Reiki. This course follows the general Usui system, which is the most widely taught. Practitioners trace their <strong>lineage</strong> back through their teachers to Usui.</p>
${check("Who opened a Reiki clinic in Tokyo and developed the standard hand positions?",["Hawayo Takata","Chujiro Hayashi","Mikao Usui"],1,"Hayashi's clinic used standard positions and group treatments, and it was there that Takata was treated and trained.")}
`;}},

{title:"The Five Reiki Principles", html:function(){return `
<div class="kicker">Lesson 3</div>
<h2>The Five Reiki Principles</h2>
${objectives(["recite the Five Principles","use a meditation to explore one principle","use the hand position that goes with each principle"])}
<p>Usui taught five principles, the <strong>Gokai</strong>, as the foundation of Reiki practice. Reiki is not only something you do with your hands; it's a way of living. A common translation:</p>
<ul class="principles">
<li>Just for today, I will not be angry.</li>
<li>Just for today, I will not worry.</li>
<li>Just for today, I will be grateful.</li>
<li>Just for today, I will do my work honestly.</li>
<li>Just for today, I will be kind to every living thing.</li>
</ul>
<h3>Why "just for today"?</h3>
<p>Promising never to be angry again is impossible. Committing to a single day is achievable, and each day is a fresh start. The phrase keeps the principles gentle and present-focused.</p>
<h3>Working with the principles</h3>
<ul>
<li><strong>Morning and evening:</strong> Usui recommended reciting the principles in <em>gassho</em> (palms together at the heart) each morning and evening.</li>
<li><strong>Anger and worry:</strong> These aren't about suppressing feelings. Notice them, breathe, and choose not to be ruled by them.</li>
<li><strong>Gratitude:</strong> Try naming three things you're grateful for each day.</li>
<li><strong>Honest work:</strong> This covers integrity in all you do, including your Reiki practice.</li>
<li><strong>Kindness:</strong> This includes kindness to yourself.</li>
</ul>
<p>This course lists the principles in the order of Usui's original Japanese, which begins with anger. Some English translations, including your manual, begin with worry. The meaning is the same.</p>
<h3>Meditating on a principle</h3>
<p>Your manual suggests reading the principles aloud at least twice a day, and keeping a framed copy where you'll see it (or in your healing room). To go deeper:</p>
<ol>
<li>Sit or lie comfortably and close your eyes.</li>
<li>Repeat one principle aloud several times, like a mantra.</li>
<li>As you settle into a meditative state, notice what happens in your mind and body: feelings, emotions and thoughts.</li>
<li>Afterward, write down everything you noticed. Repeat the meditation for each principle, and again each year, and compare your notes to see how you've grown.</li>
</ol>
<h3>A hand position for each principle</h3>
<p>Your manual gives a two-hand position to rebalance each principle (pp.23–27). You can use them on yourself or on another person; stay as long as feels right.</p>
${figKey()}
${principleHolds()}
<div class="callout">The Five Principles aren't commandments; they are gifts of wisdom.</div>
${check("Why does each principle begin with \"Just for today\"?",["Because Reiki only works for one day","Committing to one day at a time is achievable, and each day is a fresh start","It's a translation error"],1,"You don't have to be perfect. If you slip up today, you can begin again tomorrow.")}

<p>Many Reiki traditions link each chakra with a gland of the <strong>endocrine system</strong>, the glands that release hormones and, with the nervous system, keep the body in balance. It's a helpful map for where to place your hands, though it's symbolic rather than medical.</p>

<p>Because you are a channel, Reiki itself doesn't drain you. Still, many practitioners notice that after time with others, especially people who are stressed, grieving or in pain, they can feel heavy, tired or "not themselves." Good energetic hygiene keeps you clear and balanced, and it's a habit worth building from day one.</p>

<h3>2. Set your intention and shield</h3>
<p>Before a session, set a clear intention, such as: "I am a clear channel for Reiki. Only what is for the highest good flows through me, and I keep only my own energy."</p>
<p>Then visualize a shield of light surrounding you, like a bubble or a cloak of white or golden light. Picture it letting love and Reiki through while gently keeping out anything that isn't yours.</p>

<h3>4. Cleanse your space</h3>
<p>Open a window, ring a bell or singing bowl, use sound or intention, or burn incense or herbs if that's part of your practice. Many practitioners also give Reiki to the room itself before and after sessions.</p>

{title:"Ethics and Scope", html:function(){return `
<div class="kicker">Lesson 9</div>
<h2>Ethics and Scope of Practice</h2>
${objectives(["explain why Reiki complements, never replaces, medical care","get clear consent, including for touch","keep what people share confidential"])}
<p>Being a trustworthy practitioner matters as much as technique. These guidelines protect the people you work with, and they protect you.</p>
<h3>Reiki complements medical care</h3>
<ul>
<li><strong>Never diagnose.</strong> Even if you sense something in an area, don't name conditions or tell someone what's "wrong."</li>
<li><strong>Never prescribe</strong> or advise anyone to stop, change or skip medication or medical treatment.</li>
<li><strong>Never promise a cure</strong> or specific results.</li>
<li>Encourage anyone with health concerns to see a qualified medical professional.</li>
</ul>
<h3>Consent and boundaries</h3>
<ul>
<li>Get clear consent before every session, including for touch.</li>
<li>The recipient can stop the session at any time, for any reason.</li>
<li>With children, get consent from a parent or guardian and have them present.</li>
<li>Don't send Reiki to someone who has said no, even with good intentions.</li>
</ul>
<h3>Confidentiality</h3>
<p>What people share during sessions stays private. Don't discuss others' sessions without permission.</p>
<h3>Practicing responsibly</h3>
<p>Rules for hands-on practice differ between states and countries. If you later work with clients, check your local regulations and consider professional liability insurance. You'll learn more about this at Level 2.</p>
<div class="callout warn">If someone is in a medical emergency, call emergency services first. Reiki can be offered afterward, never instead.</div>
${check("During a session you sense something unusual around a friend's stomach. What do you say?",["Tell them they have a stomach problem","Nothing diagnostic; if they mention a health concern, encourage them to see a doctor","Suggest they change their diet"],1,"Never diagnose. Hibiki guide your hands; they are not a basis for telling anyone what's wrong.")}
`;}},

{title:"Every Stage of Life", html:function(){return `
<div class="kicker">Lesson 10</div>
<h2>Reiki Through Every Stage of Life</h2>
${objectives(["adapt Reiki for pregnancy, babies, children and older adults","offer Reiki with care at the end of life"])}
<p>Reiki is gentle enough for anyone, from before birth to the end of life. In every case, it offers comfort and support <em>alongside</em> medical care, never instead of it.</p>
<h3>Pregnancy</h3>
<ul>
<li>Many people find Reiki deeply relaxing during pregnancy, easing stress, tiredness and everyday aches.</li>
<li>It's a lovely way to connect with the baby. Parents and partners who are attuned can simply rest their hands on the belly.</li>
<li>Make the person comfortable. Many care providers advise against lying flat on the back later in pregnancy, so offer a side-lying position with pillows, or a seated session.</li>
<li>Touch the belly only with consent, or hover your hands just above it.</li>
<li>Reiki doesn't replace prenatal care. Any symptoms or worries go to their doctor or midwife.</li>
</ul>
<h3>Babies</h3>
<ul>
<li>Keep sessions short, just a few minutes. Babies take Reiki in quickly and will let you know when they've had enough.</li>
<li>Rest a hand lightly on their back or tummy, or simply let Reiki flow as you hold, feed or cuddle them.</li>
<li>New parents benefit too: Reiki can support rest and recovery after birth.</li>
<li>If you're ever worried about a baby, contact a doctor right away, however small it seems.</li>
</ul>
<h3>Children</h3>
<ul>
<li>Most children love Reiki. Keep sessions short, and let them choose touch or hands-off.</li>
<li>Reiki at bedtime can help them settle into sleep.</li>
<li>After a fall or a fright, give first aid first, then rest one hand on their tummy and one on their lower back to soothe them.</li>
<li>Share the Five Principles with them; children often take to them naturally.</li>
<li>Always have a parent or guardian's consent and presence (Lesson 9).</li>
</ul>
<h3>Older adults</h3>
<ul>
<li>Offer sessions in a chair or in bed, wherever they're most comfortable.</li>
<li>Use a very light touch, or hover your hands, over fragile skin or painful joints.</li>
<li>Reiki can bring calm, comfort and a sense of connection, especially for people who rarely receive caring touch.</li>
</ul>
<h3>End of life and grief</h3>
<p>Sitting with someone near the end of life is a profound privilege. Reiki can bring calm, ease anxiety, and offer the comfort of a caring presence.</p>
<ul>
<li><strong>Follow their lead.</strong> Respect their beliefs about death and what comes after, and never impose your own.</li>
<li><strong>Work with the care team.</strong> In a hospital or hospice, ask permission and follow the facility's guidelines.</li>
<li><strong>Keep it gentle.</strong> Short sessions, hands resting on the feet, hands or shoulders, or hovering above the body.</li>
<li><strong>Care for the family.</strong> Loved ones and caregivers often need Reiki as much as the person who is dying, both before and after the death.</li>

{title:"Animals, Plants & Everyday Life", html:function(){return `
<div class="kicker">Lesson 11</div>
<h2>Animals, Plants and Everyday Life</h2>
${objectives(["offer Reiki to animals on their terms","use Reiki with plants, food and water","find your own everyday uses"])}
<p>Reiki flows to every living thing. Your imagination is the only limit on how you share it.</p>
<h3>Animals</h3>
<p>Animals are often very sensitive to Reiki, and they're honest about what they want.</p>
<ul>
<li><strong>Let them come to you.</strong> Offer your hands and wait. Never hold an animal still for Reiki.</li>
<li><strong>Let them guide you.</strong> Animals often shift until your hand lands where they want it, and they'll move away when they've had enough.</li>
<li><strong>Cats, dogs and larger animals:</strong> begin behind the ears or on the shoulders, then follow the animal's lead.</li>
<li><strong>Small animals:</strong> cup birds or small pets gently in your hands, or hover your hands above them.</li>
<li><strong>Fish:</strong> hold your hands on either side of the tank.</li>
<li><strong>Unfamiliar, wild or large animals:</strong> stay at a safe distance. At Level 2, you'll learn to send Reiki from afar.</li>
<li>Reiki supports, but never replaces, veterinary care.</li>
</ul>
<h3>Plants and gardens</h3>
<ul>
<li>Hold seeds or bulbs in your cupped hands for a few minutes before planting.</li>
<li>Wrap your hands around potted plants, or rest them on leaves and stems.</li>
<li>Hold cut flowers by their stems, then give Reiki to the vase each day.</li>
<li>Rest your hands on a tree trunk, or give it a hug, for a longer session.</li>
<li>Give Reiki to the watering can before you water.</li>
</ul>
<div class="callout"><strong>Try it:</strong> plant two identical pots of seeds. Give one pot Reiki every day, and compare how they grow over a few weeks.</div>
<h3>Food and water</h3>
<ul>
<li>Hold your hands over your plate or glass for a moment before eating or drinking, with gratitude.</li>
<li>Let Reiki flow into food as you prepare it, especially meals for people you love.</li>
<li>After eating, rest your hands on your belly to support digestion.</li>
</ul>
<h3>Everyday life</h3>
<p>Give Reiki to your bath water, your bed before sleep, your home, your car before a journey, your workspace, or a letter before you send it. Keep your first-aid kit charged with Reiki too, alongside proper first aid, never instead of it.</p>
<div class="callout"><strong>Practice:</strong> make a list of as many ways to use Reiki in your daily life as you can think of, then try one new idea each day this week.</div>

`;}},

${objectives(["prepare for your attunement","understand the 21-day cleanse that follows","look after yourself through a healing crisis"])}
<p>An <strong>attunement</strong> (in Japanese, <em>reiju</em>) is the process in which a Reiki Master opens your connection to Reiki. In this course, your attunement is given by distance, meaning you and your teacher don't need to be in the same place.</p>

<h3>Arranging your attunement</h3>

<p>Attunements are offered on a sliding scale starting at $5, and every dollar supports ${TEACHER.business}. Once we've agreed on a time, read on to prepare.</p>
<h3>Preparing</h3>

e cx="214.0" cy="81.4" r="13" fill="#5347c4"/><text x="214.0" y="85.4" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff">19</text><circle cx="238.0" cy="59.1" r="13" fill="#6a3fc1"/><text x="238.0" y="63.1" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff">20</text><circle cx="267.6" cy="44.9" r="13" fill="#9b3fb5"/><text x="267.6" y="48.9" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff">21</text><text x="300" y="148" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="40" font-weight="300" fill="#2b2438">21</text><text x="300" y="172" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" letter-spacing="2" fill="#6b6478">DAYS OF</text><text x="300" y="190" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" letter-spacing="2" fill="#6b6478">INTEGRATION</text></svg></figure>
<p>During this time:</p>
<ul>
<li>Give yourself a full self-treatment every day.</li>
<li>Drink plenty of water and rest when you need to.</li>
<li>You may notice vivid dreams, emotional ups and downs, or tiredness as old patterns release. This is normal and passes.</li>
<li>Keep a journal of your experiences, including your dreams. It's lovely to look back on.</li>
</ul>
<h3>A healing crisis</h3>
<p>Sometimes, after an attunement or a session, people feel a little worse before they feel better: tired, emotional, achy, or unsettled. Practitioners call this a <strong>healing crisis</strong> or cleansing reaction. Think of a still pond: when it's stirred, sediment rises to the surface before the water settles clear again. Reiki doesn't create what comes up; it brings to the surface what was already there, so it can be released.</p>
<ul>
<li>Rest, drink plenty of water, and keep up your daily self-healing.</li>
<li>Be gentle with yourself, and let emotions move through.</li>
<li>These reactions are usually mild and pass within a few days.</li>
</ul>
<div class="callout warn">Never assume that a new, severe or worsening physical symptom is just a healing crisis, in yourself or in a client. See a doctor.</div>
<h3>A meditation for after your attunement</h3>
<ol>
<li>Sit comfortably with your eyes closed and rest your hands on your heart.</li>
<li>Breathe slowly. With each breath in, imagine light flowing in through your crown and filling your heart.</li>
<li>With each breath out, let that light spread through your whole body.</li>
<li>Notice whatever you feel, without needing it to be anything in particular.</li>
<li>After 10 minutes, bring your hands to gassho and give thanks.</li>
</ol>
<p>If anything feels overwhelming, reach out to your teacher.</p>

/* ===== Saved progress =====
   Progress is kept in this browser (localStorage). Learners can also copy a
   short resume code, or download a progress file, to continue on another
   device. Nothing is sent to any server. */
var STORE_KEY="reiki-course-"+COURSE.id+"-v1";
var state={v:[],cur:0,best:null,name:"",log:[]};
var storageOK=(function(){try{var k="__reiki_test__";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
var hadSaved=false;
function cleanState(s){
  var out={v:[],cur:0,best:null,name:"",log:[]};
  if(!s||typeof s!=="object")return out;
  if(Array.isArray(s.vt)){s.vt.forEach(function(t){for(var i=0;i<lessonCount();i++){if(LESSONS[i].title===t&&out.v.indexOf(i)<0)out.v.push(i);}});}
  else if(Array.isArray(s.v))s.v.forEach(function(i){i=parseInt(i,10);if(i>=0&&i<lessonCount()&&out.v.indexOf(i)<0)out.v.push(i);});
  var c=parseInt(s.cur,10);if(c>=0&&c<LESSONS.length)out.cur=c;
  if(typeof s.curT==="string"){for(var j=0;j<LESSONS.length;j++){if(LESSONS[j].title===s.curT)out.cur=j;}}
  var b=parseInt(s.best,10);if(b>=0&&b<=100)out.best=b;
  if(typeof s.name==="string")out.name=s.name.slice(0,80);
  if(Array.isArray(s.log))s.log.forEach(function(e){
    if(!e||typeof e!=="object")return;
    out.log.push({id:String(e.id||Date.now()+Math.random()),date:String(e.date||"").slice(0,10),type:String(e.type||"").slice(0,60),mins:Math.max(0,Math.min(600,parseInt(e.mins,10)||0)),did:String(e.did||"").slice(0,2000),noticed:String(e.noticed||"").slice(0,2000),ask:String(e.ask||"").slice(0,2000)});
  });
  return out;
}

}

}

/* ----- Resume codes: lessons done, current page and best score, with a checksum ----- */
var B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function makeCode(){
  var n=lessonCount(),bytes=[COURSE.level,n,state.cur,state.best===null?255:state.best];
  for(var i=0;i<Math.ceil(n/8);i++){var m=0;for(var j=0;j<8;j++){if(state.v.indexOf(i*8+j)>=0)m|=1<<j;}bytes.push(m);}
  var sum=0;bytes.forEach(function(b){sum=(sum*31+b)%251;});bytes.push(sum);
  var bits="";bytes.forEach(function(b){bits+=("00000000"+b.toString(2)).slice(-8);});
  while(bits.length%5)bits+="0";
  var s="";for(var k=0;k<bits.length;k+=5)s+=B32[parseInt(bits.substr(k,5),2)];
  return "L"+COURSE.level+"-"+s.match(/.{1,4}/g).join("-");
}
function readCode(code){
  code=String(code||"").toUpperCase().replace(/\s+/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  var m=code.match(/^1(\d)-?([0-9A-Z-]+)$/);
  if(!m)return {err:"That doesn't look like a resume code. It should start with L"+COURSE.level+"-."};
  if(parseInt(m[1],10)!==COURSE.level)return {err:"That code is for Reiki Level "+m[1]+". Please enter it in the Level "+m[1]+" course."};
  var body=m[2].replace(/-/g,""),bits="";
  for(var i=0;i<body.length;i++){var x=B32.indexOf(body[i]);if(x<0)return {err:"That code has a character that isn't used in resume codes. Please check it and try again."};bits+=("00000"+x.toString(2)).slice(-5);}
  var bytes=[];for(var k=0;k+8<=bits.length;k+=8)bytes.push(parseInt(bits.substr(k,8),2));
  if(bytes.length<5)return {err:"That code is too short. Please check it and try again."};
  var n=bytes[1],need=4+Math.ceil(n/8)+1;
  if(n!==lessonCount())return {err:"This code is from an earlier version of the course, which had a different number of lessons. Please mark your completed lessons again; your practice log isn't affected."};
  if(bytes.length<need)return {err:"That code is too short. Please check it and try again."};
  if(body.length!==Math.ceil(need*8/5)||/1/.test(bits.slice(need*8)))return {err:"That code didn't check out. Please check for typos and try again."};
  bytes=bytes.slice(0,need);
  var sum=0;for(var q=0;q<need-1;q++)sum=(sum*31+bytes[q])%251;
  if(sum!==bytes[need-1]||bytes[0]!==COURSE.level)return {err:"That code didn't check out. Please check for typos and try again."};
  var v=[];for(var i2=0;i2<n;i2++){if(bytes[4+Math.floor(i2/8)]&(1<<(i2%8)))v.push(i2);}
  return {v:v,cur:bytes[2],best:bytes[3]===255?null:bytes[3]};
}
