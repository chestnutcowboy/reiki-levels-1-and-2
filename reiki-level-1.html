<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reiki Level 1</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2438; --muted:#6b6478; --line:#ebe5dc;
  --ok:#1d7a4c; --bad:#b0322e;
  --rainbow:linear-gradient(90deg,#d64541,#f08a24,#f4b400,#2fa36b,#2e86de,#3c4fc6,#9b3fb5);
  /* current lesson's chakra color, set by script */
  --c:#d64541; --c-deep:#a8322f; --c-soft:#fbe9e8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:relative}
header h1{font-size:19px;margin:0;font-weight:normal;letter-spacing:.4px}
header h1 small{font:12px system-ui,sans-serif;opacity:.7;margin-left:8px;letter-spacing:1px;text-transform:uppercase}
header .prog{margin-left:auto;font:13px/1 system-ui,sans-serif;opacity:.9}
.track{height:6px;background:#e9e3ef;position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--rainbow);background-size:100vw 100%;transition:width .4s}
#menuBtn{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer}
.wrap{flex:1;display:flex;min-height:0}
nav{width:290px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 0;font:15px/1.35 system-ui,sans-serif}
nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:10px 18px 10px 14px;color:var(--ink);cursor:pointer;font:inherit}
nav button:hover{background:var(--soft)}
nav button.active{background:var(--soft);font-weight:600;border-left-color:var(--col)}
nav button:disabled{color:#aaa;cursor:not-allowed}
nav .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--col);margin-top:1px;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff}
nav .done .dot{background:var(--col)}
main{flex:1;overflow-y:auto;padding:32px 20px 40px}
article{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:34px 40px}
article h2{color:var(--c-deep);margin:0 0 6px;font-size:30px;font-weight:normal}
article .kicker{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:var(--c-deep);margin-bottom:4px}
article h3{margin:28px 0 6px;font-size:19px}
article a{color:var(--c-deep)}
.callout{background:var(--c-soft);border-left:4px solid var(--c);padding:12px 16px;border-radius:6px;margin:18px 0}
.callout.warn{background:#fdf3dc;border-color:#f4b400}
.principles{list-style:none;padding:0;margin:16px 0}
.principles li{padding:10px 14px;border-bottom:1px solid var(--line);font-style:italic}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft)}
.fig{margin:22px 0;text-align:center}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font:14px system-ui,sans-serif;color:var(--muted);margin-top:8px}
.principles li:nth-child(1){border-left:4px solid #d64541}.principles li:nth-child(2){border-left:4px solid #f08a24}.principles li:nth-child(3){border-left:4px solid #f4b400}.principles li:nth-child(4){border-left:4px solid #2fa36b}.principles li:nth-child(5){border-left:4px solid #3c4fc6}
.chakra{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.footer-nav{max-width:760px;margin:20px auto 0;display:flex;justify-content:space-between;gap:12px}
.btn{display:inline-block;background:var(--c-deep);color:#fff!important;border:0;border-radius:8px;padding:11px 22px;font:15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.secondary{background:#fff;color:var(--c-deep)!important;border:1px solid var(--c-deep)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rainbow-rule{height:4px;border:0;border-radius:2px;background:var(--rainbow);margin:26px 0}
.teacher{display:flex;gap:16px;align-items:center;background:var(--c-soft);border-radius:10px;padding:16px 18px;margin:18px 0}
.teacher .badge{flex:0 0 54px;height:54px;border-radius:50%;background:var(--rainbow);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 14px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;color:#fff;font:600 15px/32px system-ui,sans-serif;text-align:center;background:var(--sc,#888)}
.steps li:nth-child(1){--sc:#d64541}.steps li:nth-child(2){--sc:#2fa36b}.steps li:nth-child(3){--sc:#3c4fc6}
.steps .btn{margin-top:8px;margin-right:8px}
.paybox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px}
.paybox img{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;background:#fff}
.paybox .addr{font:14px system-ui,sans-serif;color:var(--muted)}
.paybox .addr strong{color:var(--ink)}
.q{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
.q p{margin:0 0 10px;font-weight:600}
.q label{display:block;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:16px}
.q label:hover{background:var(--c-soft)}
.q.right{border-color:var(--ok)} .q.wrong{border-color:var(--bad)}
.q .fb{font:14px system-ui,sans-serif;margin-top:8px}
.q.right .fb{color:var(--ok)} .q.wrong .fb{color:var(--bad)}
.result{padding:20px;border-radius:10px;margin-top:20px}
.result.fail{background:#f9e6e5;color:var(--bad);text-align:center;font-size:19px}
.cert{text-align:center;border-radius:12px;padding:26px 20px;background:#fff;border:2px solid transparent;background-image:linear-gradient(#fff,#fff),var(--rainbow);background-origin:border-box;background-clip:padding-box,border-box}
.cert .big{font-size:26px;color:var(--ink);margin:4px 0}
.cert .meta{font:14px system-ui,sans-serif;color:var(--muted)}
@media (max-width:820px){
  #menuBtn{display:block}
  nav{position:fixed;top:58px;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  nav.open{transform:none}
  article{padding:24px 18px}
  main{padding:16px 12px 30px}
  header h1 small{display:none}
}
/* ===== Saved progress, practice log, accessibility ===== */
.skip{position:absolute;left:-9999px;top:8px;z-index:20;background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;font:15px system-ui,sans-serif}
.skip:focus{left:8px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hbtn{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 10px;font:14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtns{display:flex;gap:8px;margin-left:12px}
:focus-visible{outline:3px solid #2e86de;outline-offset:2px}
article h2:focus{outline:none}
.status{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font:15px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.status.show{opacity:1;transform:translate(-50%,0)}
.complete-box{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:34px;padding:16px 18px;border:2px dashed var(--c);border-radius:10px;font:15px system-ui,sans-serif}
.complete-box span{color:var(--muted)}
.complete-box.is-done{border-style:solid;background:var(--c-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--c-deep);text-decoration:underline;cursor:pointer;font:inherit}
.todo li{margin:6px 0}
.codebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.codebox code{font:600 20px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px;background:var(--c-soft);padding:10px 14px;border-radius:8px;word-break:break-all}
.codebox input,.logform input,.logform select,.logform textarea{padding:9px 12px;border:1px solid #b9b1c4;border-radius:8px;font:16px system-ui,sans-serif;background:#fff;color:var(--ink)}
.codebox input{width:16em;max-width:100%;text-transform:uppercase;letter-spacing:1px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid #2e86de;outline-offset:2px}
.btn.danger{color:var(--bad)!important;border-color:var(--bad)}
.form-msg{font:15px system-ui,sans-serif;min-height:1px;margin:6px 0}
.form-msg.ok{color:var(--ok)} .form-msg.bad{color:var(--bad)}
.muted{color:var(--muted)}
.log-summary{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.log-summary div{flex:1 1 110px;background:var(--c-soft);border-radius:10px;padding:10px 12px;text-align:center;font:13px system-ui,sans-serif;color:var(--muted)}
.log-summary strong{display:block;font-size:24px;color:var(--ink)}
.logform{border:1px solid var(--line);border-radius:10px;padding:4px 18px 16px;margin:18px 0}
.logform label{display:block;font:15px system-ui,sans-serif;margin:10px 0}
.logform label input,.logform label select,.logform label textarea{display:block;width:100%;margin-top:4px}
.logform .row{display:flex;gap:12px;flex-wrap:wrap}
.logform .row label{flex:1 1 140px}
.logform .hint{color:var(--muted);font-size:13px}
.log-actions{margin:12px 0 4px}
.log-list{padding-left:22px}
.log-list li{border-bottom:1px solid var(--line);padding:10px 0}
.log-list p{margin:4px 0;font-size:16px}
.log-head{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font:15px system-ui,sans-serif}
.log-head .del{margin-left:auto;color:var(--bad);font-size:14px}
fieldset.q{display:block;min-width:0;margin:16px 0}
fieldset.q legend{font-weight:600;padding:0 4px;margin-bottom:6px}
@media (max-width:820px){
  header{padding:12px 12px;gap:8px}
  header .prog{display:none}
  .hbtns{margin-left:auto;gap:6px}
  .hbtn,#menuBtn{padding:6px 8px;font-size:13px}
}
@media (max-width:420px){
  header h1{font-size:16px}
  .hbtn .lbl{display:none}
}
@media print{
  header,nav,.track,.footer-nav,.status,.skip,.no-print,.complete-box{display:none!important}
  html,body,.wrap,main{display:block;height:auto;overflow:visible;background:#fff}
  main{padding:0}
  article{border:0;padding:0;max-width:none}
  a{color:inherit}
}
</style>
</head>

</div>

<h2>Reiki Level 1</h2>
<p>Shoden means "first teachings." In this level you'll learn what Reiki is, where it comes from, and how to give treatments to yourself and others. Level 1 is mostly about <em>you</em>: building a daily self-practice and getting comfortable with how Reiki feels in your hands.</p>
<div class="teacher"><div class="badge">✦</div><div><strong>Your teacher: ${TEACHER.name}</strong><br>Reiki Master and founder of <a href="${TEACHER.website}" target="_blank" rel="noopener">${TEACHER.business}</a></div></div>
<h3>Why this course is free</h3>
<p>Reiki is meant for everyone. Too often it's put behind high prices that keep it out of reach for the people who could benefit from it most. This course is my way of opening the door: Reiki Levels 1 and 2 are completely free for anyone who wants to take them.</p>
<h3>Your path through Reiki</h3>
<table>
<tr><th>Level</th><th>What it covers</th><th>Cost</th></tr>

<tr><td><strong>Level 2 · Okuden</strong></td><td>The three Reiki symbols, distance healing and working with clients</td><td>Free</td></tr>
<tr><td><strong>Level 3 · Shinpiden</strong><br>Master/Teacher</td><td>The Master symbol, advanced practice, passing attunements and teaching. Includes your Reiki Master certificate, which certifies you to practice and teach as a Reiki Master.</td><td>Sliding scale from $11.11</td></tr>
</table>
<h3>What you'll learn</h3>
<ul>
<li>What Reiki is and what happens in a session</li>
<li>The history of Reiki, from Mikao Usui to the present day</li>
<li>The Five Reiki Principles</li>
<li>A practical introduction to the chakras and the aura</li>
<li>Self-healing: hand positions and routines for your daily practice</li>
<li>Hand positions for treating others</li>
<li>Protecting and cleansing your own energy</li>
<li>Ethics, consent and the scope of Reiki practice</li>
<li>Reiki through every stage of life, from pregnancy to the end of life</li>
<li>Reiki for animals, plants, food and everyday life</li>
<li>How your Level 1 attunement works</li>
</ul>
<h3>How this course works</h3>
<p>Work through the lessons in order. Progress isn't saved between visits, so set aside some time, or note which lesson you reached so you can jump back to it from the lesson list. The final quiz unlocks once you've opened every lesson; you'll need ${PASS_MARK}% to pass, and you can retake it as often as you like.</p>
<p>You're welcome to take Levels 1 and 2 without receiving an attunement; the knowledge here is yours either way. But the attunement is what opens your connection to Reiki, and it is <strong>vital if you want to become a Reiki Master</strong>: an attunement at each level is required before you can take Level 3.</p>
<hr class="rainbow-rule">

${attunementSteps()}

<h3>Where your exchange goes</h3>
<p>Every dollar from attunements goes directly back into <strong>${TEACHER.business}</strong>, an independent press publishing trans and nonbinary writers and artists. Your support helps fund its arts magazine, which pays contributors and gives away free handmade copies in the Portland community, and <em>Queer Civic Notes</em>, which helps keep the community informed and engaged.</p>

<h2>What Is Reiki?</h2>
<p><strong>Reiki</strong> (霊気, pronounced "ray-key") is a Japanese practice in which the practitioner places their hands lightly on or just above the body to channel life-force energy. The word combines two parts:</p>

<text x="320" y="110" text-anchor="middle" font-size="34" fill="#6b6478" font-family="system-ui,-apple-system,Segoe UI,sans-serif">+</text>
<text x="185" y="166" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#2b2438">Rei</text>
<text x="185" y="189" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#6b6478">universal · spiritual · sacred</text>
<text x="455" y="166" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#2b2438">Ki</text>
<text x="455" y="189" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#6b6478">life-force energy</text></svg></figure>
<p>Together, Reiki is commonly understood as "spiritually guided life-force energy."</p>
<h3>The practitioner as a channel</h3>
<p>A central idea in Reiki is that the practitioner doesn't use their <em>own</em> energy. You act as a channel: Reiki flows through you to the recipient. This is why giving Reiki should leave you feeling balanced rather than drained. If you feel depleted after a session, that's a sign to revisit grounding and protection (Lesson 7).</p>
<h3>What happens in a session</h3>
<ul>
<li>The recipient stays fully clothed, sitting in a chair or lying on a treatment table.</li>
<li>The practitioner places their hands lightly on, or a few inches above, a series of positions on the body.</li>
<li>Sessions usually last 45–90 minutes; self-treatment can be 20–60 minutes.</li>
<li>People commonly report warmth, tingling, deep relaxation, emotional release or simply calm. Some feel very little, and that's fine too.</li>
</ul>
<h3>Supporting your energy</h3>
<p>Everyone has life-force energy, and everyday habits affect how freely it flows. This isn't about being perfect; Reiki is for everyone, whatever their habits. But knowing what nourishes you and what drains you helps you notice the difference.</p>
<table>
<tr><th>Tends to nourish your energy</th><th>Tends to drain it</th></tr>
<tr><td>Restful sleep<br>Water and fresh, whole foods<br>Time outdoors and in sunlight<br>Gentle movement and stretching<br>Slow, deep breathing<br>Laughter, connection and creativity<br>Gratitude and quiet time</td><td>Ongoing stress and rushing<br>Too little sleep<br>Heavy alcohol or drug use<br>Lots of highly processed food<br>Endless screens and news<br>Harsh self-talk<br>Conflict left unresolved</td></tr>
</table>
<h3>Reiki is not a religion</h3>
<p>Reiki has spiritual roots but needs no particular belief system. People of every faith, and of none, practice it.</p>
<div class="callout">Reiki is a complementary practice. It supports relaxation and wellbeing alongside medical care and is never a replacement for it. We'll cover this fully in Lesson 8.</div>
`;}},

<h3>Mikao Usui (1865–1926)</h3>
<p>Reiki as we know it began with Mikao Usui, a Japanese man with wide interests in Buddhism, medicine and spiritual study. According to the traditional account, in 1922 Usui undertook a 21-day fasting meditation on Mount Kurama, near Kyoto. At the end of it he experienced a powerful awakening and an understanding of how to channel healing energy.</p>
<p>That same year he founded the <strong>Usui Reiki Ryoho Gakkai</strong> (Usui Reiki Healing Method Society) in Tokyo, where he taught and treated many people, including survivors of the 1923 Great Kanto earthquake. He trained around twenty teachers before his death in 1926.</p>
<div class="callout warn">You may come across a story that Usui was a Christian minister or university president searching for how Jesus healed. Researchers have found no evidence for this; it is generally seen as a later Western embellishment.</div>
<h3>Chujiro Hayashi (1880–1940)</h3>
<p>Hayashi, a retired naval officer and physician, was one of Usui's master students. He opened a Reiki clinic in Tokyo and developed a more structured system, including standard hand positions and treatments with the recipient lying on a table, with several practitioners working at once.</p>
<h3>Hawayo Takata (1900–1980)</h3>
<p>Takata was a Japanese-American woman from Hawaii. In 1935, while seriously ill, she received treatment at Hayashi's clinic, recovered, and went on to train with him. She brought Reiki to Hawaii and later mainland America, and before her death trained 22 Reiki Masters, through whom Reiki spread around the world.</p>
<h3>Reiki today</h3>
<p>Many branches now exist, including Usui Shiki Ryoho, Jikiden Reiki and Holy Fire Reiki. This course follows the general Usui system, which is the most widely taught. Practitioners trace their <strong>lineage</strong> back through their teachers to Usui.</p>
`;}},

{title:"The Five Reiki Principles", html:function(){return `
<div class="kicker">Lesson 3</div>
<h2>The Five Reiki Principles</h2>
<p>Usui taught five principles, the <strong>Gokai</strong>, as the foundation of Reiki practice. Reiki is not only something you do with your hands; it's a way of living. A common translation:</p>
<ul class="principles">
<li>Just for today, I will not be angry.</li>
<li>Just for today, I will not worry.</li>
<li>Just for today, I will be grateful.</li>
<li>Just for today, I will do my work honestly.</li>
<li>Just for today, I will be kind to every living thing.</li>
</ul>
<h3>Why "just for today"?</h3>
<p>Promising never to be angry again is impossible. Committing to a single day is achievable, and each day is a fresh start. The phrase keeps the principles gentle and present-focused.</p>
<h3>Working with the principles</h3>
<ul>
<li><strong>Morning and evening:</strong> Usui recommended reciting the principles in <em>gassho</em> (palms together at the heart) each morning and evening.</li>
<li><strong>Anger and worry:</strong> These aren't about suppressing feelings. Notice them, breathe, and choose not to be ruled by them.</li>
<li><strong>Gratitude:</strong> Try naming three things you're grateful for each day.</li>
<li><strong>Honest work:</strong> This covers integrity in all you do, including your Reiki practice.</li>
<li><strong>Kindness:</strong> This includes kindness to yourself.</li>
</ul>
<div class="callout"><strong>Practice:</strong> For the next week, read the principles aloud each morning and pick one to focus on for the day.</div>
`;}},

<div class="kicker">Lesson 5</div>
<h2>Self-Healing with Reiki</h2>
<p>Self-healing is the heart of Level 1. Before Reiki is something you give to others, it's something you give to yourself. A daily self-treatment deepens your connection to Reiki, keeps your own energy balanced, builds sensitivity in your hands, and is your strongest foundation as a practitioner. Usui himself taught that healing begins with the self.</p>
<div class="callout">You can't pour from an empty cup. The more consistently you treat yourself, the clearer a channel you become for others.</div>

<h3>Preparing for self-healing</h3>
<ol>
<li><strong>Find your space.</strong> Choose somewhere quiet. Sit with your feet flat on the floor or lie on your back; a bed is perfect. Use pillows under your elbows so your arms can rest without strain.</li>
<li><strong>Gassho.</strong> Bring your palms together at your heart. Take a few slow breaths and let the day settle.</li>
<li><strong>Breathe in Reiki (Joshin Kokyu Ho).</strong> This traditional Japanese breathing technique is a lovely way to begin. As you breathe in through your nose, imagine light flowing in through the crown of your head and down to your lower belly, just below the navel (the <em>hara</em>). As you breathe out, imagine that light spreading through your whole body and out through your skin. Repeat for a few minutes.</li>
<li><strong>Set your intention,</strong> for example: "I am open to receiving Reiki for my highest good."</li>

ght="700" fill="#9b3fb5">10</text><text x="410" y="348" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#2b2438">Lower back (behind)</text><text x="390" y="395" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b6478">Dashed = reach behind you</text></svg></figure>

<tr><td>1</td><td>Eyes / face</td><td>Palms over the eyes, fingertips on the forehead</td><td>Third eye: clarity, intuition, resting a busy mind</td></tr>
<tr><td>2</td><td>Crown</td><td>Hands on top of the head, fingertips meeting</td><td>Crown: spiritual connection, calm</td></tr>
<tr><td>3</td><td>Back of head</td><td>Hands cupping the back of the head</td><td>Settling racing thoughts; a good one for sleep</td></tr>
<tr><td>4</td><td>Throat</td><td>Hands resting gently around the throat or jaw</td><td>Throat: speaking your truth, releasing held-back words</td></tr>
<tr><td>5</td><td>Heart</td><td>Hands on the upper chest</td><td>Heart: love, grief, compassion for yourself</td></tr>
<tr><td>6</td><td>Solar plexus</td><td>Hands on the upper abdomen, below the ribs</td><td>Solar plexus: confidence, stress you carry in your stomach</td></tr>
<tr><td>7</td><td>Navel</td><td>Hands on either side of the navel</td><td>Sacral: emotions, creativity, the <em>hara</em></td></tr>
<tr><td>8</td><td>Lower abdomen</td><td>Hands forming a V over the lower belly</td><td>Root and sacral: grounding, safety</td></tr>
<tr><td>9</td><td>Shoulders</td><td>Hands reaching over the shoulders onto the upper back</td><td>Tension and the burdens you carry</td></tr>
<tr><td>10</td><td>Lower back</td><td>Hands on the lower back at the kidneys</td><td>Feeling supported; grounding</td></tr>
</table>
<p>Finish with your feet if you can reach them comfortably, sitting or lying with your knees bent. It helps bring your energy back down and grounds you.</p>

<h3>Closing your session</h3>
<p>Return to gassho and thank Reiki and yourself. Sweep your aura by passing your hands a few inches above your body from head to toe, or use Kenyoku (Lesson 7). Take a moment before getting up and drink a glass of water.</p>

<h3>Making it a daily practice</h3>
<table>
<tr><th>Routine</th><th>When</th><th>What to do</th></tr>
<tr><td><strong>Full session</strong><br>30–60 min</td><td>A few times a week, and daily during the 21 days after your attunement</td><td>All 10 positions, plus the feet</td></tr>
<tr><td><strong>Morning reset</strong><br>10 min</td><td>Before you get out of bed</td><td>Read the Five Principles, then crown, heart and solar plexus</td></tr>
<tr><td><strong>Bedtime</strong><br>15 min</td><td>Lying in bed</td><td>Back of head, heart, solar plexus, lower abdomen. It's fine to fall asleep; Reiki keeps flowing.</td></tr>
<tr><td><strong>In the moment</strong><br>1–3 min</td><td>Whenever you feel stressed</td><td>One hand on your heart, one on your solar plexus. Breathe.</td></tr>
</table>

<h3>Reiki breaks through the day</h3>
<p>Your body runs in natural cycles of roughly 90 to 120 minutes, called <strong>ultradian rhythms</strong>. At the low point of each cycle you may notice yawning, wandering focus, or a craving for coffee or a snack. Psychologist Ernest Rossi suggested treating these dips as a cue to rest. Instead of pushing through, take a 10–20 minute Reiki break: close your eyes, rest one hand on your heart and one on your solar plexus, and let Reiki flow. You'll often return clearer and more refreshed.</p>
<h3>Listening to your body</h3>
<ul>
<li><strong>Follow your hands.</strong> If a position feels warm, tingly or "busy," stay longer. If it feels complete, move on. The positions are a guide, not a rule.</li>
<li><strong>Let emotions move.</strong> Tears, sighs, laughter or memories can surface. Let them come and go without judging them. This is a normal part of self-healing.</li>
<li><strong>Feeling nothing is okay.</strong> Some days are quiet. Reiki is still flowing; your sensitivity will grow with practice.</li>
<li><strong>Journal.</strong> A few notes after each session (sensations, feelings, how you slept) help you notice changes over weeks.</li>
</ul>
<div class="callout warn">Self-healing supports your wellbeing, but it doesn't replace medical or mental health care. If you're dealing with a health condition, use Reiki alongside the care of a qualified professional.</div>

{title:"Treating Others", html:function(){return `
<div class="kicker">Lesson 6</div>
<h2>Treating Others</h2>
<p>At Level 1 you can share Reiki with friends, family and pets. (Working with paying clients is covered at Level 2.)</p>
<h3>Before the session</h3>
<ul>
<li><strong>Ask permission.</strong> Never give Reiki without consent.</li>
<li>Explain what will happen and ask whether they prefer light touch or hands just above the body.</li>
<li>Ask them to remove shoes, glasses and anything tight. They stay fully clothed.</li>
<li>Wash your hands, center yourself, and set your intention.</li>
</ul>
<h3>Preparing yourself</h3>
<ul>
<li>Remove rings, watches and bracelets, and loosen anything tight.</li>
<li>Avoid alcohol before giving Reiki.</li>
<li>Wash your hands, keep your nails short, and skip strong perfumes or scents.</li>
<li>Silence your phone. Keep water and tissues nearby, and a blanket in case they get cold.</li>
</ul>
<h3>Opening the session</h3>
<p>Remember that you aren't the healer: the person receiving draws Reiki through you to where it's needed. Many practitioners begin with a short <strong>invocation</strong>, a moment of intention that sets ego aside. Stand at their head (or rest your hands on their shoulders if they're seated), bring your hands to gassho, and say something in your own words that fits your beliefs, for example:</p>
<div class="callout"><em>"I ask that Reiki flow through me for [name]'s highest good. May I be a clear and loving channel, and may this healing go wherever it is most needed."</em></div>
<p>Then <strong>sweep the aura</strong>: hold your hands about six inches above their body and move slowly from head to feet three times. This smooths their energy, helps you tune in, and lets you notice any areas that draw your hands.</p>
<h3>Table treatment positions</h3>
<p>With the recipient lying face up, work from head to feet; then, if comfortable, they turn over for the back.</p>
<table>
<tr><th>Front</th><th>Back</th></tr>
<tr><td>Over the eyes · sides of the head · back of the head · throat (hands hovering) · heart · solar plexus · navel · lower abdomen (hands hovering) · knees · feet</td><td>Shoulders · shoulder blades · middle back · lower back · sacrum (hands hovering) · backs of knees · soles of feet</td></tr>
</table>
<h3>Chair treatment</h3>
<p>A seated session of 15–20 minutes works well when a table isn't practical: shoulders, crown, sides of head, upper chest and back, and finally the knees and feet.</p>
<h3>Group treatments</h3>
<p>Dr. Hayashi often had several practitioners treat one person together at his clinic. Group treatments are powerful, quicker (often 10–20 minutes), and a lovely way to practice with other students.</p>
<ul>
<li>Decide beforehand who leads. The leader works at the head and decides when to move on.</li>
<li>Share out the other positions. With four or more people, have one at each end and the others along the middle.</li>
<li>Choose one person to smooth the aura at the end.</li>
<li>Everyone washes their hands before and after, and you share your experiences afterward.</li>
</ul>
<h3>Sensitive areas</h3>
<div class="callout warn">Always hover your hands over the throat, chest (especially for women), groin and buttocks rather than touching. Keep touch light everywhere else, and stop or adjust immediately if the person feels uncomfortable.</div>
<h3>After the session</h3>
<p>Gently tell them the session is complete, give them time to sit up slowly, offer water, and ask how they feel. Listen rather than interpret.</p>
`;}},

<h3>4. Cleanse your space</h3>
<p>Open a window, ring a bell or singing bowl, use sound or intention, or burn incense or herbs if that's part of your practice. Many practitioners also give Reiki to the room itself before and after sessions.</p>
<h3>5. Look after yourself</h3>
<ul>
<li>Keep up your daily self-treatment; it's your most important protection.</li>
<li>Rest, drink water, and spend time in nature.</li>
<li>Salt baths (Epsom or sea salt) are a long-standing cleansing ritual.</li>
<li>Know your limits. It's okay not to give Reiki when you're unwell or exhausted.</li>
</ul>
<div class="callout"><strong>Protection comes from a place of strength, not fear.</strong> These practices are about staying clear and centered so you can give your best. Reiki can only be used for good, and your own steady self-practice is the strongest foundation you have.</div>
`;}},

{title:"Ethics and Scope", html:function(){return `
<div class="kicker">Lesson 8</div>
<h2>Ethics and Scope of Practice</h2>
<p>Being a trustworthy practitioner matters as much as technique. These guidelines protect the people you work with, and they protect you.</p>
<h3>Reiki complements medical care</h3>
<ul>
<li><strong>Never diagnose.</strong> Even if you sense something in an area, don't name conditions or tell someone what's "wrong."</li>
<li><strong>Never prescribe</strong> or advise anyone to stop, change or skip medication or medical treatment.</li>
<li><strong>Never promise a cure</strong> or specific results.</li>
<li>Encourage anyone with health concerns to see a qualified medical professional.</li>
</ul>
<h3>Consent and boundaries</h3>
<ul>
<li>Get clear consent before every session, including for touch.</li>
<li>The recipient can stop the session at any time, for any reason.</li>
<li>With children, get consent from a parent or guardian and have them present.</li>
<li>Don't send Reiki to someone who has said no, even with good intentions.</li>
</ul>
<h3>Confidentiality</h3>
<p>What people share during sessions stays private. Don't discuss others' sessions without permission.</p>
<h3>Practicing responsibly</h3>
<p>Rules for hands-on practice differ between states and countries. If you later work with clients, check your local regulations and consider professional liability insurance. You'll learn more about this at Level 2.</p>
<div class="callout warn">If someone is in a medical emergency, call emergency services first. Reiki can be offered afterward, never instead.</div>
`;}},

{title:"Every Stage of Life", html:function(){return `
<div class="kicker">Lesson 9</div>
<h2>Reiki Through Every Stage of Life</h2>
<p>Reiki is gentle enough for anyone, from before birth to the end of life. In every case, it offers comfort and support <em>alongside</em> medical care, never instead of it.</p>
<h3>Pregnancy</h3>
<ul>
<li>Many people find Reiki deeply relaxing during pregnancy, easing stress, tiredness and everyday aches.</li>
<li>It's a lovely way to connect with the baby. Parents and partners who are attuned can simply rest their hands on the belly.</li>
<li>Make the person comfortable. Many care providers advise against lying flat on the back later in pregnancy, so offer a side-lying position with pillows, or a seated session.</li>
<li>Touch the belly only with consent, or hover your hands just above it.</li>
<li>Reiki doesn't replace prenatal care. Any symptoms or worries go to their doctor or midwife.</li>
</ul>
<h3>Babies</h3>
<ul>
<li>Keep sessions short, just a few minutes. Babies take Reiki in quickly and will let you know when they've had enough.</li>
<li>Rest a hand lightly on their back or tummy, or simply let Reiki flow as you hold, feed or cuddle them.</li>
<li>New parents benefit too: Reiki can support rest and recovery after birth.</li>
<li>If you're ever worried about a baby, contact a doctor right away, however small it seems.</li>
</ul>
<h3>Children</h3>
<ul>
<li>Most children love Reiki. Keep sessions short, and let them choose touch or hands-off.</li>
<li>Reiki at bedtime can help them settle into sleep.</li>
<li>After a fall or a fright, give first aid first, then rest one hand on their tummy and one on their lower back to soothe them.</li>
<li>Share the Five Principles with them; children often take to them naturally.</li>
<li>Always have a parent or guardian's consent and presence (Lesson 8).</li>
</ul>
<h3>Older adults</h3>
<ul>
<li>Offer sessions in a chair or in bed, wherever they're most comfortable.</li>
<li>Use a very light touch, or hover your hands, over fragile skin or painful joints.</li>
<li>Reiki can bring calm, comfort and a sense of connection, especially for people who rarely receive caring touch.</li>
</ul>
<h3>End of life and grief</h3>
<p>Sitting with someone near the end of life is a profound privilege. Reiki can bring calm, ease anxiety, and offer the comfort of a caring presence.</p>
<ul>
<li><strong>Follow their lead.</strong> Respect their beliefs about death and what comes after, and never impose your own.</li>
<li><strong>Work with the care team.</strong> In a hospital or hospice, ask permission and follow the facility's guidelines.</li>
<li><strong>Keep it gentle.</strong> Short sessions, hands resting on the feet, hands or shoulders, or hovering above the body.</li>
<li><strong>Care for the family.</strong> Loved ones and caregivers often need Reiki as much as the person who is dying, both before and after the death.</li>
<li><strong>Care for yourself.</strong> This work can stir your own grief. Give yourself Reiki and reach out for support.</li>
</ul>
`;}},

{title:"Animals, Plants & Everyday Life", html:function(){return `
<div class="kicker">Lesson 10</div>
<h2>Animals, Plants and Everyday Life</h2>
<p>Reiki flows to every living thing. Your imagination is the only limit on how you share it.</p>
<h3>Animals</h3>
<p>Animals are often very sensitive to Reiki, and they're honest about what they want.</p>
<ul>
<li><strong>Let them come to you.</strong> Offer your hands and wait. Never hold an animal still for Reiki.</li>
<li><strong>Let them guide you.</strong> Animals often shift until your hand lands where they want it, and they'll move away when they've had enough.</li>
<li><strong>Cats, dogs and larger animals:</strong> begin behind the ears or on the shoulders, then follow the animal's lead.</li>
<li><strong>Small animals:</strong> cup birds or small pets gently in your hands, or hover your hands above them.</li>
<li><strong>Fish:</strong> hold your hands on either side of the tank.</li>
<li><strong>Unfamiliar, wild or large animals:</strong> stay at a safe distance. At Level 2, you'll learn to send Reiki from afar.</li>
<li>Reiki supports, but never replaces, veterinary care.</li>
</ul>
<h3>Plants and gardens</h3>
<ul>
<li>Hold seeds or bulbs in your cupped hands for a few minutes before planting.</li>
<li>Wrap your hands around potted plants, or rest them on leaves and stems.</li>
<li>Hold cut flowers by their stems, then give Reiki to the vase each day.</li>
<li>Rest your hands on a tree trunk, or give it a hug, for a longer session.</li>
<li>Give Reiki to the watering can before you water.</li>
</ul>
<div class="callout"><strong>Try it:</strong> plant two identical pots of seeds. Give one pot Reiki every day, and compare how they grow over a few weeks.</div>
<h3>Food and water</h3>
<ul>
<li>Hold your hands over your plate or glass for a moment before eating or drinking, with gratitude.</li>
<li>Let Reiki flow into food as you prepare it, especially meals for people you love.</li>
<li>After eating, rest your hands on your belly to support digestion.</li>
</ul>
<h3>Everyday life</h3>
<p>Give Reiki to your bath water, your bed before sleep, your home, your car before a journey, your workspace, or a letter before you send it. Keep your first-aid kit charged with Reiki too, alongside proper first aid, never instead of it.</p>
<div class="callout"><strong>Practice:</strong> make a list of as many ways to use Reiki in your daily life as you can think of, then try one new idea each day this week.</div>
`;}},

e cx="214.0" cy="81.4" r="13" fill="#5347c4"/><text x="214.0" y="85.4" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff">19</text><circle cx="238.0" cy="59.1" r="13" fill="#6a3fc1"/><text x="238.0" y="63.1" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff">20</text><circle cx="267.6" cy="44.9" r="13" fill="#9b3fb5"/><text x="267.6" y="48.9" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff">21</text><text x="300" y="148" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="40" font-weight="300" fill="#2b2438">21</text><text x="300" y="172" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" letter-spacing="2" fill="#6b6478">DAYS OF</text><text x="300" y="190" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" letter-spacing="2" fill="#6b6478">INTEGRATION</text></svg></figure>

<h3>A healing crisis</h3>
<p>Sometimes, after an attunement or a session, people feel a little worse before they feel better: tired, emotional, achy, or unsettled. Practitioners call this a <strong>healing crisis</strong> or cleansing reaction. Think of a still pond: when it's stirred, sediment rises to the surface before the water settles clear again. Reiki doesn't create what comes up; it brings to the surface what was already there, so it can be released.</p>

<li>Notice whatever you feel, without needing it to be anything in particular.</li>
<li>After 10 minutes, bring your hands to gassho and give thanks.</li>

function cleanState(s){
  var out={v:[],cur:0,best:null,name:"",log:[]};
  if(!s||typeof s!=="object")return out;
  if(Array.isArray(s.v))s.v.forEach(function(i){i=parseInt(i,10);if(i>=0&&i<lessonCount()&&out.v.indexOf(i)<0)out.v.push(i);});
  var c=parseInt(s.cur,10);if(c>=0&&c<LESSONS.length)out.cur=c;
  var b=parseInt(s.best,10);if(b>=0&&b<=100)out.best=b;
  if(typeof s.name==="string")out.name=s.name.slice(0,80);
  if(Array.isArray(s.log))s.log.forEach(function(e){
    if(!e||typeof e!=="object")return;
    out.log.push({id:String(e.id||Date.now()+Math.random()),date:String(e.date||"").slice(0,10),type:String(e.type||"").slice(0,60),mins:Math.max(0,Math.min(600,parseInt(e.mins,10)||0)),did:String(e.did||"").slice(0,2000),noticed:String(e.noticed||"").slice(0,2000),ask:String(e.ask||"").slice(0,2000)});
  });
  return out;
}
function load(){
  if(!storageOK)return;
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){state=cleanState(JSON.parse(raw));hadSaved=true;}}catch(e){}
}
function save(){
  if(!storageOK)return;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}
}

/* ----- Resume codes: lessons done, current page and best score, with a checksum ----- */
var B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function makeCode(){
  var n=lessonCount(),bytes=[COURSE.level,n,state.cur,state.best===null?255:state.best];
  for(var i=0;i<Math.ceil(n/8);i++){var m=0;for(var j=0;j<8;j++){if(state.v.indexOf(i*8+j)>=0)m|=1<<j;}bytes.push(m);}
  var sum=0;bytes.forEach(function(b){sum=(sum*31+b)%251;});bytes.push(sum);
  var bits="";bytes.forEach(function(b){bits+=("00000000"+b.toString(2)).slice(-8);});
  while(bits.length%5)bits+="0";
  var s="";for(var k=0;k<bits.length;k+=5)s+=B32[parseInt(bits.substr(k,5),2)];
  return "L"+COURSE.level+"-"+s.match(/.{1,4}/g).join("-");
}
function readCode(code){
  code=String(code||"").toUpperCase().replace(/\s+/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  var m=code.match(/^1(\d)-?([0-9A-Z-]+)$/);
  if(!m)return {err:"That doesn't look like a resume code. It should start with L"+COURSE.level+"-."};
  if(parseInt(m[1],10)!==COURSE.level)return {err:"That code is for Reiki Level "+m[1]+". Please enter it in the Level "+m[1]+" course."};
  var body=m[2].replace(/-/g,""),bits="";
  for(var i=0;i<body.length;i++){var x=B32.indexOf(body[i]);if(x<0)return {err:"That code has a character that isn't used in resume codes. Please check it and try again."};bits+=("00000"+x.toString(2)).slice(-5);}
  var bytes=[];for(var k=0;k+8<=bits.length;k+=8)bytes.push(parseInt(bits.substr(k,8),2));
  if(bytes.length<5)return {err:"That code is too short. Please check it and try again."};
  var n=bytes[1],need=4+Math.ceil(n/8)+1;
  if(bytes.length<need)return {err:"That code is too short. Please check it and try again."};
  if(body.length!==Math.ceil(need*8/5)||/1/.test(bits.slice(need*8)))return {err:"That code didn't check out. Please check for typos and try again."};
  bytes=bytes.slice(0,need);
  var sum=0;for(var q=0;q<need-1;q++)sum=(sum*31+bytes[q])%251;
  if(sum!==bytes[need-1]||bytes[0]!==COURSE.level)return {err:"That code didn't check out. Please check for typos and try again."};
  var v=[];for(var i2=0;i2<n;i2++){if(bytes[4+Math.floor(i2/8)]&(1<<(i2%8)))v.push(i2);}
  return {v:v,cur:bytes[2],best:bytes[3]===255?null:bytes[3]};
}

/* ===== Helpers ===== */
var nav=document.getElementById("nav"),content=document.getElementById("content");
var mainEl=document.getElementById("main");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function lessonCount(){return LESSONS.length-1;}
function isDone(i){return state.v.indexOf(i)>=0;}
function allDone(){for(var i=0;i<lessonCount();i++){if(!isDone(i))return false;}return true;}
function passed(){return state.best!==null&&state.best>=PASS_MARK;}
var toastTimer;
function toast(msg){var statusEl=document.getElementById("status");if(!statusEl)return;statusEl.textContent=msg;statusEl.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){statusEl.classList.remove("show");},4000);}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function prettyDate(s){var p=String(s).split("-");if(p.length!==3)return esc(s);var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d)?esc(s):d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});}
var view="lesson";

/* ===== Navigation ===== */
function renderNav(){
  nav.innerHTML="";
  LESSONS.forEach(function(l,i){
    var b=document.createElement("button");
    b.style.setProperty("--col",col(i)[0]);b.style.setProperty("--soft",col(i)[2]);
    var done=l.quiz?passed():isDone(i),locked=l.quiz&&!allDone();
    b.className=(done?"done":"")+(view==="lesson"&&i===state.cur?" active":"");
    if(view==="lesson"&&i===state.cur)b.setAttribute("aria-current","page");
    b.innerHTML='<span class="dot" aria-hidden="true">'+(done?"✓":"")+'</span><span>'+l.title+(locked?' <span aria-hidden="true">🔒</span><span class="sr">(locked until every lesson is complete)</span>':'')+(done?'<span class="sr"> (complete)</span>':'')+'</span>';
    b.onclick=function(){go(i,true);closeMenu();};
    nav.appendChild(b);
  });
  var doneN=state.v.length;
  document.getElementById("fill").style.width=Math.round((doneN+(passed()?1:0))/LESSONS.length*100)+"%";
  document.getElementById("prog").textContent=doneN+" of "+lessonCount()+" lessons complete"+(state.best!==null?" · Best quiz "+state.best+"%":"");
}
function setColors(i){var c=col(i),root=document.documentElement.style;root.setProperty("--c",c[0]);root.setProperty("--c-deep",c[1]);root.setProperty("--c-soft",c[2]);}
function focusTop(){mainEl.scrollTop=0;window.scrollTo(0,0);var h=content.querySelector("h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}}
function completeBox(i){
  var d=isDone(i);
  return '<div class="complete-box'+(d?' is-done':'')+'"><div><strong>'+(d?'Lesson complete ✓':'Finished this lesson?')+'</strong><br><span>'+(d?'Nice work. You can unmark it if you want to come back to it.':'Mark it complete to track your progress. All lessons must be complete before the final quiz.')+'</span></div>'
    +'<button class="btn'+(d?' secondary':'')+'" id="markBtn" aria-pressed="'+d+'">'+(d?'Unmark':'Mark lesson complete')+'</button></div>';
}
function go(i,userNav){
  view="lesson";state.cur=i;
  var l=LESSONS[i];setColors(i);
  if(l.quiz){ if(allDone())renderQuiz(); else renderLocked(); }
  else{
    content.innerHTML=l.html()+completeBox(i);
    bindMark(i);
  }
  document.title=l.title+" · "+COURSE.label;
  updateFooter();renderNav();save();
  if(userNav)focusTop();
}
function bindMark(i){
  document.getElementById("markBtn").onclick=function(){
    var k=state.v.indexOf(i);
    if(k>=0)state.v.splice(k,1); else state.v.push(i);
    save();renderNav();
    content.querySelector(".complete-box").outerHTML=completeBox(i);
    bindMark(i);
    document.getElementById("markBtn").focus();
    toast(isDone(i)?"Lesson marked complete.":"Lesson unmarked.");
  };
}
function updateFooter(){
  var i=state.cur,fn=document.querySelector(".footer-nav");
  fn.style.display=(view==="lesson")?"flex":"none";
  document.getElementById("prevBtn").disabled=(i===0);
  var nb=document.getElementById("nextBtn");
  nb.style.visibility=(i===LESSONS.length-1)?"hidden":"visible";
  nb.textContent=(i+1<LESSONS.length&&LESSONS[i+1].quiz)?"Go to quiz →":"Next →";
}
function renderLocked(){
  var miss=[];for(var i=0;i<lessonCount();i++){if(!isDone(i))miss.push(i);}
  var h='<div class="kicker">Assessment</div><h2>Final Quiz</h2><div class="callout warn"><strong>Almost there.</strong> The quiz unlocks once every lesson is marked complete. You have '+miss.length+' lesson'+(miss.length===1?'':'s')+' left:</div><ul class="todo">';
  miss.forEach(function(i){h+='<li><button class="linkbtn" data-go="'+i+'">'+LESSONS[i].title+'</button></li>';});
  h+='</ul><p>At the end of each lesson, use the <strong>Mark lesson complete</strong> button.</p>';
  content.innerHTML=h;
  content.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.getAttribute("data-go"),true);};});
}

/* ===== Quiz ===== */
function renderQuiz(){
  var h='<div class="kicker">Assessment</div><h2>Final Quiz</h2><p>Answer all '+QUIZ.length+' questions. You need '+PASS_MARK+'% to pass, and you can retake the quiz as many times as you like.</p><label for="learnerName" style="display:block;font:15px system-ui,sans-serif;margin:14px 0 4px">Your name (shown on your results)</label><input id="learnerName" type="text" autocomplete="name" value="'+esc(state.name)+'" style="width:100%;max-width:360px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:16px system-ui,sans-serif">';
  QUIZ.forEach(function(q,qi){
    h+='<fieldset class="q" id="q'+qi+'"><legend>'+(qi+1)+'. '+q.q+'</legend>';
    q.a.forEach(function(a,ai){h+='<label><input type="radio" name="q'+qi+'" value="'+ai+'"> '+a+'</label>';});
    h+='<div class="fb" aria-live="polite"></div></fieldset>';
  });
  h+='<p class="form-msg" id="quizMsg" role="alert"></p><button class="btn" id="submitQuiz">Submit answers</button><div id="result"></div>';
  content.innerHTML=h;
  document.getElementById("learnerName").onchange=function(){state.name=this.value.trim().slice(0,80);save();};
  document.getElementById("submitQuiz").onclick=gradeQuiz;
}
function gradeQuiz(){
  var correct=0,missing=[];
  QUIZ.forEach(function(q,qi){if(!document.querySelector('input[name="q'+qi+'"]:checked'))missing.push(qi+1);});
  var msg=document.getElementById("quizMsg");
  if(missing.length){msg.textContent="Please answer every question before submitting. Still unanswered: "+missing.join(", ")+".";document.getElementById("q"+(missing[0]-1)).scrollIntoView({behavior:"smooth",block:"center"});return;}
  msg.textContent="";
  QUIZ.forEach(function(q,qi){
    var sel=parseInt(document.querySelector('input[name="q'+qi+'"]:checked').value,10);
    var box=document.getElementById("q"+qi),ok=sel===q.c;
    if(ok)correct++;
    box.className="q "+(ok?"right":"wrong");
    box.querySelector(".fb").textContent=(ok?"Correct. ":"Not quite. The answer is: "+q.a[q.c]+". ")+q.why;
  });
  var score=Math.round(correct/QUIZ.length*100),pass=score>=PASS_MARK;
  if(state.best===null||score>state.best)state.best=score;
  state.name=(document.getElementById("learnerName").value||"").trim().slice(0,80);
  save(); renderNav();
  var r=document.getElementById("result");
  r.className="result "+(pass?"pass":"fail");
  if(pass){
    var who=esc(state.name);
    var d=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
    var sessions=state.log.length;
    r.innerHTML='<div class="cert"><div class="meta">'+COURSE.certLine+'</div><div class="big">✦ Passed with '+score+'% ✦</div>'
      +(who?'<div style="font-size:19px">'+who+'</div>':'')
      +'<div class="meta">Completed '+d+' · Taught by '+TEACHER.name+', Reiki Master</div>'
      +(sessions?'<div class="meta">Practice sessions logged: '+sessions+'</div>':'')+'</div>'
      +'<h3>Congratulations! Here\'s your next step</h3><p>Take a screenshot of the box above, then follow these steps to arrange your attunement:</p>'
      +attunementSteps()
      +'<div class="callout"><strong>What\'s next:</strong> '+COURSE.nextStep.replace("{teacher}",esc(TEACHER.name))+'</div>'
      +masterEnrollmentSection();
  } else {
    r.innerHTML="You scored "+score+"%. You need "+PASS_MARK+"% to pass. Review the feedback above and try again.<br><button class='btn' style='margin-top:12px' id='retakeBtn'>Retake quiz</button>";
    document.getElementById("retakeBtn").onclick=function(){renderQuiz();focusTop();};
  }
  document.getElementById("submitQuiz").disabled=true;
  r.scrollIntoView({behavior:"smooth"});
}

              :'<div class="callout warn"><strong>This browser isn\'t saving your progress</strong> (private browsing or blocked site storage can do this). Copy your resume code below before you close the page.</div>')

   +'<div class="codebox"><label class="sr" for="codeIn">Resume code</label><input id="codeIn" type="text" placeholder="L'+COURSE.level+'-XXXX-XXXX" autocomplete="off" spellcheck="false"><button class="btn" id="useCode">Restore</button></div><p class="form-msg" id="codeMsg" role="alert"></p>'
   +'<h3>Back up everything, including your practice log</h3><p>Your practice log notes are too long to fit in a code. Download a progress file to keep a copy or move everything to another device.</p>'
   +'<p><button class="btn secondary" id="dlBtn">Download progress file</button> <label class="btn secondary filebtn">Restore from file<input type="file" id="fileIn" accept=".json,application/json"></label></p><p class="form-msg" id="fileMsg" role="alert"></p>'
   +'<h3>Start over</h3><p>Clear all progress and your practice log from this browser.</p><p><button class="btn secondary danger" id="resetBtn">Reset everything</button></p><p class="form-msg" id="resetMsg" role="alert"></p>'
   +'<p><button class="btn" id="backBtn">← Back to the lessons</button></p>';
  content.innerHTML=h;focusTop();
  document.getElementById("copyCode").onclick=function(){copyText(code,"Resume code copied.");};
  document.getElementById("useCode").onclick=function(){

    state.v=r.v.filter(function(i){return i<lessonCount();});state.cur=Math.min(r.cur,LESSONS.length-1);state.best=r.best;
    save();m.className="form-msg ok";m.textContent="Progress restored: "+state.v.length+" of "+lessonCount()+" lessons complete.";renderNav();
    document.getElementById("resumeCode").textContent=makeCode();
  };
  document.getElementById("dlBtn").onclick=function(){
    var data=JSON.stringify({course:"reiki-"+COURSE.id,saved:new Date().toISOString(),progress:state},null,2);
    downloadFile("reiki-level-"+COURSE.level+"-progress-"+today()+".json",data,"application/json");
  };
  document.getElementById("fileIn").onchange=function(){
    var f=this.files&&this.files[0],m=document.getElementById("fileMsg");if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{var d=JSON.parse(rd.result);
        if(!d||d.course!=="reiki-"+COURSE.id){m.className="form-msg bad";m.textContent="That file isn't a progress file for "+COURSE.label+".";return;}
        state=cleanState(d.progress);save();renderNav();showProgress();toast("Progress restored from file.");
      }catch(e){m.className="form-msg bad";m.textContent="That file couldn't be read. Please choose the .json file you downloaded from this course.";}
    };
    rd.readAsText(f);
  };
  var armed=false;
  document.getElementById("resetBtn").onclick=function(){
    var m=document.getElementById("resetMsg");
    if(!armed){armed=true;this.textContent="Yes, erase everything";m.className="form-msg bad";m.textContent="This can't be undone. Download a progress file first if you might want it back. Press the button again to confirm.";return;}
    state=cleanState(null);save();renderNav();showProgress();toast("Progress cleared.");
  };
  document.getElementById("backBtn").onclick=function(){go(state.cur,true);};
}
function copyText(t,msg){
  function fallback(){var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg);}catch(e){toast("Couldn't copy automatically. Please select the text and copy it.");}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(msg);},fallback);}else fallback();
}
function downloadFile(name,text,type){
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast("Downloaded "+name+".");}
  catch(e){toast("Download isn't available here. Use the resume code instead.");}
}

  var counts={};state.log.forEach(function(e){counts[e.type]=(counts[e.type]||0)+1;});

   +'<p>Reiki is learned by doing. After each practice, take a minute to note what you did and what you noticed. Your log stays in this browser (back it up from <button class="linkbtn" id="toProgress">My progress</button>), and you can print it or email it to your teacher.</p>'
   +'<div class="callout">'+COURSE.logGoal+'</div>'
   +'<div class="log-summary"><div><strong>'+state.log.length+'</strong><span>sessions</span></div><div><strong>'+mins+'</strong><span>minutes</span></div>';
  COURSE.logTypes.forEach(function(t){h+='<div><strong>'+(counts[t]||0)+'</strong><span>'+esc(t.toLowerCase())+'</span></div>';});
  h+='</div><form id="logForm" class="logform no-print" novalidate><h3>Add a session</h3>'
   +'<div class="row"><label>Date<input type="date" id="lDate" value="'+today()+'" required></label>'
   +'<label>Type<select id="lType">'+COURSE.logTypes.map(function(t){return '<option>'+esc(t)+'</option>';}).join("")+'</select></label>'
   +'<label>Minutes<input type="number" id="lMins" min="0" max="600" inputmode="numeric" placeholder="e.g. 30"></label></div>'
   +'<label>What did you do? <span class="hint">'+COURSE.logHint+'</span><textarea id="lDid" rows="2"></textarea></label>'
   +'<label>What did you notice? <span class="hint">Sensations in your hands, feelings, what the recipient said</span><textarea id="lNoticed" rows="2"></textarea></label>'
   +'<label>Questions for your teacher <span class="hint">Optional</span><textarea id="lAsk" rows="2"></textarea></label>'
   +'<p class="form-msg" id="logMsg" role="alert"></p><button class="btn" type="submit">Save session</button></form>';
  h+='<div class="log-actions no-print"><button class="btn secondary" id="printLog">Print log</button> <button class="btn secondary" id="mailLog">Email log to '+esc(TEACHER.name.split(" ")[0])+'</button></div>';
  h+='<h3>Your sessions</h3>';
  if(!state.log.length)h+='<p class="muted">No sessions yet. Your first one will appear here.</p>';
  else{
    h+='<ol class="log-list" reversed>';
    state.log.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;}).forEach(function(e){
      h+='<li><div class="log-head"><strong>'+prettyDate(e.date)+'</strong> · '+esc(e.type)+(e.mins?' · '+e.mins+' min':'')+'<button class="linkbtn no-print del" data-id="'+esc(e.id)+'">Delete</button></div>'
        +(e.did?'<p><em>Did:</em> '+esc(e.did)+'</p>':'')+(e.noticed?'<p><em>Noticed:</em> '+esc(e.noticed)+'</p>':'')+(e.ask?'<p><em>Question:</em> '+esc(e.ask)+'</p>':'')+'</li>';
    });
    h+='</ol>';
  }
  h+='<p class="no-print"><button class="btn" id="backBtn2">← Back to the lessons</button></p>';
  content.innerHTML=h;focusTop();
  document.getElementById("toProgress").onclick=showProgress;
  document.getElementById("logForm").onsubmit=function(ev){
    ev.preventDefault();
    var g=function(id){return document.getElementById(id).value.trim();},m=document.getElementById("logMsg");
    if(!g("lDate")){m.className="form-msg bad";m.textContent="Please choose a date.";return;}
    if(!g("lDid")&&!g("lNoticed")){m.className="form-msg bad";m.textContent="Add a few words about what you did or noticed.";return;}
    state.log.push(cleanState({log:[{id:Date.now()+"-"+Math.floor(Math.random()*1e6),date:g("lDate"),type:g("lType"),mins:g("lMins"),did:g("lDid"),noticed:g("lNoticed"),ask:g("lAsk")}]}).log[0]);

    else{b.setAttribute("data-armed","1");b.textContent="Confirm delete";}
  };});
  document.getElementById("printLog").onclick=function(){document.body.classList.add("print-log");window.print();setTimeout(function(){document.body.classList.remove("print-log");},500);};
  document.getElementById("mailLog").onclick=function(){
    var lines=["Hi "+TEACHER.name.split(" ")[0]+",","","Here is my "+COURSE.label+" practice log ("+state.log.length+" sessions, "+mins+" minutes).",""];
    var list=state.log.slice().sort(function(a,b){return a.date<b.date?1:-1;}),body,shown=0;
    for(var i=0;i<list.length;i++){
      var e=list[i],t=["• "+e.date+" · "+e.type+(e.mins?" · "+e.mins+" min":"")];
      if(e.did)t.push("  Did: "+e.did);if(e.noticed)t.push("  Noticed: "+e.noticed);if(e.ask)t.push("  Question: "+e.ask);
      var next=lines.concat(t);if(encodeURIComponent(next.join("\n")).length>1600&&shown)break;
      lines=next;shown++;
    }
    if(shown<list.length)lines.push("","(Showing my "+shown+" most recent sessions. I can send the full log as a file.)");
    lines.push("","Thank you!",state.name||"");
    body=lines.join("\n");
    location.href="mailto:"+TEACHER.email+"?subject="+encodeURIComponent(COURSE.label+" practice log")+"&body="+encodeURIComponent(body);
  };
  document.getElementById("backBtn2").onclick=function(){go(state.cur,true);};
}

/* ===== Wiring ===== */
var menuBtn=document.getElementById("menuBtn");
function closeMenu(){nav.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");}
document.getElementById("prevBtn").onclick=function(){if(state.cur>0)go(state.cur-1,true);};
document.getElementById("nextBtn").onclick=function(){if(state.cur<LESSONS.length-1)go(state.cur+1,true);};
menuBtn.onclick=function(){var o=nav.classList.toggle("open");menuBtn.setAttribute("aria-expanded",o?"true":"false");};
document.getElementById("logBtn").onclick=showLog;
document.getElementById("progressBtn").onclick=showProgress;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&nav.classList.contains("open")){closeMenu();menuBtn.focus();}});
load();
go(Math.min(state.cur,LESSONS.length-1),false);
if(hadSaved&&(state.v.length||state.log.length))toast("Welcome back. You're on: "+LESSONS[state.cur].title+".");
</script>
</body>
</html>
